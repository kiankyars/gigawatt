name: Publish course to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate course and generated page
        run: |
          PYTHONPATH=src python -m gigawatt.build_course --check
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/math.test.mjs

      - name: Stage the course site
        run: |
          mkdir -p _site
          cp diagram/index.html _site/index.html
          python - <<'PY'
          from pathlib import Path
          redirect = '''<!doctype html>
          <html lang="en"><meta charset="utf-8"><title>GIGAWATT</title>
          <meta http-equiv="refresh" content="0;url=./">
          <link rel="canonical" href="./">
          <script>location.replace("./" + location.search + location.hash);</script>
          <p>The course has moved. <a href="./">Open GIGAWATT.</a></p></html>
          '''
          aliases = (
              "course.html", "course_v2.html", "v1.html", "hybrid.html",
              "phase1_generation.html", "phase2_transmission.html",
              "phase3_campus.html", "phase4_building.html",
              "phase5_compute.html", "phase6_heat.html",
          )
          for name in aliases:
              (Path("_site") / name).write_text(redirect, encoding="utf-8")
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
