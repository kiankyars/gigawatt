name: Publish course to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate course and generated page
        run: |
          PYTHONPATH=src python -m gigawatt.build_course --check
          PYTHONPATH=src python -m gigawatt.build_expanded --check
          PYTHONPATH=src python -m gigawatt.build_domain_map --check
          PYTHONPATH=src python -m gigawatt.research check --include-candidates
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs

      - name: Stage the course site
        run: |
          PYTHONPATH=src python -m gigawatt.stage_site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
