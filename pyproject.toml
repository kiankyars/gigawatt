[project]
name = "gigawatt"
version = "0.1.0"
description = "GIGAWATT: an interactive data center course from watts to racks"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gigawatt-build = "gigawatt.build_course:main"
gigawatt-symbols = "gigawatt.sheet:main"
gigawatt-layout = "gigawatt.layout:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
