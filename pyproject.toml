[project]
name = "gigawatt"
version = "0.1.0"
description = "From Watts to Tokens: an interactive course on AI data centers"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gigawatt-build = "gigawatt.build_course:main"
gigawatt-expand = "gigawatt.build_expanded:main"
gigawatt-map = "gigawatt.build_domain_map:main"
gigawatt-research = "gigawatt.research:main"
gigawatt-symbols = "gigawatt.sheet:main"
gigawatt-layout = "gigawatt.layout:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
