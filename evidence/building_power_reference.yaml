schema_version: 1

subject:
  id: gigawatt_building_power_reference
  canonical_name: GIGAWATT generic data-center building-power reference dossier
  scope: >-
    Generic spatial and functional power-path teaching, dual-path load
    compatibility, planned-maintenance versus fault-tolerance boundaries, and
    protection-coordination limits for a data-center building.

accessed_as_of: '2026-08-31'

evidence_boundary:
  included_scope: >-
    An illustrative data-center electrical path and equipment-space layout;
    generic dual-path and single-cord transfer concepts; the conditions that
    limit continuity when one path is unavailable; Uptime Institute's current
    distinction between planned maintainability and fault tolerance; and the
    need to coordinate source, UPS, switching, and protection behavior.
  excluded_scope: >-
    Any prescribed voltage, capacity, redundancy level, Tier classification,
    breaker setting, protection scheme, transfer performance, UPS runtime,
    equipment count, product selection, or Abilene design, as-built topology,
    switching state, fault response, maintenance procedure, or operating claim.
  promotion_rule: >-
    These sources provide conceptual teaching references, not a complete design.
    A drawn A/B path cannot be promoted into continuity, concurrent
    maintainability, fault tolerance, certification, or a site-specific
    topology unless the full path, load compatibility, capacity, protection,
    common-mode dependencies, construction, and operating state are established.

sources:
  schneider_electrical_distribution_wp61:
    publisher: Schneider Electric Data Center Science Center
    title: Electrical Distribution Equipment in Data Center Environments, White Paper 61, Revision 2
