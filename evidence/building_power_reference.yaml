    publication_date: '2019-07-03'
    review_date: null
    accessed_as_of: '2026-08-31'
    date_note: >-
      Schneider's official document page dates revision 2 to 2019-07-03; the
      PDF identifies itself as White Paper 61 and explicitly limits its main
      block diagram to an example architecture.

  schneider_two_cords_2014:
    publisher: Schneider Electric
    title: Why Two Cords Do Not Guarantee Power Redundancy to an IT Device
    kind: primary_manufacturer_technical_article
    url: https://blog.se.com/datacenter/architecture/2014/08/06/two-cords-guarantee-power-redundancy-device/
    publication_date: '2014-08-06'
    review_date: null
    accessed_as_of: '2026-08-31'
    date_note: Dated Schneider Electric technical article published 2014-08-06.

  uptime_tier_certification_current:
    publisher: Uptime Institute
    title: Tier Certification Overview
    kind: primary_standard_owner_requirements_page
    url: https://uptimeinstitute.com/tier-certification
    publication_date: null
    review_date: null
    accessed_as_of: '2026-08-31'
    date_note: >-
      Undated current Uptime Institute page as accessed; the course uses only
      its current high-level Tier III and Tier IV performance distinctions and
      does not claim certification for any reference topology or site.

  eaton_power_source_behavior_current:
    publisher: Eaton
    title: Power Source Behavior and Effect on Power Distribution
    kind: primary_manufacturer_white_paper_landing_page
