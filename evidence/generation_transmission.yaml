schema_version: 1

subject:
  id: gigawatt_generation_transmission_reference
  canonical_name: GIGAWATT generation and transmission teaching reference

accessed_as_of: '2026-08-31'

evidence_boundary:
  included_scope: >-
    Stable, generic physical principles for electricity generation, storage,
    voltage step-up, transmission-network power flow, continuous supply-demand
    balancing, substations, and the distinction between generation and
    large-load interconnection processes.
  excluded_scope: >-
    Any Abilene as-built or operating claim; technology cost, emissions,
    availability, reliability, or deployment rankings; universal project
    schedules; and any implication that a contract determines a physical
    electricity route.
  promotion_rule: >-
    These facts support conceptual teaching only. They cannot be promoted into
    an Abilene design, installed topology, operating state, commercial term, or
    site schedule. Fast-changing interconnection rules and thresholds must
    retain their explicit access date.

