schema_version: 1

subject:
  id: gigawatt_delivery_resilience_reference
  canonical_name: GIGAWATT delivery and electrical-resilience reference dossier
  scope: >-
    Dated equipment-procurement observations, delivery and acceptance gates,
    synchronized AI-load behavior, grid-facing transient effects, and distinct
    UPS, rack-storage, and behind-the-meter BESS roles used by the course.

accessed_as_of: '2026-08-27'

evidence_boundary:
  included_scope: >-
    Dated U.S. transformer-market observations; manufacturer-specific gas-turbine
    slot, standardized cooling-package, and liquid-cooling commissioning
    evidence; generic and observed AI-load dynamics; generic ride-through
    mechanisms; and the future-only BESS posture shown in the Longhorn review
    drawing.
  excluded_scope: >-
    Any universal equipment lead time; any Abilene procurement, delivery,
    installation, acceptance, transient waveform, ride-through setting, UPS or
    rack-storage design; and any installed, energized, rated, connected, or
    operating Abilene BESS claim.
  promotion_rule: >-
    Every lead-time or availability value remains tied to its equipment class,
    manufacturer or market, region, and evidence date. Generic transient and
    ride-through behavior cannot be promoted into an Abilene operating profile.
    A package marked future in a review drawing is not procured, installed,
    energized, commissioned, or operating.

