    lifecycle: operating_business_model
    as_of: '2025-06-30'
    source_ids: [microsoft_2025_annual_report]
    posture: confirmed

  pue_energy_boundary:
    value: >-
      PUE is total data-center energy consumption over a continuous 12-month
      period divided by IT-equipment energy consumption over the same period;
      IT equipment includes equipment used to store, process, and transport data.
    unit: authoritative energy-accounting definition
    scope: ISO/IEC 30134-2:2026 PUE; not an Abilene measurement
    basis: The standard defines the numerator, denominator, period, and IT-equipment boundary.
    lifecycle: accounting_standard
    as_of: '2026-01-16'
    source_ids: [iso_iec_30134_2_2026]
    posture: authoritative_guidance

  facility_energy_to_it_energy_recipe:
    value: >-
      For a matching continuous 12-month boundary, scenario IT energy equals
      scenario total data-center energy divided by scenario PUE. An
      average-power route instead requires direct IT-power metering or a
      boundary-matched interim or partial PUE over the same averaging interval;
      annual PUE must not be silently treated as a point-in-time operating ratio.
    unit: scenario calculation rule
    scope: Energy-accounting step in a hypothetical scenario; not an Abilene estimate
    basis: Algebra from the ISO PUE definition, with the standard's period and boundary preserved.
    lifecycle: derived_scenario_method
    as_of: '2026-08-27'
    source_ids: [iso_iec_30134_2_2026]
    posture: derived_from_authoritative_sources

  dgx_gb_nvl72_product_reference:
    value: >-
      One NVIDIA DGX GB NVL72 rack contains 72 GPUs across 18 compute trays and
      has approximate rack power consumption of 120 kW.
    unit: manufacturer product configuration
    scope: NVIDIA DGX GB rack-scale product documentation; not Abilene installed quantity or draw
    basis: NVIDIA specifies the rack composition and approximate rack consumption.
    lifecycle: product_documented
    as_of: '2026-03-03'
    source_ids: [nvidia_dgx_gb_hardware_2026]
    posture: confirmed_model_spec

  training_mfu_definition:
    value: >-
      Model FLOPs utilization is observed training throughput in tokens per
      second divided by the theoretical maximum token throughput of the same
      system operating at peak FLOPs, counting the model-required forward and
      backward operations rather than implementation-dependent rematerialization.
    unit: training-efficiency definition
    scope: Training-system analysis in the PaLM paper; not inference utilization or Abilene MFU
    basis: The PaLM authors define MFU and distinguish it from hardware FLOPs utilization.
    lifecycle: published_method
    as_of: '2022-10-05'
    source_ids: [palm_2022]
    posture: authoritative_guidance

  dense_decoder_training_flops_per_token_method:
    value: >-
      For the PaLM paper's dense decoder-only training boundary, theoretical
      FLOPs per token are 6N plus 12LHQT, where N is parameter count and L, H,
      Q, and T are layers, attention heads, head dimension, and sequence length.
    unit: published training-method boundary
    scope: >-
      Dense decoder-only training under the PaLM counting convention; not a
      general inference formula and not an Abilene estimate
    basis: The PaLM appendix publishes the FLOPs-per-token and MFU equations.
    lifecycle: published_method
    as_of: '2022-10-05'
    source_ids: [palm_2022]
    posture: authoritative_guidance

  dense_decoder_training_tokens_recipe:
    value: >-
      Scenario training tokens per second equal exact active aggregate peak
      matmul FLOP/s times MFU measured for the same model and system, divided by
      the model's FLOPs-per-token term. Supply active hardware quantity and
      applicable per-device performance explicitly. If the route begins from
      accelerator power, reconcile the selected inventory's measured power to
      that same power boundary. Apply a separate fleet active-duty factor only
      when MFU is conditional on active execution.
    unit: derived training scenario rule
    scope: >-
      Dense decoder-only training under the PaLM counting convention; not a
      general inference formula and not an Abilene estimate
    basis: >-
      Derived application of the PaLM FLOPs-per-token and MFU equations with
      explicit hardware, power, and activity boundaries.
    lifecycle: derived_scenario_method
    as_of: '2026-08-27'
    source_ids: [palm_2022, nvidia_dgx_gb_hardware_2026]
    posture: derived_from_authoritative_sources

  inference_batching_dependency:
    value: >-
      Triton dynamic batching combines requests and typically increases
      throughput; batch size and queue delay are configured per model and can
      trade increased latency for throughput.
    unit: runtime performance dependency
    scope: NVIDIA Triton inference serving; not an Abilene runtime configuration
    basis: NVIDIA documents the behavior and recommends measuring latency and throughput while tuning.
    lifecycle: product_documented
    as_of: '2026-08-27'
    source_ids: [nvidia_triton_batching_2_59_1]
    posture: authoritative_guidance

  inference_measurement_boundary:
    value: >-
      A defensible inference-throughput result names the model, dataset or
      workload, quality target, scenario, system under test, and latency
      constraints. MLPerf separates Offline measured throughput from Server
      maximum supported throughput under benchmark-specific latency limits and
      records time to first token and time per output token for LLMs.
    unit: benchmark measurement boundary
    scope: MLPerf Inference methodology; not an Abilene benchmark result
    basis: MLCommons defines distinct scenarios, metrics, quality gates, and LLM latency measures.
    lifecycle: benchmark_method
    as_of: '2026-08-27'
    source_ids: [mlcommons_inference_rules]
    posture: authoritative_guidance

  inference_tokens_recipe:
    value: >-
      Use measured tokens per joule for the exact model, weights or quantization,
      hardware, software, batch and concurrency policy, input/output-length
      distribution, quality target, and latency boundary, so matching
      accelerator watts times tokens per joule yields tokens per second.
      Alternatively, scale exact-system measured tokens per second only by a
      matching system count and measured scale-efficiency factor, with matching
      measured power as a consistency check. Facility MW or product peak FLOPs
      alone do not establish inference tokens per second.
    unit: scenario calculation rule
    scope: Hypothetical inference scenario; not an Abilene estimate
    basis: >-
      NVIDIA documents batching-dependent latency/throughput and MLCommons
      requires workload-, system-, quality-, scenario-, and latency-specific measurement.
    lifecycle: derived_scenario_method
    as_of: '2026-08-27'
    source_ids: [nvidia_triton_batching_2_59_1, mlcommons_inference_rules]
    posture: derived_from_authoritative_sources

  mw_to_tokens_scenario_recipe:
    value: >-
      Choose one output and one common averaging interval. For a power-rate
      route, start with measured average facility power over that interval;
      obtain matching average IT power from direct metering or a
      boundary-matched interim or partial PUE, then obtain accelerator power
      from direct metering or a measured IT-power share. For training, supply
      exact active hardware quantity, applicable aggregate peak matmul FLOP/s,
      and MFU measured for the same model and system; divide aggregate peak
      FLOP/s times MFU by model FLOPs per token. Apply a separate fleet
      active-duty factor only when MFU is conditional on active execution, and
      reconcile the inventory's measured power with accelerator power. For
      inference, multiply matching accelerator watts by tokens per joule
      measured for the exact model, weights or quantization, hardware, software,
      batching, input/output distribution, quality, and latency boundary; or
      scale exact-system tokens per second with matching system count and
      measured scale efficiency. For an energy-yield route, start with facility
      energy over the interval, derive matching IT energy, then use measured
      accelerator-energy share and matching tokens per joule, or integrate the
      rate route over the same interval, to produce token count. Annual PUE is
      valid only for its matching annual boundary. Propagate ranges and stop
      with no estimate when any required site input is unavailable.
    unit: assumption-driven scenario recipe
    scope: General teaching recipe; produces no Abilene token estimate
    basis: >-
      The recipe preserves ISO energy boundaries, NVIDIA product/runtime
      distinctions, the PaLM training-MFU definition, and MLPerf measurement
      constraints without substituting product nameplate for observed operation.
    lifecycle: derived_scenario_method
    as_of: '2026-08-27'
    source_ids:
      - iso_iec_30134_2_2026
      - nvidia_dgx_gb_hardware_2026
      - nvidia_triton_batching_2_59_1
      - palm_2022
      - mlcommons_inference_rules
    posture: derived_from_authoritative_sources

