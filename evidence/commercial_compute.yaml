schema_version: 1
subject:
  id: commercial_compute_capital_and_tokens
  canonical_name: Commercial roles, data-center business models, and MW-to-token boundaries
accessed_as_of: '2026-08-27'

evidence_boundary:
  included_scope: >-
    Dated primary disclosures for the original Abilene development's named
    ownership, development, operating, financing, leasing, and compute roles;
    named public-company comparison cases for colocation, AI cloud, and
    hyperscale cloud models; and authoritative energy-accounting, hardware,
    training-efficiency, inference-runtime, and benchmark boundaries for an
    assumption-driven MW-to-token scenario.
  excluded_scope: >-
    This ledger does not establish ownership of every Abilene asset, identify
    an undisclosed tenant, supply undisclosed financing or lease terms, transfer
    a comparison company's contracts to Abilene, or estimate Abilene's current
    load, installed accelerator count, utilization, MFU, or token throughput.
    Manufacturer specifications are product references, not site observations.
  capacity_rule: >-
    Announced capacity, energized electrical infrastructure, current facility
    load, IT load, usable accelerator power, active accelerator utilization,
    model FLOPs utilization, and measured token throughput are separate
    quantities. A scenario may connect them only through explicit, named inputs
    with common boundaries; a missing input stops the calculation.

