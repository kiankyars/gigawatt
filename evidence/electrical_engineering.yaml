schema_version: 1

subject:
  id: gigawatt_electrical_engineering_reference
  canonical_name: GIGAWATT generic electrical-engineering reference dossier
  scope: >-
    Generic and manufacturer-documented conversion, protection, distribution,
    and point-of-load power roles used by the course.

accessed_as_of: '2026-08-27'

evidence_boundary:
  included_scope: >-
    Stable engineering functions for a turbine-generator set, a generator
    step-up transformer and its protection boundary, a conceptual facility
    power train, and board-level voltage regulation for high-power processors.
  excluded_scope: >-
    Any Abilene as-built or operating claim; any site voltage, transformer
    ratio or connection, protection zone or setting, equipment count or
    rating, redundancy path, switch state, rack configuration, or numerical
    processor-core voltage.
  promotion_rule: >-
    These facts support conceptual teaching only. A generic principle,
    standard scope, or manufacturer example cannot be promoted into a selected
    Abilene design, installed topology, energized path, or operating state.

