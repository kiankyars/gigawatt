subject:
  id: abilene_stargate_original_campus
  canonical_name: Lancium Clean Campus / Crusoe-Oracle Abilene (Stargate)
  location: 617 FM 2404, Abilene, Texas
  atlas_stable_key: curated:lancium-clean-campus-abilene-ai-data-center
accessed_as_of: '2026-08-25'

evidence_boundary:
  included_scope: >-
    The original eight-building Lancium Clean Campus / Crusoe-Oracle Abilene
    development, its initial and expansion grid paths, and the Longhorn onsite
    power systems associated with that development.
  excluded_scope: >-
    The adjacent two-building, 900 MW Microsoft AI infrastructure expansion
    announced in 2026. Its capacity, buildings, and pending power additions are
    not additive to facts for the original eight-building reference campus.
  capacity_rule: >-
    Planned grid interconnection, permitted generation nameplate, delivered
    capacity, energized buildings, commissioned power, current load, and IT load
    are separate lifecycle measures and must not be added or substituted.

