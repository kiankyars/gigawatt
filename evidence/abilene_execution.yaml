schema_version: 1

subject:
  id: abilene_stargate_execution_record
  canonical_name: Lancium Clean Campus / Crusoe-Oracle Abilene execution record
  scope: >-
    Site-execution evidence for the original eight-building Abilene campus,
    its initial and expansion grid paths, its first operational phase, and the
    Longhorn onsite-power and facility-cooling systems associated with it.

accessed_as_of: '2026-08-27'

evidence_boundary:
  included_scope: >-
    Primary utility-regulatory filings, project-delivery records, owner and
    operator statements, manufacturer documentation, and regulatory records
    that establish dated physical execution gates or preserve a specific
    public-evidence gap for the original eight-building campus.
  excluded_scope: >-
    The adjacent two-building, 900 MW Microsoft campus announced in 2026 is
    excluded. Statements in that announcement are used only when they
    explicitly describe the original eight-building campus.
  promotion_rule: >-
    A permit or review drawing is not installation evidence; delivery or
    construction is not energization; energization is not commissioned output;
    a live phase does not disclose current MW, IT load, exact building count,
    rack configuration, or internal electrical and cooling topology.
  availability_rule: >-
    Null facts identify exact fields that the reviewed primary sources do not
    disclose. They must remain explicit unknowns rather than be populated from
    photographs, secondary-site inference, product defaults, or capacity math.

