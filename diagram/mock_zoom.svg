)</text><text x="1103.2" y="675.2" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">bridges the seconds until gensets pick up</text><text x="1103.2" y="699.2" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5f5f59">Eaton · Vertiv · Schneider Electric</text><text x="1103.2" y="719.2" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5f5f59">×N lineups per building — VERIFY count</text><text x="60" y="1020" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="10.5" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#5f5f59">mock v0 — one camera state of the master cutaway; this is what a segment looks like on screen</text></svg>