<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101d29" />
    <meta
      name="description"
      content="An interactive field guide to data centers. Follow electricity from the grid to a rack, then follow its heat back out. 22 visual lessons and hands-on engineering experiments."
    />
    <title>GIGAWATT — From watts to racks</title>
    <style>
      :root {
  --paper: #f4f3ee;
  --ink: #172633;
  --muted: #5c6871;
  --rule: #d5d9d5;
  --orange: #ea6c39;
  --yellow: #ffc875;
  --blue: #75d8e7;
  --pink: #f08383;
  --stage: #101e2b;
  --green: #93dbb0;
  --violet: #bab0f3;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
a {
  -webkit-tap-highlight-color: transparent;
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.35;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible {
  outline: 3px solid #db5d24;
  outline-offset: 5px;
}
button {
  touch-action: manipulation;
}
button[hidden],
[hidden] {
  display: none !important;
}
a {
  color: inherit;
}
h1,
h2,
p {
  margin: 0;
}
button svg {
  pointer-events: none;
}
.skip {
  position: fixed;
  top: 5px;
  left: 10px;
  z-index: 10;
  background: white;
  padding: 12px;
  transform: translateY(-150%);
}
.skip:focus {
  transform: none;
}
.masthead {
  height: 91px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4.2vw;
  border-bottom: 1px solid var(--rule);
}
.brand {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 25px;
  letter-spacing: -1.2px;
  font-weight: 850;
}
.brand svg {
  color: var(--orange);
}
.brand > span {
  border-left: 1px solid #bdc5c5;
  margin-left: 17px;
  padding-left: 23px;
  font-size: 10px;
  letter-spacing: 1.7px;
  font-weight: 600;
  color: var(--muted);
}
.header-actions {
  display: flex;
  gap: 25px;
  align-items: center;
}
.quiet,
.icon-button {
  border: 0;
  background: none;
}
.quiet {
  font-size: 12px;
  font-weight: 650;
  display: flex;
  gap: 18px;
  align-items: center;
}
.icon-button {
  font-size: 25px;
  min-width: 40px;
  min-height: 40px;
}
.chapters {
  padding: 0 4.2vw;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border-bottom: 1px solid var(--rule);
  gap: 20px;
}
.chapter {
  position: relative;
  background: none;
  border: 0;
  text-align: left;
  min-height: 64px;
  padding: 13px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #6b777e;
  font-size: 12px;
  line-height: 1.4;
}
.chapter .chapter-number {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 10px;
  opacity: 0.8;
}
.chapter.active {
  color: var(--ink);
  font-weight: 700;
}
.chapter.active:after {
  content: "";
  position: absolute;
  bottom: -1px;
  height: 3px;
  background: var(--orange);
  left: 0;
  right: 0;
}
.chapter.visited .chapter-number {
  color: var(--orange);
}
main {
  max-width: 1740px;
  margin: auto;
  padding: 42px 4.2vw 28px;
}
.lesson-layout {
  display: grid;
  grid-template-columns: minmax(260px, 0.76fr) minmax(0, 1.65fr);
  gap: 4.3vw;
  align-items: start;
}
.lesson-copy {
  padding-top: 17px;
}
.eyebrow {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 10px;
  line-height: 1.6;
  letter-spacing: 1.65px;
  font-weight: 650;
  text-transform: uppercase;
  color: #9e4829;
  margin-bottom: 24px;
}
h1 {
  font-size: clamp(35px, 3.5vw, 62px);
  line-height: 1.05;
  letter-spacing: -0.05em;
  font-weight: 670;
  max-width: 620px;
  text-wrap: balance;
  outline: none;
}
.lesson-body {
  font-size: 16px;
  line-height: 1.75;
  color: #5c6871;
  margin-top: 25px;
  max-width: 39ch;
}
.takeaway {
  border-top: 1px solid var(--rule);
  margin-top: 35px;
  padding-top: 20px;
}
.label {
  font-size: 9px;
  letter-spacing: 1.75px;
  font-weight: 700;
  color: #657379;
}
.takeaway p {
  font-size: 14px;
  line-height: 1.7;
  margin-top: 10px;
  max-width: 39ch;
}
.reading-actions {
  display: flex;
  gap: 24px;
  margin-top: 23px;
  flex-wrap: wrap;
}
.text-button {
  background: none;
  padding: 5px 0;
  border: 0;
  border-bottom: 1px solid #bfc6c4;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 650;
}
.text-button:hover {
  color: #ae4924;
}
.visual-workspace {
  min-width: 0;
  background: var(--stage);
  color: #e6edef;
  position: relative;
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 12px 36px #19364212;
}
.visual-topline {
  padding: 23px 27px 0;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1.25px;
  color: #afbec8;
}
.visual-topline span:first-child {
  color: var(--yellow);
}
#visual {
  position: relative;
  isolation: isolate;
}
#visual svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.visual-caption {
  font-size: 10px;
  line-height: 1.6;
  color: #aebcc5;
  padding: 16px 27px 21px;
  border-top: 1px solid #d1e0f017;
  min-height: 48px;
}
.experiment {
  padding: 0 27px 23px;
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  align-items: center;
}
.experiment:empty {
  display: none;
}
.control {
  flex: 1;
  min-width: 140px;
}
.control label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 10px;
  letter-spacing: 0.2px;
  color: #c0cdd5;
  margin-bottom: 12px;
}
.control output {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  color: var(--yellow);
  font-weight: 600;
  white-space: nowrap;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--yellow);
  height: 19px;
  margin: 0;
  cursor: ew-resize;
}
.segmented {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.toggle {
  font-size: 11px;
  border: 1px solid #506575;
  background: #182b3a;
  color: #c5d3dc;
  padding: 11px 15px;
  border-radius: 3px;
}
.toggle[aria-pressed="true"] {
  border-color: var(--yellow);
  color: var(--yellow);
  background: #493a2433;
}
.toggle:hover {
  border-color: #bed2df;
}
.lab-tip {
  font-size: 11px;
  color: #b6c9d6;
  line-height: 1.6;
  max-width: 38ch;
}
.experiment .reset {
  background: none;
  border: 0;
  border-bottom: 1px solid #54626f;
  color: #b8c8d2;
  font-size: 10px;
  padding: 5px;
}
.course-footer {
  max-width: 1740px;
  margin: 4px auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  padding: 22px 4.2vw 30px;
}
.nav-button {
  border: 1px solid #cbd0cd;
  background: none;
  border-radius: 3px;
  padding: 14px 18px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  min-width: 118px;
  min-height: 45px;
}
.nav-button.next {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.nav-button:hover:not(:disabled) {
  background: #e6e8e0;
}
.nav-button.next:hover {
  background: #314755;
}
.progress-group {
  display: flex;
  align-items: center;
  gap: 18px;
}
.progress-group > span {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 9px;
  white-space: nowrap;
  color: #5e6d75;
}
.progress {
  display: flex;
  gap: 4px;
}
.progress button {
  width: 10px;
  height: 24px;
  border: 0;
  background: none;
  padding: 0;
  position: relative;
}
.progress button:after {
  content: "";
  display: block;
  width: 100%;
  height: 3px;
  background: #ced4cf;
}
.progress button.active:after {
  background: var(--orange);
  height: 7px;
}
.progress button.past:after {
  background: #758e98;
}
.key-hint {
  margin-left: 7px;
  opacity: 0.7;
}
.notes {
  margin: 28px 0 0 34%;
  background: #eaece4;
  border-left: 3px solid #aec2b6;
  padding: 28px 32px;
  columns: 2;
  column-gap: 35px;
}
.notes p {
  font-size: 13px;
  color: #455762;
  line-height: 1.8;
  margin: 0 0 15px;
  break-inside: avoid;
}
.notes h2 {
  font-size: 12px;
  margin: 0 0 17px;
  column-span: all;
}
.knowledge-check {
  border-top: 1px solid var(--rule);
  margin-top: 28px;
  padding-top: 25px;
  display: grid;
  grid-template-columns: 0.76fr 1.65fr;
  gap: 4.3vw;
}
.check-question .eyebrow {
  margin-bottom: 12px;
}
.check-question h2 {
  font-size: 17px;
  line-height: 1.5;
  letter-spacing: -0.3px;
}
.check-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.answer-button {
  text-align: left;
  border: 1px solid #c9d1cd;
  border-radius: 3px;
  padding: 13px 17px;
  background: none;
  font-size: 12px;
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 15px;
}
.answer-button span {
  border: 1px solid #a8b4b2;
  border-radius: 50%;
  height: 22px;
  min-width: 22px;
  display: grid;
  place-items: center;
  font-size: 9px;
}
.answer-button[aria-pressed="true"] {
  border-color: #cc693d;
  background: #ebdfd0;
}
.answer-button.correct {
  border-color: #3f7658;
  background: #e1ece1;
}
.answer-feedback {
  font-size: 12px;
  line-height: 1.7;
  padding: 9px 0;
  min-height: 32px;
  color: #455d59;
}
dialog {
  border: 0;
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink);
  max-width: 850px;
  width: calc(100vw - 40px);
  max-height: calc(100vh - 70px);
  padding: 32px;
  box-shadow: 0 20px 100px #0004;
}
dialog::backdrop {
  background: #091723aa;
  backdrop-filter: blur(5px);
}
.dialog-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 24px;
  margin-bottom: 24px;
}
.dialog-head .eyebrow {
  display: block;
  margin-bottom: 9px;
}
.dialog-head h2 {
  font-size: 30px;
  letter-spacing: -1px;
}
.contents-chapter {
  margin-bottom: 22px;
  break-inside: avoid;
}
.contents-chapter h3 {
  font-size: 12px;
  margin-bottom: 12px;
  color: #596c74;
}
.contents-chapter button {
  display: block;
  background: none;
  border: 0;
  text-align: left;
  font-size: 13px;
  padding: 9px 0;
  line-height: 1.5;
}
.contents-chapter button span {
  color: #ac592f;
  margin-right: 12px;
  font-family: ui-monospace, monospace;
  font-size: 10px;
}
.contents-chapter button:hover {
  text-decoration: underline;
}
#contents-list {
  columns: 2;
  column-gap: 35px;
}
.source-item {
  display: block;
  text-decoration: none;
  padding: 19px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 15px;
  line-height: 1.5;
}
.source-item:hover {
  text-decoration: underline;
}
.source-item small {
  display: block;
  color: #697c85;
  font-size: 11px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.source-note {
  font-size: 13px;
  line-height: 1.8;
  color: #5c6e78;
  margin: 18px 0;
}
.noscript {
  padding: 40px;
  font-size: 20px;
}
.diagram-text {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  fill: #dde9ef;
  font-size: 16px;
}
.diagram-small {
  font-size: 12px;
  fill: #aebfcb;
}
.diagram-tiny {
  font-size: 10px;
  fill: #91a6b6;
  letter-spacing: 1px;
}
.diagram-number {
  font-size: 54px;
  fill: #ffc875;
  letter-spacing: -2px;
  font-weight: 500;
}
.diagram-rule {
  stroke: #a9c3d2;
  stroke-opacity: 0.18;
  fill: none;
}
.diagram-mono {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
.power-line {
  fill: none;
  stroke: #ffc875;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.cold-line {
  fill: none;
  stroke: #75d8e7;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hot-line {
  fill: none;
  stroke: #f08383;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.flow-dashes {
  stroke-dasharray: 6 14;
  animation: flow 5s linear infinite;
}
.subtle-enter {
  animation: enter 0.3s ease both;
}
@keyframes flow {
  to {
    stroke-dashoffset: -100;
  }
}
@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (min-width: 1500px) {
  .lesson-layout {
    gap: 65px;
  }
  .lesson-body {
    font-size: 18px;
  }
  .takeaway p {
    font-size: 16px;
  }
  .visual-topline {
    font-size: 10px;
  }
  .visual-caption {
    font-size: 12px;
  }
  .control label {
    font-size: 12px;
  }
}
@media (max-width: 1050px) {
  .masthead {
    padding: 0 28px;
    height: 76px;
  }
  .brand > span {
    font-size: 8px;
    margin-left: 8px;
    padding-left: 16px;
  }
  .chapters {
    padding: 0 28px;
    gap: 12px;
  }
  .chapter {
    font-size: 10px;
    gap: 7px;
  }
  main {
    padding: 28px;
  }
  .lesson-layout {
    grid-template-columns: minmax(235px, 0.8fr) minmax(0, 1.5fr);
    gap: 28px;
  }
  .lesson-copy {
    padding-top: 8px;
  }
  h1 {
    font-size: 36px;
  }
  .lesson-body {
    font-size: 14px;
    line-height: 1.65;
    margin-top: 20px;
  }
  .takeaway {
    margin-top: 25px;
  }
  .takeaway p {
    font-size: 12px;
  }
  .eyebrow {
    font-size: 9px;
    margin-bottom: 18px;
  }
  .visual-topline {
    padding: 20px 20px 0;
    font-size: 8px;
    gap: 10px;
  }
  .experiment {
    padding: 0 20px 18px;
    gap: 18px;
  }
  .visual-caption {
    padding: 13px 20px 16px;
    font-size: 9px;
  }
  .key-hint {
    display: none;
  }
  .course-footer {
    padding: 18px 28px 25px;
  }
  .progress button {
    width: 7px;
  }
  .reading-actions {
    gap: 15px;
  }
  .text-button {
    font-size: 10px;
  }
}
@media (max-width: 760px) {
  .masthead {
    height: 70px;
    padding: 0 20px;
  }
  .brand {
    font-size: 21px;
    gap: 9px;
  }
  .brand > span {
    display: none;
  }
  .header-actions {
    gap: 10px;
  }
  .quiet {
    font-size: 10px;
    gap: 10px;
  }
  .chapters {
    padding: 0 20px;
    display: flex;
    overflow-x: auto;
    gap: 22px;
    scrollbar-width: thin;
  }
  .chapter {
    min-width: 105px;
    min-height: 55px;
    font-size: 10px;
    gap: 8px;
  }
  main {
    padding: 26px 20px 10px;
  }
  .lesson-layout {
    grid-template-columns: 1fr;
    gap: 25px;
  }
  .lesson-copy {
    padding: 0;
  }
  h1 {
    font-size: 42px;
    max-width: 16ch;
    letter-spacing: -1.7px;
  }
  .eyebrow {
    font-size: 9px;
    margin-bottom: 14px;
  }
  .lesson-body {
    max-width: 60ch;
    font-size: 14px;
    line-height: 1.65;
    margin-top: 17px;
  }
  .takeaway {
    margin-top: 19px;
    padding-top: 14px;
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }
  .takeaway .label {
    font-size: 8px;
    line-height: 1.6;
    min-width: 65px;
    max-width: 65px;
    margin-top: 3px;
  }
  .takeaway p {
    font-size: 12px;
    line-height: 1.6;
    margin: 0;
    max-width: none;
  }
  .reading-actions {
    margin-top: 15px;
  }
  .visual-workspace {
    border-radius: 3px;
  }
  .visual-topline {
    font-size: 8px;
    padding: 19px 18px 0;
  }
  .visual-topline span:last-child {
    font-size: 7px;
  }
  .visual-caption {
    font-size: 10px;
    padding: 13px 18px 18px;
  }
  .experiment {
    padding: 5px 18px 18px;
    gap: 17px;
  }
  .control label {
    font-size: 10px;
  }
  .toggle {
    font-size: 10px;
    padding: 10px 12px;
  }
  .course-footer {
    padding: 19px 20px 24px;
    gap: 12px;
    margin-top: 8px;
  }
  .nav-button {
    font-size: 10px;
    min-width: 90px;
    padding: 13px 12px;
    gap: 14px;
  }
  .progress-group {
    gap: 8px;
    flex-direction: column;
  }
  .progress button {
    width: 5px;
  }
  .progress {
    gap: 2px;
  }
  .progress-group > span {
    font-size: 9px;
  }
  .notes {
    margin: 25px 0 0;
    columns: 1;
    padding: 24px;
  }
  .knowledge-check {
    grid-template-columns: 1fr;
    gap: 19px;
    margin-top: 22px;
    padding-top: 22px;
  }
  .check-question h2 {
    font-size: 16px;
  }
  .answer-button {
    font-size: 12px;
    padding: 12px;
  }
  .dialog-head h2 {
    font-size: 24px;
  }
  dialog {
    padding: 24px;
    max-height: calc(100dvh - 30px);
  }
  #contents-list {
    columns: 1;
  }
  .diagram-small {
    font-size: 14px;
  }
  .diagram-tiny {
    font-size: 11px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation: none !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
@media print {
  .masthead,
  .chapters,
  .course-footer,
  .experiment,
  .reading-actions,
  .knowledge-check {
    display: none;
  }
  main {
    padding: 0;
  }
  .lesson-layout {
    display: block;
  }
  .visual-workspace {
    margin-top: 25px;
    break-inside: avoid;
    print-color-adjust: exact;
  }
  .lesson-copy {
    max-width: none;
  }
  .lesson-body {
    max-width: none;
  }
  .notes {
    display: block !important;
    margin: 20px 0 0;
    columns: 1;
  }
  .takeaway p {
    max-width: none;
  }
}
.experiment-result {
  flex-basis: 100%;

    <script type="application/json" id="course-data">
      {"title":"GIGAWATT","subtitle":"From watts to racks. Then all the way back to the air.","chapters":[{"id":"start","title":"Start at the rack","kicker":"01 · Two obligations"},{"id":"grid","title":"Bring power to site","kicker":"02 · Distance and scale"},{"id":"continuity","title":"Keep racks powered","kicker":"03 · Continuity"},{"id":"silicon","title":"Power silicon","kicker":"04 · The last meter"},{"id":"cooling","title":"Get heat out","kicker":"05 · The return journey"},{"id":"system","title":"Size the whole system","kicker":"06 · Put it together"}],"lessons":[{"id":"one-rack","chapter":"start","title":"One campus. Two journeys.","eyebrow":"The whole system","body":"A working rack needs a continuous path for electricity to arrive and a continuous path for heat to leave. Follow those two paths, and the data center becomes a system you can reason about.","visual":"campus","takeaway":"A rack is usable only while both its power path and its heat-removal path work.","notes":["Find the racks inside the open-roof data hall. Choose one hypothetical rack drawing 100 kW so the reasoning has a scale. A rack contains computing, networking, power conversion, and cooling equipment. This teaching load is not a specification for every AI rack or a measurement at a named campus.","Trace outward from that rack. It needs upstream electrical service, distribution, protection, and compatible power conversion. It also needs downstream heat transport and an ultimate sink. Information processing is the desired service, but it does not consume a large slice of electrical energy that then escapes the heat balance. Nearly all IT electrical input ultimately becomes heat.","The journey starts with the problem, follows electricity inward, and then follows heat outward. At every scale ask what this component must do, what limits it, and what happens if it stops."],"sources":[{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}]},{"id":"power-and-energy","chapter":"start","title":"A watt is a rate.","eyebrow":"Power × time = energy","body":"Megawatts describe how fast energy is delivered. Megawatt-hours describe how much is delivered over time. A 1 MW load held for one hour uses 1 MWh; the same load for three hours uses 3 MWh.","visual":"energy","takeaway":"Power sets the size of the path; energy sets how long a source can support it.","notes":["Think of a power trace with time on the horizontal axis. Its height is power; the area underneath is energy. For a constant load, multiply power by duration. For a varying load, add up the energy in each interval. A momentary 10 MW peak and a continuous 10 MW load impose different energy requirements even when their highest power is identical.","This distinction will return in the battery lesson. A battery system needs both sufficient output power and sufficient usable energy. A large energy inventory cannot pass through an undersized inverter quickly enough to support a large load.","The units provide a useful error detector: MW multiplied by hours gives MWh; MWh divided by MW gives hours. Neither calculation gives a count of racks until a rack load and the relevant electrical boundary are specified."],"sources":[{"title":"EIA · Measuring electricity","url":"https://www.eia.gov/energyexplained/electricity/measuring-electricity.php"}]},{"id":"sources-and-grid","chapter":"grid","title":"Follow the physical connection.","eyebrow":"Electricity and energy contracts","body":"A campus receives electricity through physical infrastructure. Energy contracts describe commercial arrangements; they do not by themselves establish a dedicated wire from a named generator to a rack. Trace the solid electrical path before reading the dashed contract.","visual":"grid","takeaway":"A power contract and a dependable electrical connection answer different questions.","notes":["Trace the solid path from generation through the shared grid to the campus. Many generators, inverter-based resources, and loads participate in this connected system. They require continuous balancing and connections that can carry power within their operating limits. The schematic represents that shared network, not a dedicated generator-to-rack cable.","The dashed line represents a commercial arrangement. A physical power purchase agreement can include delivery through the grid; a financial power purchase agreement does not deliver electricity to the buyer. Neither description by itself supplies the campus electrical one-line, operating limits, or proof of continuous service.","Onsite generation creates another possible supply path, but it still needs compatible equipment, controls, fuel, and approvals. A battery shifts energy through time and has finite power and energy. Next, hold delivered power constant and examine why long-distance transport uses high voltage."],"sources":[{"title":"EIA · How electricity is generated","url":"https://www.eia.gov/energyexplained/electricity/how-electricity-is-generated.php"},{"title":"Vertiv · BESS and UPS roles in data center power","url":"https://www.vertiv.com/en-us/insights/articles/white-papers/bess-and-ups-roles-in-large-data-center-power-architecture/"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"NERC · Characteristics and Risks of Emerging Large Loads","url":"https://www.nerc.com/globalassets/who-we-are/standing-committees/rstc/3_doc_white-paper-characteristics-and-risks-of-emerging-large-loads.pdf"},{"title":"EPA · Physical power purchase agreements","url":"https://www.epa.gov/green-power-markets/physical-ppa"},{"title":"EPA · Financial power purchase agreements","url":"https://www.epa.gov/green-power-markets/financial-ppa"}]},{"id":"raise-voltage","chapter":"grid","title":"Go farther. Raise the voltage.","eyebrow":"Experiment · Hold power constant","body":"For the same transferred power, higher voltage means lower current. Conductor heating rises with current squared. Raising voltage tenfold cuts current tenfold and conductor losses one hundredfold when power factor and resistance stay fixed.","visual":"voltage","takeaway":"High voltage makes bulk power transport practical by reducing current.","notes":["For balanced three-phase AC, real power is P = √3 × V × I × power factor, with V the line-to-line RMS voltage. The visual uses 100 MW, unity power factor, and an ideal comparison: about 4,184 A at 13.8 kV versus 418 A at 138 kV. These values are a scenario, not a proposed campus design.","At fixed conductor resistance, heating in each conductor is I²R. Reducing current to one tenth reduces that resistive loss to one hundredth. This does not mean the entire grid becomes one hundred times more efficient: transformer losses, insulation, clearances, stability, and other limits still matter.","Move voltage before looking at the answer. Explain the direction of current first, then predict the larger change in resistive heating. The square is the reason voltage transformation is so consequential."],"sources":[{"title":"Schneider Electric · Three-phase power and current","url":"https://www.electrical-installation.org/enwiki/Installed_apparent_power_(kVA)"},{"title":"OpenStax · Transformers","url":"https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers"}],"check":{"question":"Double voltage while real power, power factor, and conductor resistance stay fixed. What happens to resistive loss?","options":["It halves.","It falls to one quarter.","It stays the same."],"answer":1,"explanation":"Current halves, and I²R falls to (1/2)² = 1/4 of its starting value."}},{"id":"substation-functions","chapter":"grid","title":"Open the substation.","eyebrow":"Transform · switch · protect","body":"A transformer changes voltage. Switchgear routes and interrupts circuits. Protection detects abnormal conditions and commands the right breaker to open. Together they turn a high-voltage connection into a controllable service.","visual":"substation","takeaway":"Voltage transformation, switching, and protection solve different problems.","notes":["A transformer trades voltage and current while transferring electrical power, with real losses. It does not create additional power. A substation packages this conversion with the means to connect, disconnect, measure, and protect electrical circuits. The exact arrangement depends on the system; there is no universal data-center one-line diagram.","Protection is a decision-and-action chain. Sensors measure electrical conditions, relays evaluate whether a fault lies in their protected zone, and circuit breakers interrupt current. Isolation and safe access also require appropriate equipment and procedures; an open line on a teaching diagram is not a switching instruction.","Trace normal power flow first. Then imagine a fault in one transformer or feeder and identify which boundary should disconnect. Equipment is easier to remember when each name is attached to a job."],"sources":[{"title":"Schneider Electric · Medium-voltage unit substations","url":"https://www.se.com/us/en/product-range/60292-medium-voltage-unit-substations/"},{"title":"IEEE · Guide for Protecting Power Transformers","url":"https://standards.ieee.org/ieee/C37.91/5904/"},{"title":"OpenStax · Transformers","url":"https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers"}]},{"id":"capacity-stages","chapter":"grid","title":"Connected is a milestone.","eyebrow":"From a headline to an energized load","body":"A plan, an established connection, energized equipment, commissioned systems, and an observed workload establish different milestones. Select each state and ask what evidence it adds. A later gate is not proof the entire campus has reached it.","visual":"capacity","takeaway":"Always attach a capacity number to a boundary, a date, and a state.","notes":["Read the five simplified milestones in the visual. Announced describes an intention. Connected means the physical electrical connection has been established; an interconnection agreement alone does not show this. Energized means equipment is electrically live. Commissioned means required integrated tests have been passed for the stated scope. Loaded means IT is drawing power under workload. Permits and installation records provide additional evidence along the way.","These milestones need not form a perfectly neat, campus-wide sequence: one building can run while another is under construction. The useful question is which complete path is available for which loads, under which conditions.","When someone says a site has a gigawatt, ask where that number is measured or rated and what evidence establishes its present state. A source-side rating cannot fill in missing building, cooling, rack, or workload evidence."],"sources":[{"title":"Crusoe · Abilene expansion announcement, 18 March 2025","url":"https://www.crusoe.ai/resources/newsroom/crusoe-expands-ai-data-center-campus-in-abilene-to-1-2-gigawatts"},{"title":"OpenAI · Abilene workloads, 22 July 2025","url":"https://openai.com/index/stargate-advances-with-partnership-with-oracle/"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"}]},{"id":"building-power-train","chapter":"continuity","title":"Bring the power to the rack.","eyebrow":"Read equipment by its function","body":"Inside the site, power passes through distribution, protection, voltage conversion, and often a UPS before reaching rack positions. Follow the functions from the building feeder to the rack inlet.","visual":"train","takeaway":"Every link must carry the required load and fit the next electrical interface.","notes":["Use a generic building path: feeder, transformer and switchgear, UPS where the architecture calls for one, distribution busway or cabling, and a rack connection. The exact order, placement, voltage levels, and duplication vary. This diagram teaches the jobs of the equipment rather than prescribing an installation.","Current ratings, compatible voltages, protection, maintenance access, and the equipment available after an outage all constrain the path. A very large upstream transformer cannot compensate for a downstream distribution circuit that cannot carry the intended load.","Pause at the rack inlet. Facilities have delivered an electrical service to a location; internal rack conversion still has work to do before processors can operate. First, however, make the service survive interruptions and maintenance."],"sources":[{"title":"Schneider Electric · Medium-voltage unit substations","url":"https://www.se.com/us/en/product-range/60292-medium-voltage-unit-substations/"},{"title":"Vertiv · BESS and UPS roles in data center power","url":"https://www.vertiv.com/en-us/insights/articles/white-papers/bess-and-ups-roles-in-large-data-center-power-architecture/"},{"title":"Infineon · Server rack power management","url":"https://www.infineon.com/applications/ai-data-center/data-center-power-solutions/server-rack-power-management"}]},{"id":"ride-through","chapter":"continuity","title":"The battery buys time.","eyebrow":"Experiment · Power and duration","body":"A UPS supports critical loads through an interruption. Storage bridges a finite interval while another source becomes available or the load shuts down. Both output power and usable energy must be sufficient.","visual":"ride-through","takeaway":"Battery runtime is a power-and-energy question, followed by a transfer-and-control question.","notes":["The ideal duration relationship is time = usable energy delivered to the load / load power. For a constant 5 MW protected load and 0.25 MWh available at the UPS output, the result is 0.05 hours, or three minutes. Defining usable energy at the output keeps conversion losses from being silently ignored or counted twice.","A practical system must also deliver at least the required power, tolerate the load, and operate within its battery state, temperature, aging, protection, and control limits. A 0.25 MWh battery with a 1 MW output limit cannot support a 5 MW load even for a moment.","A generator is not instant energy storage; starting, stabilizing, and transferring load are system behaviors that must be designed and tested. This example supplies no universal transfer time or guaranteed runtime."],"sources":[{"title":"EIA · Measuring electricity","url":"https://www.eia.gov/energyexplained/electricity/measuring-electricity.php"},{"title":"Vertiv · BESS and UPS roles in data center power","url":"https://www.vertiv.com/en-us/insights/articles/white-papers/bess-and-ups-roles-in-large-data-center-power-architecture/"}],"check":{"question":"A UPS can supply 5 MW and has 0.25 MWh of usable output energy. Ideally, how long can it carry a steady 5 MW load?","options":["3 minutes","15 minutes","3 hours"],"answer":0,"explanation":"0.25 MWh ÷ 5 MW = 0.05 h = 3 minutes. Actual usable output and operating conditions must support those assumptions."}},{"id":"redundant-paths","chapter":"continuity","title":"A second path must be useful.","eyebrow":"Normal operation and one path unavailable","body":"Two feeds help only if the surviving route can serve the load and the equipment can use it. Follow each path end to end, including shared components, controls, and the rack power supplies.","visual":"redundancy","takeaway":"Redundancy is a property of the complete system under a defined failure.","notes":["Start with a hypothetical 1 MW load and two independently usable 1 MW routes. If one route becomes unavailable, the other has enough capacity in this simplified model. If each route can deliver only 0.5 MW, the two can serve 1 MW together but cannot preserve that full load after losing one route.","Now look beyond capacity. Both cords might return to the same upstream device. A load may require both supplies to operate at full demand. Transfer behavior and protective coordination can affect whether the load remains powered. Two colors on a diagram cannot settle these questions.","Use the unavailable-path state to test a specific proposition: which equipment carries the load now, and what assumption allows continuity? Terms such as N+1 or a Tier classification carry more requirements than this small example demonstrates."],"sources":[{"title":"Schneider Electric · Do two cords guarantee redundancy?","url":"https://blog.se.com/datacenter/architecture/2014/08/06/two-cords-guarantee-power-redundancy-device/"},{"title":"Uptime Institute · Tier certification","url":"https://uptimeinstitute.com/tier-certification"}]},{"id":"fault-domains","chapter":"continuity","title":"Keep one fault from spreading.","eyebrow":"Find the shared dependency","body":"A local feeder fault should be interrupted within its intended protection zone. A fault in shared upstream equipment can affect every downstream load. Location matters as much as the number of backup devices.","visual":"failure","takeaway":"Ask what still works after the particular component you remove becomes unavailable.","notes":["Imagine three feeders leaving a shared distribution point, each serving a rack or a group of loads. Activate the middle-feeder fault. This illustration assumes the appropriate breaker isolates that branch while the other two remain powered. Actual outcomes depend on protective coordination, disturbance severity, upstream capacity, and the other loads’ tolerance of the event.","Now consider an additional thought experiment: the shared supply bus becomes unavailable. More downstream breakers do not create a new source around that missing common element. The visual has no control for this second scenario; trace the paths mentally to distinguish isolating a local fault from surviving a shared dependency’s failure.","The exercise is conceptual: inspect the topology, state the chosen failure, and trace the remaining valid routes. Real protection and maintenance procedures require an engineered study. Carry the same reasoning into cooling later: duplicated electrical paths alone do not keep a rack alive if its sole heat-removal path stops."],"sources":[{"title":"IEEE · Guide for Protecting Power Transformers","url":"https://standards.ieee.org/ieee/C37.91/5904/"},{"title":"Schneider Electric · Do two cords guarantee redundancy?","url":"https://blog.se.com/datacenter/architecture/2014/08/06/two-cords-guarantee-power-redundancy-device/"},{"title":"Uptime Institute · Tier certification","url":"https://uptimeinstitute.com/tier-certification"}]},{"id":"rack-conversion","chapter":"silicon","title":"The rack changes the rules.","eyebrow":"From facility AC to local DC","body":"Rack power supplies convert facility AC into DC distribution. Board-level regulators then create the lower, tightly controlled voltages processors need. Each conversion serves a different scale of the power path.","visual":"rack","takeaway":"Rack DC and processor-core voltage are separate electrical boundaries.","notes":["Follow the nesting: building, rack, compute tray, board, processor. A documented NVIDIA DGX GB200 rack uses power shelves with nominal 50–51 V DC output. That is a specific product reference, not a universal rack standard and not evidence of a particular campus installation.","The processor cannot simply use that rack bus as its core rail. Local regulators perform further conversion near the load, supplying precise voltages at high currents. Intermediate buses, rail counts, and control architectures differ by hardware design.","At every conversion, keep the input, output, and losses visible. Do not multiply a rack product rating by a guessed installed inventory and call the result measured site power. We are learning why the stages exist; an operating estimate needs actual configuration and measurements."],"sources":[{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"},{"title":"Infineon · Server rack power management","url":"https://www.infineon.com/applications/ai-data-center/data-center-power-solutions/server-rack-power-management"},{"title":"Texas Instruments · Processor core power","url":"https://www.ti.com/product-category/power-management/multiphase.html"}]},{"id":"low-voltage-current","chapter":"silicon","title":"Low voltage. Enormous current.","eyebrow":"The last meter is a different problem","body":"For DC, P = V × I. An ideal 1,000 W load would draw 20 A at 50 V but 1,000 A at 1 V. That is why conversion moves close to the processor.","visual":"current","takeaway":"Low-voltage delivery makes short paths and careful current distribution essential.","notes":["This is a processor-scale thought experiment: hold the delivered power at 1,000 W and compare two DC voltages. At 50 V, current is 20 A. At 1 V, it is 1,000 A. The values illustrate the relationship; they do not assert the rail voltage or power allocation of any particular processor.","Resistance now matters intensely. Voltage drop is I × R, while resistive heating is I²R. A voltage drop that seems small in an ordinary circuit can occupy a large part of a low-voltage processor rail. Delivering very high current over a long distance is costly and difficult.","Local multiphase regulators share current across conversion stages and control the rail near the load. The complete design also responds to fast changes in demand. High voltage helps at long distances; precise low voltage is necessary at the silicon."],"sources":[{"title":"Infineon · Server rack power management","url":"https://www.infineon.com/applications/ai-data-center/data-center-power-solutions/server-rack-power-management"},{"title":"Texas Instruments · Processor core power","url":"https://www.ti.com/product-category/power-management/multiphase.html"},{"title":"OpenStax · Transformers","url":"https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers"}]},{"id":"useful-compute","chapter":"silicon","title":"Watts do not measure useful work.","eyebrow":"The workload completes the chain","body":"Power allows hardware to run. Useful throughput also depends on the model, software, memory, communication, and utilization. The same electrical demand can support very different amounts of useful output.","visual":"compute","takeaway":"Convert watts to workload output only with an explicit, measured workload model.","notes":["A cluster can be powered and still spend time waiting for data, memory transfers, network communication, or other workers. A hardware peak describes a capability under specified conditions. It does not tell you how much useful work a particular workload completes.","First define the output: training progress, jobs completed, or inference tokens under a latency and quality requirement. Then define hardware, precision, model, batch and sequence settings, and the measurement interval. Measure both output and the electrical boundary that supplied it.","Even a rack-level power figure includes components beyond one accelerator. Dividing rack power by GPU count produces an allocation of rack power, not GPU chip power. Network and storage equipment also belong in the system budget. We stop at rack capacity when these workload inputs are unavailable."],"sources":[{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"MLCommons · MLPerf Inference measurement rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"},{"title":"NVIDIA · Triton batching and throughput","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"}]},{"id":"electrical-to-heat","chapter":"cooling","title":"The watt becomes heat.","eyebrow":"A balance, not a metaphor","body":"Nearly all electrical power entering IT equipment becomes heat. A rack drawing 100 kW therefore creates approximately 100 kW of IT heat to remove. Cooling equipment consumes additional power outside that rack boundary.","visual":"heat","takeaway":"Useful computation does not subtract a large energy slice from the cooling obligation.","notes":["Choose a steady operating interval and draw the boundary around the IT rack. Energy enters electrically. Some can temporarily change stored energy, but nearly all ultimately becomes heat. Information processing is valuable output; it is not an energy outlet comparable in size to the electrical input.","A 100 kW rack is therefore approximately a 100 kW heat source in this model. The heat can leave through multiple routes: liquid-cooled components and air-cooled components. Their heat duties must add up consistently; do not invent a universal liquid-versus-air percentage.","Now widen the boundary. Power supplies already inside the rack contribute to its heat. Pumps, fans, electrical losses, and refrigeration outside that boundary add their own loads elsewhere in the facility balance. This is why boundary labels matter before drawing a flow width or totaling heat."],"sources":[{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"DOE · Thermodynamics, Heat Transfer, and Fluid Flow","url":"https://www.energy.gov/sites/default/files/2026-04/DOE-HDBK-1012-92_VOL1.pdf"},{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}]},{"id":"liquid-heat-transport","chapter":"cooling","title":"Heat needs a moving carrier.","eyebrow":"Experiment · Flow and temperature rise","body":"Liquid carries heat as its temperature rises: heat rate = mass flow × specific heat × temperature rise. For an assumed 100 kW water duty and a 10°C rise, the required flow is about 2.39 kg/s.","visual":"liquid","takeaway":"At fixed heat duty, a smaller coolant temperature rise requires more mass flow.","notes":["The steady sensible-heat relationship is Q̇ = ṁ × cp × ΔT. Use water with an assumed specific heat of 4.18 kJ/(kg·K): 100 kJ/s divided by 4.18 and a 10 K temperature rise gives about 2.39 kg/s. At an assumed density of 1 kg/L, that is roughly 144 L/min.","The 100 kW value is the heat assigned to this liquid loop, not a claim that all heat from every rack enters liquid. Celsius temperature differences and kelvin differences have the same numerical size. Coolant mixtures and operating conditions can change the properties used in the calculation.","Halve the allowed temperature rise and predict the flow before changing the control. The energy balance alone does not select a pump, pipe, or cold plate: pressure drop, heat-transfer performance, cleanliness, allowable temperatures, and control behavior still need engineering."],"sources":[{"title":"DOE · Thermodynamics, Heat Transfer, and Fluid Flow","url":"https://www.energy.gov/sites/default/files/2026-04/DOE-HDBK-1012-92_VOL1.pdf"},{"title":"Open Compute Project · Liquid-to-liquid CDU performance","url":"https://www.opencompute.org/documents/ocp-wp-l-lcdu-test-methodology-performance-rating-r1-pdf"}],"check":{"question":"The heat duty stays fixed while the allowed coolant temperature rise falls from 10°C to 5°C. With the same fluid properties, what flow is required?","options":["Half the mass flow","The same mass flow","Twice the mass flow"],"answer":2,"explanation":"Q̇ = ṁ cp ΔT. Halving ΔT requires doubling ṁ to carry the same heat."}},{"id":"heat-exchanger","chapter":"cooling","title":"Heat crosses. Fluids stay apart.","eyebrow":"Inside a liquid-to-liquid CDU","body":"A liquid-to-liquid cooling distribution unit transfers heat between the technology loop and the facility loop. A heat exchanger couples their temperatures while keeping their fluids separate.","visual":"cdu","takeaway":"A heat exchanger transfers energy across a boundary without mixing the two coolant circuits.","notes":["Follow the technology coolant first: it reaches the cooled components, warms as it collects heat, and returns to the CDU. Trace the facility coolant separately: it receives heat at the heat exchanger and carries it toward the facility cooling plant. The two circuits remain hydraulically separate in this liquid-to-liquid example.","Heat exchange needs a temperature difference. Temperatures, flow, pressure, fluid compatibility, and the exchanger performance determine what duty the interface can carry. Pumps and controls move coolant and maintain operating conditions; the CDU does not destroy heat or necessarily provide refrigeration.","Check the drawing carefully: arrows on pipes describe coolant circulation, while an arrow across the exchanger describes heat transfer. Confusing those arrows can accidentally draw fluid mixing where only energy transfer belongs. This is a generic architecture, not an as-built claim about Abilene."],"sources":[{"title":"Open Compute Project · Liquid-to-liquid CDU performance","url":"https://www.opencompute.org/documents/ocp-wp-l-lcdu-test-methodology-performance-rating-r1-pdf"},{"title":"DOE · Thermodynamics, Heat Transfer, and Fluid Flow","url":"https://www.energy.gov/sites/default/files/2026-04/DOE-HDBK-1012-92_VOL1.pdf"}]},{"id":"residual-air","chapter":"cooling","title":"This rack still needs air.","eyebrow":"Two parallel heat paths","body":"Cold plates can capture heat from high-power chips while other rack components still heat the air. Airflow must carry that remaining heat to a coil or another heat-removal system.","visual":"air","takeaway":"Trace every heat source to an exit, including the components outside the liquid loop.","notes":["Follow a concrete product reference: the documented DGX GB200 architecture includes liquid-cooled CPUs and GPUs alongside components that require air cooling. The category split does not establish a universal percentage or the operating split for an installed rack.","Air enters equipment, absorbs heat, and must reach a heat-removal device before returning at an acceptable inlet condition. Fans move air; a cooling coil transfers its heat onward. Mixing warm exhaust back into equipment inlets can undermine cooling even when total room airflow looks large.","The liquid and air branches are parallel obligations, not successive steps in one pipe. Depending on the facility, they can connect to different cooling equipment or meet later at a shared plant. Both need sufficient capacity and an intact route to a sink. A successful liquid-loop test alone does not validate the whole rack."],"sources":[{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"Open Compute Project · Liquid-to-liquid CDU performance","url":"https://www.opencompute.org/documents/ocp-wp-l-lcdu-test-methodology-performance-rating-r1-pdf"}]},{"id":"outdoor-rejection","chapter":"cooling","title":"Moving heat adds heat.","eyebrow":"The atmosphere closes the journey","body":"The chiller absorbs 100 kW of heat. At the starting assumption of 20 kW compressor input, it rejects 120 kW. Change the work input and close the energy balance; the atmosphere must receive the added heat too.","visual":"rejection","takeaway":"Removing heat from a chip is only the first step toward rejecting it from the facility.","notes":["For direct sensible heat exchange, the heat source must be warmer than the sink by enough to transfer the required duty. Warm outdoor air reduces the available temperature difference for a given coolant temperature. Actual capacity depends on equipment and operating conditions; a single nameplate value cannot describe every weather condition.","A refrigeration cycle can move heat from a colder side to a warmer side by consuming work. In the visual’s starting balance, 100 kW absorbed plus 20 kW of compressor input equals 120 kW rejected. Change compressor work while holding absorbed heat fixed. Pumps and fans add further facility loads according to the boundary being counted; this control does not simulate a particular chiller’s performance curve.","Air-cooled and evaporative rejection make different water and energy tradeoffs. A closed coolant loop can still coexist with an evaporative outdoor system. Abilene’s August 2025 design description instead specifies non-evaporative air-cooled chillers; initial fill and maintenance water remain separate accounts."],"sources":[{"title":"DOE · Thermodynamics, Heat Transfer, and Fluid Flow","url":"https://www.energy.gov/sites/default/files/2026-04/DOE-HDBK-1012-92_VOL1.pdf"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"Crusoe · Abilene cooling design, 5 August 2025","url":"https://www.crusoe.ai/resources/blog/an-inside-look-at-the-abilene-ai-data-center"}]},{"id":"facility-overhead","chapter":"system","title":"Budget the whole facility.","eyebrow":"PUE · A ratio with a boundary","body":"Formal PUE compares total data-center energy with IT energy over the same continuous 12 months. Here, an assumed steady facility-to-IT power ratio of 1.25 turns a 100 MW facility budget into 80 MW for IT.","visual":"pue","takeaway":"PUE describes facility overhead; it does not measure computing productivity.","notes":["For reported PUE under ISO/IEC 30134-2:2026, compare total facility and IT energy over the same continuous 12 months. Shorter intervals are treated separately as interim PUE. With PUE 1.25, 1.25 units of facility energy accompany each unit of IT energy. The 0.25 overhead units are 25% of IT energy, or 20% of the total facility energy.","For this capacity exercise, explicitly assume a steady operating facility-to-IT power ratio of 1.25. Then 100 MW / 1.25 = 80 MW of IT power, leaving 20 MW for facility overhead. An annual measured PUE does not establish the instantaneous ratio during a peak or an outage.","IT includes more than accelerators: networking, storage, and other computing equipment must be accounted for. A lower PUE does not prove more useful computation, lower carbon emissions, or lower water consumption. Those questions need their own output and resource measurements."],"sources":[{"title":"ISO/IEC 30134-2 · Power usage effectiveness","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"EIA · Measuring electricity","url":"https://www.eia.gov/energyexplained/electricity/measuring-electricity.php"}]},{"id":"capacity-bottleneck","chapter":"system","title":"The smallest limit wins.","eyebrow":"Experiment · A 100 MW campus","body":"At 100 kW per rack: 100 MW facility ÷ 1.25 allows 800 racks; the 70 MW electrical train allows 700; 60 MW cooling allows 600. Space and network each allow 900. The smallest is 600.","visual":"bottleneck","takeaway":"Convert every constraint to the same boundary, then find the binding one.","notes":["The starting facility budget supports 100 / 1.25 = 80 MW of IT, equivalent to 800 loads of 100 kW each. The downstream electrical train can deliver 70 MW, or 700 such loads. Cooling supports 60 MW of IT heat, or 600 loads. Space and the assumed network limit each support 900. The minimum is 600 rack equivalents: 60 MW IT and 75 MW facility draw under the assumed ratio.","These are hypothetical, identical, fully accounted IT loads. Cooling is available duty at the assumed operating condition, after the chosen redundancy and margin policy. Other IT loads must already be reserved or included. The arithmetic provides a ceiling, not proof of deployment.","Reduce the facility-to-IT ratio first. The count stays at 600 because cooling still binds. Then raise usable cooling to 80 MW: the fixed 70 MW electrical train limits the result to 700 racks. Lower network support to 400 and it becomes the new limit. Changing one constraint can reveal another."],"sources":[{"title":"ISO/IEC 30134-2 · Power usage effectiveness","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"},{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"EIA · Measuring electricity","url":"https://www.eia.gov/energyexplained/electricity/measuring-electricity.php"}],"check":{"question":"Starting from the defaults, raise usable IT cooling from 60 MW to 80 MW. How many 100 kW rack equivalents can the campus support?","options":["600 rack equivalents","700 rack equivalents","800 rack equivalents"],"answer":1,"explanation":"The fixed downstream electrical train can deliver 70 MW, which supports 700 × 100 kW. Cooling and the facility budget each allow 800; the electrical train now binds."}},{"id":"abilene-case","chapter":"system","title":"Read a real headline precisely.","eyebrow":"Abilene · A dated evidence exercise","body":"In March 2025, Crusoe announced a 1.2 GW Abilene campus expansion. In July 2025, OpenAI reported early workloads running in parts of the facility. Those statements establish different milestones; neither supplies a measured campus IT load.","visual":"case","takeaway":"A real case tests the model without turning missing measurements into estimates.","notes":["The March 18, 2025 announcement describes the eight-building expansion and a 1.2 GW grid interconnection. The July 22, 2025 OpenAI update reports first GB200 rack deliveries and early training and inference workloads. Read them as dated statements about different scopes and states, not as a current operating dashboard.","The August 5, 2025 cooling description provides another kind of evidence: a closed facility cooling loop with air-cooled chillers and no evaporative water consumption in that rejection process. It also describes fill and maintenance water. Design intent and operating measurement remain distinct.","Try the capstone calculation using these sources. It stops: these statements do not provide matching measured IT power, available cooling at an operating condition, installed rack configuration, or workload throughput. The course’s 600-rack example is synthetic and must never become an Abilene estimate."],"sources":[{"title":"Crusoe · Abilene expansion announcement, 18 March 2025","url":"https://www.crusoe.ai/resources/newsroom/crusoe-expands-ai-data-center-campus-in-abilene-to-1-2-gigawatts"},{"title":"OpenAI · Abilene workloads, 22 July 2025","url":"https://openai.com/index/stargate-advances-with-partnership-with-oracle/"},{"title":"Crusoe · Abilene cooling design, 5 August 2025","url":"https://www.crusoe.ai/resources/blog/an-inside-look-at-the-abilene-ai-data-center"}]},{"id":"whole-system","chapter":"system","title":"Follow the power. Close the heat path.","eyebrow":"Your final reconstruction","body":"Use the campus to explain both journeys. Then replay the capacity lab: raise cooling to 80 MW, then lower network support to 400 racks. Predict which limit binds at each step before opening the explanation.","visual":"synthesis","takeaway":"A data center works when the electrical path, thermal path, and workload requirements agree.","notes":["Reconstruct the power path from the campus picture: external service, transformation, distribution, protection, continuity, rack conversion, and processor regulation. For every component, explain its function and one condition that limits it. Name a particular failure and trace the route that remains available to the load.","Turn around at the chip. Separate liquid and residual-air heat, follow both paths to the facility plant, and close the balance at the atmosphere. Distinguish coolant circulation from heat transfer across an exchanger. Include compressor and other facility power when you widen the energy-accounting boundary.","Now check the capstone prediction. The starting limit is 600 rack equivalents from cooling. Raising cooling to 80 MW exposes the 70 MW electrical-train limit: 700 racks. Reducing network support to 400 racks makes the network bind at 400. Those results establish only a scenario ceiling. Measured configuration, operation, and workload output are still required to establish productive compute."],"sources":[{"title":"DOE · Best Practices Guide for Energy-Efficient Data Center Design","url":"https://www.energy.gov/sites/default/files/2024-07/best-practice-guide-data-center-design_0.pdf"},{"title":"DOE · Thermodynamics, Heat Transfer, and Fluid Flow","url":"https://www.energy.gov/sites/default/files/2026-04/DOE-HDBK-1012-92_VOL1.pdf"},{"title":"ISO/IEC 30134-2 · Power usage effectiveness","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"},{"title":"NVIDIA · DGX GB200 hardware reference","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}]}]}

    <script type="module">
      // math.js
function mathFinite(value, name, minimum = 0, exclusive = false) {
  if (
    !Number.isFinite(value) ||
    (exclusive ? value <= minimum : value < minimum)
  ) {
    throw new RangeError(
      `${name} must be finite and ${exclusive ? "greater than" : "at least"} ${minimum}.`,
    );
  }
  return value;
}

function mathFraction(value, name) {
  mathFinite(value, name, 0, true);
  if (value > 1) throw new RangeError(`${name} cannot exceed 1.`);
  return value;
}

function mathSlots(value, name) {
  if (!Number.isSafeInteger(value) || value < 0) {
    throw new RangeError(`${name} must be a nonnegative safe integer.`);
  }
  return value;
}

function mathRackLimit(powerMW, rackKW) {
  const ratio = mathFinite((powerMW * 1000) / rackKW, "Rack limit");
  // Preserve an exact rack boundary when unit conversion introduces roundoff.
  const nearest = Math.round(ratio);
  const tolerance = 4 * Number.EPSILON * Math.max(1, ratio);
  return mathSlots(
    Math.abs(ratio - nearest) <= tolerance ? nearest : Math.floor(ratio),
    "Rack limit",
  );
}

function currentThreePhase(powerMW, voltageKV, powerFactor = 1) {
  mathFinite(powerMW, "Power");
  mathFinite(voltageKV, "Line-to-line voltage", 0, true);
  mathFraction(powerFactor, "Power factor");
  return mathFinite(
    ((powerMW / voltageKV) * 1000) / Math.sqrt(3) / powerFactor,
    "Current",
  );
}

function resistiveLossRatio(voltageKV, referenceKV = 138) {
  mathFinite(voltageKV, "Voltage", 0, true);
  mathFinite(referenceKV, "Reference voltage", 0, true);
  return mathFinite((referenceKV / voltageKV) ** 2, "Loss ratio");
}

function energyMWh(powerMW, hours) {
  mathFinite(powerMW, "Power");
  mathFinite(hours, "Duration");
  return mathFinite(powerMW * hours, "Energy");
}

function rideThroughMinutes(energyMWh, powerMW, efficiency = 1) {
  mathFinite(energyMWh, "Usable stored energy");
  mathFinite(powerMW, "Load power", 0, true);
  mathFraction(efficiency, "Discharge efficiency");
  return mathFinite((energyMWh / powerMW) * efficiency * 60, "Runtime");
}

function rackCurrent(powerKW, voltageV) {
  mathFinite(powerKW, "DC power");
  mathFinite(voltageV, "DC voltage", 0, true);
  return mathFinite((powerKW / voltageV) * 1000, "DC current");
}

function coolantFlow(powerKW, deltaT, cp = 4.18) {
  mathFinite(powerKW, "Heat load");
  mathFinite(deltaT, "Coolant temperature rise", 0, true);
  mathFinite(cp, "Specific heat capacity", 0, true);
  return mathFinite(powerKW / deltaT / cp, "Mass flow");
}

function capacityBudget(
  facilityMW,
  pue,
  coolingMW,
  rackKW,
  rackSlots,
  networkRacks,
  electricalMW = Infinity,
) {
  mathFinite(facilityMW, "Facility power budget");
  mathFinite(pue, "Assumed facility-to-IT ratio", 1);
  mathFinite(coolingMW, "Available IT heat-removal capacity");
  mathFinite(rackKW, "Rack power", 0, true);
  mathSlots(rackSlots, "Physical rack slots");
  mathSlots(networkRacks, "Network-supported rack count");
  const itBudgetMW = facilityMW / pue;
  const limits = {
    power: mathRackLimit(itBudgetMW, rackKW),
    cooling: mathRackLimit(coolingMW, rackKW),
    space: rackSlots,
    network: networkRacks,
  };
  if (electricalMW !== Infinity) {
    mathFinite(electricalMW, "Downstream electrical IT capacity");
    limits.electrical = mathRackLimit(electricalMW, rackKW);
  }
  const supportedRacks = Math.min(...Object.values(limits));
  const supportedITMW = mathFinite(
    (supportedRacks * rackKW) / 1000,
    "Supported IT power",
  );
  return {
    itBudgetMW,
    supportedRacks,
    supportedITMW,
    facilityDrawMW: mathFinite(supportedITMW * pue, "Scenario facility draw"),
    binding: Object.keys(limits).filter(
      (key) => limits[key] === supportedRacks,
    ),
    limits,
  };
}

// diagrams.js
// prettier-ignore
const VISUAL_IDS = [
  "campus",
  "energy",
  "grid",
  "voltage",
  "substation",
  "capacity",
  "train",
  "ride-through",
  "redundancy",
  "failure",
  "rack",
  "current",
  "compute",
  "heat",
  "liquid",
  "cdu",
  "air",
  "rejection",
  "pue",
  "bottleneck",
  "case",
  "synthesis"
];
const C = {
  power: "#ffc875",
  cold: "#75d8e7",
  hot: "#f08383",
  ink: "#dbe7ee",
  muted: "#9eb3c1",
  green: "#93dbb0",
  violet: "#bab0f3",
};
const fmt = (n, d = 0) =>
  Number(n).toLocaleString("en-US", {
    maximumFractionDigits: d,
    minimumFractionDigits: d,
  });
function txt(x, y, s, cls = "", color = "", anchor = "start") {
  return `<text x="${x}" y="${y}" class="diagram-text ${cls}"${color ? ` fill="${color}" style="fill:${color}"` : ""} text-anchor="${anchor}">${s}</text>`;
}
function line(d, c = C.power, w = 3, extra = "") {
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
}
function rect(x, y, w, h, fill = "#203545", stroke = "#547084", r = 3) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;
}
function dot(x, y, c = C.power, r = 5) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
}
function arrow(d, c = C.power, w = 3) {
  return line(d, c, w, `marker-end="url(#a-${c.slice(1)})"`);
}
function metric(x, y, n, unit, label, c = C.power) {
  return (
    txt(x, y, n, "diagram-number", c) +
    txt(x, y + 28, unit, "diagram-small", c) +
    txt(x, y + 60, label, "diagram-small")
  );
}
function chip(x, y, w = 100, h = 95) {
  let p = "";
  for (let i = 10; i < w; i += 12)
    p += line(`M${x + i} ${y - 9}v9 M${x + i} ${y + h}v9`, "#628294", 2);
  for (let i = 10; i < h; i += 12)
    p += line(`M${x - 9} ${y + i}h9 M${x + w} ${y + i}h9`, "#628294", 2);
  return (
    p +
    rect(x, y, w, h, "#1a3242", "#87a4b4") +
    rect(x + 12, y + 12, w - 24, h - 24, "#365963", C.cold) +
    line(`M${x + 20} ${y + 20}h${w - 40}v${h - 40}h-${w - 40}Z`, "#87d2ce", 0.6)
  );
}
function server(x, y, w = 110, h = 30, lit = true) {

function cube(
  x,
  y,
  w,
  d,
  h,
  colors = ["#365769", "#233f51", "#192f41"],
  stroke = "#638294",
) {
  const p = [
      [x, y],
      [x + w, y + w * 0.38],
      [x + w - d, y + w * 0.38 + d * 0.5],
      [x - d, y + d * 0.5],

    `<polygon points="${pts.map((a) => a.join(",")).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
  return (
    poly([p[0], p[1], t[1], t[0]], colors[1]) +
    poly([p[1], p[2], t[2], t[1]], colors[2]) +
    poly(t, colors[0])
  );

function renderDiagram(id, state = {}) {
  const scenes = {
    campus: campusScene,
    energy: energyScene,
    grid: gridScene,
    voltage: voltageScene,
    substation: substationScene,
    capacity: capacityScene,
    train: trainScene,
    "ride-through": rideScene,
    redundancy: redundancyScene,
    failure: failureScene,
    rack: rackScene,
    current: currentScene,
    compute: computeScene,
    heat: heatScene,
    liquid: liquidScene,
    cdu: cduScene,
    air: airScene,
    rejection: rejectionScene,
    pue: pueScene,
    bottleneck: bottleneckScene,
    case: caseScene,
    synthesis: (s) => campusScene(s, true),
  };
  if (!scenes[id]) throw new Error(`Unknown visual: ${id}`);
  const original = scenes[id](state);
  const result = state.compact ? compactDiagram(id, state, original) : original;
  const svg = sv(result.label, result.body);
  return {
    ...result,
    svg: result.compact
      ? svg.replace(
          'viewBox="0 0 900 545"',
          'class="compact-diagram" viewBox="0 0 600 580"',
        )
      : svg,
  };
}

  Number(value).toLocaleString("en-US", {
    maximumFractionDigits: digits,
    minimumFractionDigits: digits,
  });

function currentState() {
  const id = lessons[lessonIndex].id;
  if (!lessonState.has(id)) lessonState.set(id, { ...defaults });
  return lessonState.get(id);
}
function setLesson(index, focus = false) {
  document.querySelectorAll("dialog[open]").forEach((dialog) => dialog.close());
  lessonIndex = Math.max(0, Math.min(lessons.length - 1, index));
  const l = lessons[lessonIndex];
  if (location.hash !== `#${l.id}`) history.pushState(null, "", `#${l.id}`);
  document.title = `${l.title} — GIGAWATT`;
  el("eyebrow").textContent = l.eyebrow;
  el("lesson-title").textContent = l.title;
  el("lesson-body").textContent = l.body;
  el("takeaway").textContent = l.takeaway;
  el("notes").innerHTML =
    `<h2>A closer look</h2>${l.notes.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}`;
  el("notes").hidden = !explanationOpen;
  el("notes-button").setAttribute("aria-expanded", String(explanationOpen));
  el("notes-button").innerHTML =
    `${explanationOpen ? "Close the explanation" : "Read the explanation"} <span aria-hidden="true">${explanationOpen ? "−" : "↗"}</span>`;
  el("chapters")
    .querySelectorAll("button")
    .forEach((button, i) => {
      const active = course.chapters[i].id === l.chapter;
      button.classList.toggle("active", active);
      button.classList.toggle(
        "visited",
        course.chapters.findIndex((c) => c.id === l.chapter) > i,
      );
      if (active) button.setAttribute("aria-current", "step");
      else button.removeAttribute("aria-current");
    });
  const chapterRail = el("chapters");
  const activeChapter = chapterRail.querySelector(".active");
  if (activeChapter && innerWidth <= 760)
    chapterRail.scrollLeft =
      activeChapter.offsetLeft -
      chapterRail.clientWidth / 2 +
      activeChapter.offsetWidth / 2;
  el("progress")
    .querySelectorAll("button")
    .forEach((button, i) => {
      button.classList.toggle("active", i === lessonIndex);
      button.classList.toggle("past", i < lessonIndex);
      if (i === lessonIndex) button.setAttribute("aria-current", "step");
      else button.removeAttribute("aria-current");
    });
  el("lesson-counter").textContent =
    `${String(lessonIndex + 1).padStart(2, "0")} / ${lessons.length}`;
  el("prev").disabled = lessonIndex === 0;
  el("next-label").textContent =
    lessonIndex === lessons.length - 1 ? "Back to start" : "Next lesson";
  el("next").setAttribute(
    "aria-label",
    lessonIndex === lessons.length - 1 ? "Back to first lesson" : "Next lesson",
  );
  renderControls(l.visual);
  updateVisual();
  renderCheck(l);
  if (focus) {
    el("lesson-title").focus({ preventScroll: true });

}
function fromHash() {
  let hash;
  try {
    hash = decodeURIComponent(location.hash.slice(1));
  } catch {
    hash = "";
  }
  setLesson(byId.get(hash) ?? 0);
}
function updateVisual() {
  const l = lessons[lessonIndex],
    state = currentState(),
    d = renderDiagram(l.visual, { ...state, compact: innerWidth <= 760 });
  el("visual").innerHTML = d.svg;
  el("visual-label").textContent = d.label;

  el("visual-caption").textContent = d.caption;

  if (output) {

}
function labResult(id, s) {
  switch (id) {
    case "capacity":
      return [
        "Announced: intended capacity, not operation.",
        "Connected: an electrical connection is established.",
        "Energized: equipment is electrically live.",
        "Commissioned: the required integrated tests are passed.",
        "Loaded: IT equipment is drawing power under workload.",
      ][s.gate];
    case "train":
      return [
        "Transformer: changes voltage.",
        "Switchgear: isolates and protects.",
        "UPS: conditions power and bridges interruptions.",
        "Busway: distributes power toward racks.",
        "Rack: converts AC to DC for its equipment.",
      ][s.equipment];
    case "compute":
      return `${s.utilization}% illustrative scheduled busy time. This is not measured efficiency or a token rate.`;
    case "case":
      return s.caseView === 0
        ? "Use dated evidence to establish each site milestone."
        : "An announced capacity does not establish measured IT load, utilization, or installed GPU count.";
    case "energy":
      return `${formatValue(s.power, 1)} MW × ${s.hours} h = ${formatValue(energyMWh(s.power, s.hours), 1)} MWh.`;
    case "voltage":
      return `${formatValue(currentThreePhase(100, s.voltage))} A per phase · ${formatValue(resistiveLossRatio(s.voltage, 13.8) * 100, 2)}% of the 13.8 kV conductor loss.`;
    case "ride-through":
      return `${s.outage ? "Utility off. UPS carries the load." : "Utility available."} Stored energy supports ${formatValue(rideThroughMinutes(s.battery, 5), 1)} ideal minutes at 5 MW.`;
    case "redundancy":
      return s.pathFailed
        ? "Path A unavailable. Path B supplies the complete load."
        : "Both independent full-capacity paths are available.";
    case "failure":
      return s.fault
        ? "Middle feeder isolated. The two other feeders remain powered."
        : "All three feeders are powered.";
    case "current":
      return `${formatValue(rackCurrent(1, s.coreV))} A at ${s.coreV} V for the same ideal 1 kW load.`;
    case "liquid":
      return `${formatValue(coolantFlow(100, s.deltaT), 2)} kg/s, approximately ${formatValue(coolantFlow(100, s.deltaT) * 60)} L/min of water.`;
    case "rejection":
      return `100 kW absorbed + ${s.chiller} kW work = ${100 + s.chiller} kW rejected.`;
    case "pue":
      return `${formatValue(100 / s.pue, 1)} MW IT + ${formatValue(100 - 100 / s.pue, 1)} MW overhead = 100 MW facility.`;
    case "bottleneck": {
      const b = capacityBudget(
        100,
        s.budgetPue,
        s.cooling,
        100,
        900,
        s.network,
        70,
      );
      return `${b.supportedRacks} rack equivalents · ${b.supportedITMW} MW IT · ${formatValue(b.facilityDrawMW, 1)} MW facility draw. Binding limit: ${b.binding.join(" + ")}.`;
    }
    default:
      return "";
  }
}
function range(key, label, min, max, step, unit, digits = 0) {
  const s = currentState();
  return `<div class="control"><label for="control-${key}">${label}<output id="value-${key}" for="control-${key}">${formatValue(s[key], digits)} ${unit}</output></label><input type="range" id="control-${key}" data-key="${key}" data-digits="${digits}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${s[key]}"></div>`;
}
function choices(key, values) {
  const s = currentState();
  return `<div class="segmented">${values.map(([value, label]) => `<button class="toggle" data-key="${key}" data-value="${value}" aria-pressed="${String(s[key] === value)}">${label}</button>`).join("")}</div>`;
}
function renderControls(id) {
  let html = "";
  switch (id) {
    case "energy":
      html =
        range("power", "Constant power", 0.5, 5, 0.5, "MW", 1) +
        range("hours", "Running time", 1, 24, 1, "h");
      break;
    case "voltage":
      html = range("voltage", "Line-to-line voltage", 13.8, 138, 13.8, "kV", 1);
      break;
    case "capacity":
      html = choices("gate", [
        [0, "Announced"],
        [1, "Connected"],
        [2, "Energized"],
        [3, "Commissioned"],
        [4, "Loaded"],
      ]);
      break;
    case "train":
      html = choices("equipment", [
        [0, "Transformer"],
        [1, "Switchgear"],
        [2, "UPS"],
        [3, "Busway"],
        [4, "Rack"],
      ]);
      break;
    case "ride-through":
      html =
        choices("outage", [
          [false, "Utility on"],
          [true, "Interrupt utility"],
        ]) +
        range("battery", "Usable output energy", 0.05, 0.5, 0.05, "MWh", 2);
      break;
    case "redundancy":
      html = choices("pathFailed", [
        [false, "Both paths available"],
        [true, "Disable path A"],
      ]);
      break;
    case "failure":
      html = choices("fault", [
        [false, "Normal operation"],
        [true, "Fault the middle feeder"],
      ]);
      break;
    case "current":
      html = choices("coreV", [
        [50, "50 V bus"],
        [12, "12 V rail"],
        [1, "1 V near the processor"],
      ]);
      break;
    case "compute":
      html = range(
        "utilization",
        "Illustrative scheduled busy time",
        10,
        100,
        10,
        "%",
      );
      break;
    case "liquid":
      html = range("deltaT", "Coolant temperature rise", 5, 20, 1, "°C");
      break;
    case "rejection":
      html = range("chiller", "Illustrative compressor work", 5, 50, 5, "kW");
      break;
    case "pue":
      html = range(
        "pue",
        "Assumed facility-to-IT ratio",
        1.1,
        1.6,
        0.05,
        "",
        2,
      );
      break;
    case "bottleneck":
      html =
        range("cooling", "Available IT cooling duty", 20, 100, 5, "MW") +
        range("network", "Network-supported racks", 300, 1000, 50, "racks") +
        range(
          "budgetPue",
          "Assumed facility-to-IT ratio",
          1.1,
          1.6,
          0.05,
          "",
          2,
        );
      break;
    case "case":
      html = choices("caseView", [
        [0, "What does this establish?"],
        [1, "What is still unknown?"],
      ]);
      break;
  }
  el("experiment").innerHTML = html
    ? `${html}<output id="experiment-result" class="experiment-result" aria-live="polite" aria-atomic="true"></output><button class="reset" id="reset-experiment">Reset experiment ↺</button>`
    : "";
  el("experiment")
    .querySelectorAll("input")
    .forEach((input) =>
      input.addEventListener("input", () => {
        const key = input.dataset.key;
        currentState()[key] = Number(input.value);
        el(`value-${key}`).textContent =
          `${formatValue(input.value, Number(input.dataset.digits))} ${input.dataset.unit}`;
        updateVisual();
      }),
    );
  el("experiment")
    .querySelectorAll(".toggle")
    .forEach((button) =>
      button.addEventListener("click", () => {
        const raw = button.dataset.value;
        currentState()[button.dataset.key] =
          raw === "true" ? true : raw === "false" ? false : Number(raw);
        el("experiment")
          .querySelectorAll(".toggle")
          .forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
        updateVisual();
      }),
    );
  if (el("reset-experiment"))
    el("reset-experiment").addEventListener("click", () => {
      lessonState.set(lessons[lessonIndex].id, { ...defaults });
      renderControls(id);
      updateVisual();
      el("experiment")
        .querySelector("input, .toggle")
        ?.focus({ preventScroll: true });
    });
}
function renderCheck(l) {
  const box = el("knowledge-check");
  box.hidden = !l.check;
  if (!l.check) {
    box.innerHTML = "";
    return;
  }
  const c = l.check;
  box.innerHTML = `<div class="check-question"><p class="eyebrow">TEST YOUR MENTAL MODEL</p><h2>${escapeHtml(c.question)}</h2></div><div class="check-options">${c.options.map((option, i) => `<button class="answer-button" data-answer="${i}" aria-pressed="false"><span aria-hidden="true">${String.fromCharCode(65 + i)}</span>${escapeHtml(option)}</button>`).join("")}<p id="answer-feedback" class="answer-feedback" aria-live="polite"></p></div>`;
  function answer(i) {
    checkAnswers.set(l.id, i);
    box.querySelectorAll(".answer-button").forEach((b, j) => {

      b.classList.toggle("correct", i === c.answer && j === i);

      (i === c.answer ? "Exactly. " : "Try the mechanism again. ") +
      c.explanation;
  }
  box
    .querySelectorAll(".answer-button")
    .forEach((button) =>
      button.addEventListener("click", () =>
        answer(Number(button.dataset.answer)),
      ),
    );
  if (checkAnswers.has(l.id)) answer(checkAnswers.get(l.id));
}
