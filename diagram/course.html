<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="gigawatt-source-digest" content="9963cb7202ca56619c754042a1dc46fc24e43f7905504c8ea7799a5e7786a139">
<title>GIGAWATT — complete course</title>
<style>
  :root {
    --paper: #fafaf7;
    --ink: #1a1a1a;
    --faint: #d4d4cd;
    --muted: #5f5f59;
    --rail: 286px;
    --head: 112px;
    --transport: 74px;
    --rule: 1.5px;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background: var(--paper);
    font-family: Inter, 'Helvetica Neue', sans-serif;
  }
  button { color: inherit; font: inherit; }
  #shot-rail {
    position: absolute;
    z-index: 12;
    inset: 0 auto 0 0;
    width: var(--rail);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    background: var(--paper);
    border-right: var(--rule) solid var(--ink);
  }
  #rail-heading { padding: 18px 18px 14px; border-bottom: 1px solid var(--faint); }
  #rail-heading p { margin: 0; color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
  #rail-heading h1 { margin: 5px 0 0; font-size: 17px; line-height: 1.15; }
  #shot-list { overflow-y: auto; padding: 8px 0 18px; }
  .shot-button {
    width: 100%;
    padding: 10px 16px 11px;
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr);
    gap: 8px;
    border: 0;
    border-left: 4px solid transparent;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .shot-button:hover { background: color-mix(in srgb, var(--faint) 26%, transparent); }
  .shot-button[aria-current="step"] { border-left-color: var(--ink); background: color-mix(in srgb, var(--faint) 38%, transparent); }
  .shot-number { padding-top: 1px; color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
  .shot-name { display: block; font-size: 10px; font-weight: 700; line-height: 1.25; }
  .segment-name { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; line-height: 1.2; }
  #masthead {
    position: absolute;
    z-index: 10;
    top: 0;
    right: 0;
    left: var(--rail);
    min-height: var(--head);
    padding: 18px 24px 15px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    background: color-mix(in srgb, var(--paper) 95%, transparent);
    border-bottom: var(--rule) solid var(--ink);
  }
  #eyebrow, #shot-id { margin: 0; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #title { margin: 5px 0 0; font-size: 20px; line-height: 1.1; }
  #scope-summary, #scope-ids { margin: 5px 0 0; font-size: 10px; line-height: 1.25; }
  #scope-ids { max-width: 760px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  #posture {
    align-self: start;
    min-width: 190px;
    padding: 9px 11px;
    border: var(--rule) solid var(--ink);
    background: var(--paper);
  }
  #mode { margin: 5px 0 0; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  #reveal-summary { margin: 5px 0 0; color: var(--muted); font-size: 9px; line-height: 1.25; }
  #stage {
    position: absolute;
    inset: var(--head) 0 var(--transport) var(--rail);
    background: var(--paper);
  }
  #three-mount, #map-stage { position: absolute; inset: 0; }
  #three-mount canvas { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #map-stage { padding: 18px 22px; }
  #map-svg { width: 100%; height: 100%; display: block; }
  .node-label {
    max-width: 205px;
    padding: 4px 7px;
    color: var(--ink);
    background: color-mix(in srgb, var(--paper) 91%, transparent);
    border: 1px solid var(--ink);
    font-size: 10px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
  }
  .node-label small {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .035em;
    text-transform: uppercase;
  }
  #transport {
    position: absolute;
    z-index: 11;
    right: 0;
    bottom: 0;
    left: var(--rail);
    min-height: var(--transport);
    padding: 12px 18px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    gap: 10px;
    align-items: center;
    background: color-mix(in srgb, var(--paper) 96%, transparent);
    border-top: var(--rule) solid var(--ink);
  }
  .arrow, #context-toggle {
    height: 38px;
    border: var(--rule) solid var(--ink);
    background: transparent;
    cursor: pointer;
  }
  .arrow { width: 44px; }
  #context-toggle { min-width: 132px; padding: 0 12px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
  .arrow:disabled { color: var(--faint); border-color: var(--faint); cursor: default; }
  #manual-note { margin: 0; text-align: center; color: var(--muted); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; }
  #loading {
    position: absolute;
    z-index: 30;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
    font-size: 12px;
  }
  #loading[data-state="error"] {
    padding: 32px;
    text-align: center;
    white-space: pre-line;
  }
  @media (max-width: 820px) {
    :root { --rail: 72px; --head: 126px; }
    #rail-heading h1 { display: none; }
    #rail-heading { padding-inline: 8px; }
    .shot-button { grid-template-columns: 1fr; padding-inline: 8px; }
    .shot-number { text-align: center; }
    .shot-name, .segment-name { display: none; }
    #masthead { padding: 14px 15px 12px; grid-template-columns: 1fr; gap: 7px; }
    #posture { display: none; }
    #scope-ids { max-width: 72vw; }
    #transport { padding-inline: 8px; }
    #context-toggle { min-width: 100px; }
  }

  :root { --head: 148px; --notes: 430px; }
  #masthead { height: var(--head); min-height: var(--head); overflow: hidden; }
  #opening-question { margin: 5px 0 0; font-size: 11px; font-weight: 700; line-height: 1.25; }
  #objective { margin: 4px 0 0; color: var(--muted); font-size: 9px; line-height: 1.25; }
  #scope-summary { color: var(--muted); }
  #transport { grid-template-columns: auto minmax(0, 1fr) auto auto auto; }
  #evidence-toggle {
    min-width: 128px;
    height: 38px;
    padding: 0 12px;
    border: var(--rule) solid var(--ink);
    background: transparent;
    cursor: pointer;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
  }
  #notes-panel {
    position: absolute;
    z-index: 24;
    top: var(--head);
    right: 0;
    bottom: var(--transport);
    width: min(var(--notes), calc(100vw - var(--rail)));
    padding: 19px 20px 28px;
    overflow-y: auto;
    background: color-mix(in srgb, var(--paper) 98%, transparent);
    border-left: var(--rule) solid var(--ink);
    transform: translateX(100%);
    transition: transform 160ms ease-out;
  }
  #notes-panel[data-open="true"] { transform: translateX(0); }
  #notes-close {
    float: right;
    width: 34px;
    height: 30px;
    border: 1px solid var(--ink);
    background: transparent;
    cursor: pointer;
  }
  #notes-kicker { margin: 0; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #notes-title { margin: 6px 44px 15px 0; font-size: 18px; line-height: 1.15; }
  .notes-section { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--faint); }
  .notes-section h3 { margin: 0 0 8px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .notes-section p, .notes-section li { font-size: 10px; line-height: 1.45; }
  .notes-section ul { margin: 0; padding-left: 18px; }
  .notes-section li + li { margin-top: 8px; }
  .guard-list strong { display: block; margin-bottom: 2px; font-size: 9px; text-transform: uppercase; }
  .claim-card { margin-top: 11px; padding: 11px; border: 1px solid var(--faint); }
  .claim-card h4 { margin: 0 0 7px; font-size: 10px; }
  .claim-card p { margin: 5px 0 0; }
  .fact-value { font-weight: 700; }
  .source-list { margin-top: 6px !important; color: var(--muted); }
  .source-list a { color: inherit; }
  .ready { border-left: 5px solid #2f6f4e !important; }
  .gated { border-left: 5px solid #9c5f20 !important; }
  @media (max-width: 1100px) and (min-width: 821px) {
    :root { --head: 166px; }
    #objective { display: none; }
  }
  @media (max-width: 820px) {
    :root { --head: 156px; }
    #objective { display: none; }
    #evidence-toggle { min-width: 92px; }
    #notes-panel { width: calc(100vw - var(--rail)); }
  }

</style>
</head>

lant Federal Operating Permit Application 37589","url":"https://www.tceq.texas.gov/assets/public/permitting/air/reports/applications/37589-tc.pdf"}],"value":"Unknown — not established by the cited evidence"}],"id":"bess_operation_unknown"},{"assertion":"confirmed","binding":"topology","facts":[{"as_of":"2025-09-30","basis":"Crusoe reports NVIDIA GB200 racks delivered in June 2025 and early workloads running; it does not identify an operating rack count.","lifecycle":"deployed","posture":"confirmed","ref":"abilene:rack_platform","scope":"Operationally supported first-phase rack-platform family at the original Abilene campus; family identity only, not rack, tray, or GPU quantity","sources":[{"id":"crusoe_abilene_live_2025","publisher":"Crusoe","title":"Crusoe announces flagship Abilene data center is live","url":"https://www.crusoe.ai/resources/newsroom/crusoe-announces-flagship-abilene-data-center-is-live"}],"value":"NVIDIA GB200 (platform family)"}],"id":"operating_compute_anchor"},{"assertion":"design_reference","binding":"overlay","facts":[{"as_of":"2025-07","basis":"NERC reports that the transition between training and checkpoint saving, or the reverse transition, may occur in under one second.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:ai_training_checkpoint_transition_duration","scope":"NERC-observed transition between AI training and checkpoint saving in a 50 MW block of a larger 200 MW facility; not an Abilene waveform.","sources":[{"id":"nerc_emerging_large_loads_2025","publisher":"North American Electric Reliability Corporation","title":"Characteristics and Risks of Emerging Large Loads","url":"https://www.nerc.com/globalassets/who-we-are/standing-committees/rstc/3_doc_white-paper-characteristics-and-risks-of-emerging-large-loads.pdf"}],"value":"less than 1 (second)"},{"as_of":"2025-07","basis":"NERC reports a 1.9 per-unit-per-second demand change lasting about 250 milliseconds in the fastest ramping period of the observed profile.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:ai_training_observed_ramp_rate","scope":"Fastest interval in NERC's 50 MW-block AI-training observation; not a universal AI profile, processor specification, or Abilene measurement.","sources":[{"id":"nerc_emerging_large_loads_2025","publisher":"North American Electric Reliability Corporation","title":"Characteristics and Risks of Emerging Large Loads","url":"https://www.nerc.com/globalassets/who-we-are/standing-committees/rstc/3_doc_white-paper-characteristics-and-risks-of-emerging-large-loads.pdf"}],"value":"1.9 per unit per second for approximately 250 milliseconds"},{"as_of":"2025-12","basis":"PNNL explains that individual processor demand can vary on millisecond timescales and that parallel computation correlates those variations, making them significant at site level.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:parallel_ai_load_correlation","scope":"Generic grid-level modeling principle for AI training and inference; not an Abilene transient magnitude, frequency, or operating trace.","sources":[{"id":"doe_pnnl_data_center_emt_2025","publisher":"Pacific Northwest National Laboratory for the U.S. Department of Energy","title":"Electromagnetic Transient Modeling of Large Data Centers for Grid-Level Studies - Alpha Release","url":"https://www.energy.gov/sites/default/files/2026-01/Data_Center_EMT_Models.pdf"}],"value":"Millisecond processor-power variations can correlate during hyperscale parallel AI work and become significant at the site-demand boundary. (load-dynamics relationship)"},{"as_of":"2025-07","basis":"NERC states that fast load changes can outpace conventional generator ramping, stress balancing, voltage, and frequency control, and require operators to understand load ramp rates and procure suitable response.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:large_load_grid_response_mismatch","scope":"Generic North American bulk-power-system relationship; not a response requirement, reserve product, or measured condition at Abilene.","sources":[{"id":"nerc_emerging_large_loads_2025","publisher":"North American Electric Reliability Corporation","title":"Characteristics and Risks of Emerging Large Loads","url":"https://www.nerc.com/globalassets/who-we-are/standing-committees/rstc/3_doc_white-paper-characteristics-and-risks-of-emerging-large-loads.pdf"}],"value":"Large power-electronic loads can shift in seconds, faster than conventional generators can ramp (response-time relationship)"}],"id":"synchronized_ai_load_dynamics"},{"assertion":"design_reference","binding":"overlay","facts":[{"as_of":"2024-07-10","basis":"NERC found that six properly cleared 42-66 millisecond faults coincided with approximately 1,500 MW of customer-side data-center load reduction; operators observed frequency and voltage rise after the load loss.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:voltage_sag_data_center_load_loss_event","scope":"NERC's 2024 Eastern Interconnection incident involving a concentration of data-center-type load; not Abilene and not an AI-training ramp event.","sources":[{"id":"nerc_voltage_sensitive_load_incident_2025","publisher":"North American Electric Reliability Corporation","title":"Incident Review - Considering Simultaneous Voltage-Sensitive Load Reductions","url":"https://www.nerc.com/globalassets/our-work/reports/event-reports/incident_review_large_load_loss.pdf"}],"value":"1500 MW approximate customer-side load reduction"}],"id":"voltage_sensitive_load_event"},{"assertion":"design_reference","binding":"overlay","facts":[{"as_of":"2025-01-08","basis":"NERC describes battery-backed centralized and rack UPS systems as taking over during transient voltage disturbances; their batteries are intended for the disturbance interval or until a backup generator starts.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:ups_short_duration_ride_through_role","scope":"Generic static-UPS behavior described in a NERC incident review; not an Abilene UPS design, setting, capacity, runtime, or transfer sequence.","sources":[{"id":"nerc_voltage_sensitive_load_incident_2025","publisher":"North American Electric Reliability Corporation","title":"Incident Review - Considering Simultaneous Voltage-Sensitive Load Reductions","url":"https://www.nerc.com/globalassets/our-work/reports/event-reports/incident_review_large_load_loss.pdf"}],"value":"A battery-backed UPS can assume load for a short grid disturbance or bridge until backup generation starts. (generic ride-through role)"},{"as_of":"2025-12","basis":"PNNL explains the UPS battery's DC-link support mechanism and states that more restrictive protection limits vary by site and may be user-set.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:ups_ridethrough_depends_on_site_settings","scope":"Generic double-conversion UPS behavior; no Abilene control or protection setting is inferred.","sources":[{"id":"doe_pnnl_data_center_emt_2025","publisher":"Pacific Northwest National Laboratory for the U.S. Department of Energy","title":"Electromagnetic Transient Modeling of Large Data Centers for Grid-Level Studies - Alpha Release","url":"https://www.energy.gov/sites/default/files/2026-01/Data_Center_EMT_Models.pdf"}],"value":"UPS ride-through depends on OEM capability, protection settings, operating mode, current limiting, synchronism, and output-voltage regulation. (configuration dependency)"},{"as_of":"2026-06-26","basis":"Vertiv distinguishes series critical-load UPS protection from the site-level energy-management, peak-shaving, and grid-services roles of a conventional behind-the-meter BESS.","lifecycle":"design_reference","posture":"design_not_observed","ref":"delivery_resilience:ups_and_btm_bess_role_separation","scope nding":"overlay","facts":[{"as_of":"2025-12-31","basis":"The filing states these payment and capacity-mismatch exposures directly.","lifecycle":"operating_business_model","posture":"confirmed_contract","ref":"commercial_compute:coreweave_capacity_and_utilization_risk_comparison","scope":"CoreWeave contracts and facility leases as reported for 2025; not Abilene","sources":[{"id":"coreweave_2025_10k","publisher":"CoreWeave, Inc., filed with the U.S. Securities and Exchange Commission","title":"Annual Report on Form 10-K for the year ended December 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1769628/000176962826000104/crwv-20251231.htm"}],"value":"CoreWeave committed contracts typically require payment regardless of utilization, while on-demand arrangements permit usage reductions with limited notice; multi-year fixed-capacity facility leases can leave CoreWeave paying for capacity that customers do not use and pay for. (named risk-allocation comparison)"}],"id":"neocloud_contract_risk_comparison"},{"assertion":"business_model_reference","binding":"overlay","facts":[{"as_of":"2025-06-30","basis":"Microsoft's annual report describes its operating footprint, owned and leased facilities, capital investment, cloud revenue, and economies of scale.","lifecycle":"operating_business_model","posture":"confirmed","ref":"commercial_compute:microsoft_hyperscale_cloud_comparison","scope":"Microsoft hyperscale cloud as reported for fiscal 2025; not Abilene","sources":[{"id":"microsoft_2025_annual_report","publisher":"Microsoft Corporation","title":"2025 Annual Report","url":"https://www.microsoft.com/investor/reports/ar25/index.html"}],"value":"Microsoft operates data centers, owns and leases facilities, invests in data centers and computer systems, and sells Azure and other cloud services; aggregating diverse demand is part of its stated utilization economics. (named business-model comparison)"}],"id":"hyperscale_cloud_comparison"}],"depends_on":[],"evidence_readiness" asis":"no evidence-backed estimate","lifecycle":"operation_unknown","posture":"no_evidence_backed_estimate","ref":"abilene:installed_gpu_count","scope":"Original Abilene campus installed or operational GPU fleet","sources":[{"id":"crusoe_abilene_expansion_2025","publisher":"Crusoe","title":"Crusoe expands AI data center campus in Abilene to 1.2 gigawatts","url":"https://www.crusoe.ai/resources/newsroom/crusoe-expands-ai-data-center-campus-in-abilene-to-1-2-gigawatts"},{"id":"crusoe_abilene_live_2025","publisher":"Crusoe","title":"Crusoe announces flagship Abilene data center is live","url":"https://www.crusoe.ai/resources/newsroom/crusoe-announces-flagship-abilene-data-center-is-live"}],"value":"No evidence-backed estimate"}],"id":"current_installed_gpu_no_estimate"},{"assertion":"reported_untyped","binding":"overlay","facts":[{"as_of":"2026-08-25","basis":"Oracle reports 42 percent of total capacity delivered without stating the denominator, capacity basis, MW, building count, IT load, or current load.","lifecycle":"delivered_untyped","posture":"reported_untyped","ref":"abilene:oracle_capacity_delivered_percent_untyped","scope":"Oracle's Abilene portfolio-page wording","sources":[{"id":"oracle_abilene_portfolio","publisher":"Oracle","title":"AI Data Centers - Investing in Communities, Powering the Future","url":"https://www.oracle.com/data-centers/"}],"value":"42 percent"}],"id":"untyped_delivery_boundary"},{"assertion":"confirmed","binding":"topology","facts":[{"as_of":"2025-09-30","basis":"Crusoe reports NVIDIA GB200 racks delivered in June 2025 and early workloads running; it does not identify an operating rack count.","lifecycle":"deployed","posture":"confirmed","ref":"abilene:rack_platform","scope":"Operationally supported first-phase rack-platform family at the original Abilene campus; family identity only, not rack, tray, or GPU quantity","sources":[{"id":"crusoe_abilene_live_2025","publisher":"Crusoe","title":"Crusoe announces flagship Abilene data center is live","url":"https://www.crusoe.ai/resources/newsroom/crusoe-announces-flagship-abilene-data-center-is-live"}],"value":"NVIDIA GB200 (platform family)"}],"id":"operating_platform_anchor"},{"assertion":"product_reference","binding":"topology","facts":[{"as_of":"2026-03-03","basis":"NVIDIA specifies that DGX GB200 power shelves convert AC to nominal 50-51 VDC.","lifecycle":"product_documented","posture":"confirmed_model_spec","ref":"abilene:rack_power_shelf_output_vdc","scope":"NVIDIA DGX GB200 rack power-shelf nominal DC busbar output","sources":[{"id":"nvidia_dgx_gb200_hardware","publisher":"NVIDIA","title":"DGX GB200 Hardware Overview","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"value":"50-51 (VDC)"}],"id":"rack_power_product_reference"},{"assertion":"selected_design","binding":"topology","facts":[{"as_of":"2025-08-05","basis":"Crusoe describes a selected closed-loop, non-evaporative liquid-cooling system with air-cooled chillers and no water consumed in heat rejection.","lifecycle":"selected_design","posture":"design_selected","ref":"abilene:cooling_heat_rejection_posture","scope":"Selected cooling and heat-rejection design for the original Abilene campus","sources":[{"id":"crusoe_abilene_cooling_2025","publisher":"Crusoe","title":"An inside look at the Abilene AI data center","url":"https://www.crusoe.ai/resources/blog/an-inside-look-at-the-abilene-ai-data-center"}],"value":"closed-loop, non-evaporative; air-cooled chillers (system design)"}],"id":"selected_heat_rejection"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2026-01-16","basis":"The standard defines the numerator, denominator, period, and IT-equipment boundary.","lifecycle":"accounting_standard","posture":"authoritative_guidance","ref":"commercial_compute:pue_energy_boundary","scope":"ISO/IEC 30134-2:2026 PUE; not an Abilene measurement","sources":[{"id":"iso_iec_30134_2_2026","publisher":"International Organization for Standardization and International Electrotechnical Commission","title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"}],"value":"PUE is total data-center energy consumption over a continuous 12-month period divided by IT-equipment energy consumption over the same period; IT equipment includes equipment used to store, process, and transport data. (authoritative energy-accounting definition)"}],"id":"pue_accounting_boundary"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"Algebra from the ISO PUE definition, with the standard's period and boundary preserved.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:facility_energy_to_it_energy_recipe","scope":"Energy-accounting step in a hypothetical scenario; not an Abilene estimate","sources":[{"id":"iso_iec_30134_2_2026","publisher":"International Organization for Standardization and International Electrotechnical Commission","title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"}],"value":"For a matching continuous 12-month boundary, scenario IT energy equals scenario total data-center energy divided by scenario PUE. An average-power route instead requires direct IT-power metering or a boundary-matched interim or partial PUE over the same averaging interval; annual PUE must not be silently treated as a point-in-time operating ratio. (scenario calculation rule)"}],"id":"facility_to_it_scenario_step"},{"assertion":"product_reference","binding":"overlay","facts":[{"as_of":"2026-03-03","basis":"NVIDIA specifies the rack composition and approximate rack consumption.","lifecycle":"product_documented","posture":"confirmed_model_spec","ref":"commercial_compute:dgx_gb_nvl72_product_reference","scope":"NVIDIA DGX GB rack-scale product documentation; not Abilene installed quantity or draw","sources":[{"id":"nvidia_dgx_gb_hardware_2026","publisher":"NVIDIA","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"value":"One NVIDIA DGX GB NVL72 rack contains 72 GPUs across 18 compute trays and has approximate rack power consumption of 120 kW. (manufacturer product configuration)"}],"id":"rack_compute_product_reference"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2022-10-05","basis":"The PaLM authors define MFU and distinguish it from hardware FLOPs utilization.","lifecycle":"published_method","posture":"authoritative_guidance","ref":"commercial_compute:training_mfu_definition","scope":"Training-system analysis in the PaLM paper; not inference utilization or Abilene MFU","sources":[{"id":"palm_2022","publisher":"Google Research authors via arXiv","title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"}],"value":"Model FLOPs utilization is observed training throughput in tokens per second divided by the theoretical maximum token throughput of the same system operating at peak FLOPs, counting the model-required forward and backward operations rather than implementation-dependent rematerialization. (training-efficiency definition)"},{"as_of":"2022-10-05","basis":"The PaLM appendix publishes the FLOPs-per-token and MFU equations.","lifecycle":"published_method","posture":"authoritative_guidance","ref":"commercial_compute:dense_decoder_training_flops_per_token_method","scope":"Dense decoder-only training under the PaLM counting convention; not a general inference formula and not an Abilene estimate","sources":[{"id":"palm_2022","publisher":"Google Research authors via arXiv","title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"}],"value":"For the PaLM paper's dense decoder-only training boundary, theoretical FLOPs per token are 6N plus 12LHQT, where N is parameter count and L, H, Q, and T are layers, attention heads, head dimension, and sequence length. (published training-method boundary)"}],"id":"training_published_method"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"Derived application of the PaLM FLOPs-per-token and MFU equations with explicit hardware, power, and activity boundaries.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:dense_decoder_training_tokens_recipe","scope":"Dense decoder-only training under the PaLM counting convention; not a general inference formula and not an Abilene estimate","sources":[{"id":"palm_2022","publisher":"Google Research authors via arXiv","title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"},{"id":"nvidia_dgx_gb_hardware_2026","publisher":"NVIDIA","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"value":"Scenario training tokens per second equal exact active aggregate peak matmul FLOP/s times MFU measured for the same model and system, divided by the model's FLOPs-per-token term. Supply active hardware quantity and applicable per-device performance explicitly. If the route begins from accelerator power, reconcile the selected inventory's measured power to that same power boundary. Apply a separate fleet active-duty factor only when MFU is conditional on active execution. (derived training scenario rule)"}],"id":"training_scenario_step"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"NVIDIA documents the behavior and recommends measuring latency and throughput while tuning.","lifecycle":"product_documented","posture":"authoritative_guidance","ref":"commercial_compute:inference_batching_dependency","scope":"NVIDIA Triton inference serving; not an Abilene runtime configuration","sources":[{"id":"nvidia_triton_batching_2_59_1","publisher":"NVIDIA","title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"}],"value":"Triton dynamic batching combines requests and typically increases throughput; batch size and queue delay are configured per model and can trade increased latency for throughput. (runtime performance dependency)"},{"as_of":"2026-08-27","basis":"MLCommons defines distinct scenarios, metrics, quality gates, and LLM latency measures.","lifecycle":"benchmark_method","posture":"authoritative_guidance","ref":"commercial_compute:inference_measurement_boundary","scope":"MLPerf Inference methodology; not an Abilene benchmark result","sources":[{"id":"mlcommons_inference_rules","publisher":"MLCommons","title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"value":"A defensible inference-throughput result names the model, dataset or workload, quality target, scenario, system under test, and latency constraints. MLPerf separates Offline measured throughput from Server maximum supported throughput under benchmark-specific latency limits and records time to first token and time per output token for LLMs. (benchmark measurement boundary)"}],"id":"inference_published_boundaries"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"NVIDIA documents batching-dependent latency/throughput and MLCommons requires workload-, system-, quality-, scenario-, and latency-specific measurement.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:inference_tokens_recipe","scope":"Hypothetical inference scenario; not an Abilene estimate","sources":[{"id":"nvidia_triton_batching_2_59_1","publisher":"NVIDIA","title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"},{"id":"mlcommons_inference_rules","publisher":"MLCommons","title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"value":"Use measured tokens per joule for the exact model, weights or quantization, hardware, software, batch and concurrency policy, input/output-length distribution, quality target, and latency boundary, so matching accelerator watts times tokens per joule yields tokens per second. Alternatively, scale exact-system measured tokens per second only by a matching system count and measured scale-efficiency factor, with matching measured power as a consistency check. Facility MW or product peak FLOPs alone do not establish inference tokens per second. (scenario calculation rule)"}],"id":"inference_scenario_step"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"The recipe preserves ISO energy boundaries, NVIDIA product/runtime distinctions, the PaLM training-MFU definition, and MLPerf measurement constraints without substituting product nameplate for observed operation.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:mw_to_tokens_scenario_recipe","scope":"General teaching recipe; produces no Abilene token estimate","sources":[{"id":"iso_iec_30134_2_2026","publisher":"International Organization for Standardization and International Electrotechnical Commission","title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"},{"id":"nvidia_dgx_gb_hardware_2026","publisher":"NVIDIA","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"},{"id":"nvidia_triton_batching_2_59_1","publisher":"NVIDIA","title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"},{"id":"palm_2022","publisher":"Google Research authors via arXiv","title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"},{"id":"mlcommons_inference_rules","publisher":"MLCommons","title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"value":"Choose one output and one common averaging interval. For a power-rate route, start with measured average facility power over that interval; obtain matching average IT power from direct metering or a boundary-matched interim or partial PUE, then obtain accelerator power from direct metering or a measured IT-power share. For training, supply exact active hardware quantity, applicable aggregate peak matmul FLOP/s, and MFU measured for the same model and system; divide aggregate peak FLOP/s times MFU by model FLOPs per token. Apply a separate fleet active-duty factor only when MFU is conditional on active execution, and reconcile the inventory's measured power with accelerator power. For inference, multiply matching accelerator watts by tokens per joule measured for the exact model, weights or quantization, hardware, software, batching, input/output distribution, quality, and latency boundary; or scale exact-system tokens per second with matching system count and measured scale efficiency. For an energy-yield route, start with facility energy over the interval, derive matching IT energy, then use measured accelerator-energy share and matching tokens per joule, or integrate the rate route over the same interval, to produce token count. Annual PUE is valid only for its matching annual boundary. Propagate ranges and stop with no estimate when any required site input is unavailable. (assumption-driven scenario recipe)"}],"id":"complete_scenario_recipe"},{"assertion":"no_evidence_backed_estimate","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"no evidence-backed estimate","lifecycle":"operation_unknown","posture":"no_evidence_backed_estimate","ref":"commercial_compute:abilene_current_facility_power_mw","scope":"Current operating total-facility power for the original Abilene campus","sources":[{"id":"openai_stargate_oracle_2025","publisher":"OpenAI","title":"Stargate advances with 4.5 GW partnership with Oracle","url":"https://openai.com/index/stargate-advances-with-partnership-with-oracle/"},{"id":"oracle_abilene_2026","publisher":"Oracle","title":"Abilene, Texas Data Center","url":"https://www.oracle.com/data-centers/abilene/"}],"value":"No evidence-backed estimate"},{"as_of":"2026-08-27","basis":"no evidence-backed estimate","lifecycle":"operation_unknown","posture":"no_evidence_backed_estimate","ref":"commercial_compute:abilene_current_it_power_mw","scope":"Current operating IT-equipment power for the original Abilene campus","sources":[{"id":"openai_stargate_oracle_2025","publisher":"OpenAI","title":"Stargate advances with 4.5 GW partnership with Oracle","url":"https://openai.com/index/stargate-advances-with-partnership-with-oracle/"},{"id":"oracle_abilene_2026","publisher":"Oracle","title":"Abilene, Texas Data Center","url":"https://www.oracle.com/data-centers/abilene/"}],"value":"No evidence-backed estimate"},{"as_of":"2026-08-27","basis":"no evidence-backed estimate","lifecycle":"operation_unknown","posture":"no_evidence_backed_estimate","ref":"commercial_compute:abilene_current_pue","scope":"Measured current PUE, iPUE, or pPUE for the <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

try {
const data = JSON.parse(document.getElementById("review-data").textContent);
const $ = id => document.getElementById(id);
const shots = data.registry.segments;
const stage = $("stage");
const mount = $("three-mount");
const mapStage = $("map-stage");
const mapSvg = $("map-svg");
const hiddenNodes = new Set(data.hidden.nodes);
const hiddenEdges = new Set(data.hidden.edges);
const hiddenCopy = new Set(data.hidden.copy);

const scene = new THREE.Scene();
scene.background = new THREE.Color(data.scene.palette.paper);
scene.fog = new THREE.Fog(data.scene.palette.paper, data.scene.world.fog.near, data.scene.world.fog.far);
const camera = new THREE.PerspectiveCamera(40, stage.clientWidth / stage.clientHeight, 1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(stage.clientWidth, stage.clientHeight);
labelRenderer.domElement.id = "labels";
mount.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.minDistance = 90;
controls.maxDistance = 3600;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d8cf, 1.45));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(700, 1100, 650);
scene.add(keyLight);

function material(spec, context = false) {
  const opacity = context ? Math.min(spec.opacity ?? 1, 0.2) : (spec.opacity ?? 1);
  const value = new THREE.MeshLambertMaterial({
    color: data.scene.palette[spec.fill],
    flatShading: true,
    opacity,
    transparent: opacity < 1
  });
  value.userData.baseOpacity = opacity;
  return value;
}

function primitiveMesh(spec, context = false) {
  let geometry;
  if (spec.shape === "box") geometry = new THREE.BoxGeometry(...spec.size);
  else if (spec.shape === "cylinder") geometry = new THREE.CylinderGeometry(spec.radius, spec.radius, spec.height, 16);
  else throw new Error(`Unsupported shape: ${spec.shape}`);
  const mesh = new THREE.Mesh(geometry, material(spec, context));
  mesh.position.set(...spec.at);
  if (spec.rotate) mesh.rotation.set(...spec.rotate.map(THREE.MathUtils.degToRad));
  return mesh;
}

function addPrimitives(parent, primitives, offset = [0, 0, 0], context = false) {
  const materials = [];
  for (const spec of primitives) {
    const mesh = primitiveMesh(spec, context);
    mesh.position.add(new THREE.Vector3(...offset));
    parent.add(mesh);
    materials.push(mesh.material);
  }
  return materials;
}

const ground = data.scene.world.ground;
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(...ground.size),
  material({ fill: ground.fill, opacity: 0.2 }, true)
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.set(...ground.at);
scene.add(groundMesh);
for (const structure of data.scene.structures) {
  const group = new THREE.Group();
  scene.add(group);
  if (structure.repeat) {
    for (let index = 0; index < structure.repeat.count; index += 1) {
      addPrimitives(group, structure.primitives, structure.repeat.step.map(value => value * index), true);
    }
  } else {
    addPrimitives(group, structure.primitives, [0, 0, 0], true);
  }
}

const nodeObjects = new Map();
const nodeLabels = new Map();
for (const node of data.scene.nodes) {
  const group = new THREE.Group();
  group.position.set(...node.position);
  group.userData.materials = addPrimitives(group, node.primitives);
  group.userData.baseVisible = node.base_visible;
  scene.add(group);

  const element = document.createElement("div");
  element.className = "node-label";
  element.textContent = node.label;
  const posture = document.createElement("small");
  posture.textContent = `${node.presence.replaceAll("_", " ")} · ${node.lifecycle.replaceAll("_", " ")}`;
  element.appendChild(posture);
  const label = new CSS2DObject(element);
  label.position.set(...node.label_position);
  label.visible = false;
  scene.add(label);
  group.userData.label = label;
  nodeObjects.set(node.id, group);
  nodeLabels.set(node.id, node.label);
}

function segmentedCurve(points) {
  const curve = new THREE.CurvePath();
  for (let index = 1; index < points.length; index += 1) {
    curve.add(new THREE.LineCurve3(new THREE.Vector3(...points[index - 1]), new THREE.Vector3(...points[index])));
  }
  return curve;
}

const edgeObjects = new Map();
for (const edge of data.scene.edges) {
  const curve = segmentedCurve(edge.points);
  const edgeMaterial = new THREE.MeshBasicMaterial({
    color: data.scene.palette[edge.token],
    opacity: 0.025,
    transparent: true
  });
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, Math.max(12, edge.points.length * 10), data.scene.stroke.heavy * 0.72, 8, false),
    edgeMaterial
  );
  scene.add(mesh);
  const marker = new THREE.Mesh(
    new THREE.ConeGeometry(5.2, 14, 10),
    new THREE.MeshBasicMaterial({ color: data.scene.palette[edge.token] })
  );
  const markerPosition = curve.getPoint(0.64);
  const markerDirection = curve.getTangent(0.64).normalize();
  marker.position.copy(markerPosition);
  marker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), markerDirection);
  marker.visible = false;
  scene.add(marker);
  edgeObjects.set(edge.id, { mesh, marker, baseVisible: edge.base_visible, flowDirection: edge.flow_direction });
}

const mapNodes = [...mapSvg.querySelectorAll('[id^="node-"]')];
const mapEdges = [...mapSvg.querySelectorAll('[id^="edge-"]')];
const mapLabels = [...mapSvg.querySelectorAll('[id^="label-"]')];
const mapLegend = mapSvg.querySelector("#status-legend");

function render3d() {
  for (const object of nodeObjects.values()) {
    object.userData.label.element.style.marginTop = "0px";
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);

  const stageRect = stage.getBoundingClientRect();
  const labels = [...nodeObjects.values()]
    .map(object => object.userData.label)
    .filter(label => label.visible)
    .map(label => ({ label, rect: label.element.getBoundingClientRect() }))
    .sort((left, right) => left.rect.x - right.rect.x || left.rect.y - right.rect.y);
  const placed = [];
  const offsets = [0];
  for (let step = 1; step <= labels.length; step += 1) {
    offsets.push(-40 * step, 40 * step);
  }
  for (const item of labels) {
    const offset = offsets.find(candidate => {
      const shifted = {
        left: item.rect.left,
        right: item.rect.right,
        top: item.rect.top + candidate,
        bottom: item.rect.bottom + candidate
      };
      if (shifted.top < stageRect.top + 6 || shifted.bottom > stageRect.bottom - 6) return false;
      return placed.every(other =>
        shifted.right + 5 <= other.left ||
        shifted.left >= other.right + 5 ||
        shifted.bottom + 5 <= other.top ||
        shifted.top >= other.bottom + 5
      );
    }) ?? 0;
    item.label.element.style.marginTop = `${offset}px`;
    placed.push({
      left: item.rect.left,
      right: item.rect.right,
      top: item.rect.top + offset,
      bottom: item.rect.bottom + offset
    });
  }
}

function applyMapFocus(shot) {
  const focusNodes = new Set(shot.focus_nodes);
  const focusEdges = new Set(shot.focus_edges);
  const reveals = new Set(shot.reveal_ids);
  const copyReveals = new Set(shot.reveal_copy_ids);
  for (const element of mapNodes) {
    const id = element.id.slice(5);
    const visible = !hiddenNodes.has(id) || reveals.has(id);
    element.style.display = visible ? "inline" : "none";
    element.style.opacity = focusNodes.has(id) ? "1" : ".08";
  }
  for (const element of mapEdges) {
    const id = element.id.slice(5);
    const visible = !hiddenEdges.has(id) || reveals.has(id);
    element.style.display = visible ? "inline" : "none";
    element.style.opacity = focusEdges.has(id) ? "1" : ".06";
  }
  for (const element of mapLabels) {
    const id = element.id.slice(6);
    const visible = !hiddenCopy.has(id) || copyReveals.has(id);
    element.style.display = visible ? "inline" : "none";
    element.style.opacity = copyReveals.has(id) ? "1" : ".20";
  }
  if (mapLegend) mapLegend.style.opacity = ".20";
}

function apply3dFocus(shot) {
  const focusNodes = new Set(shot.focus_nodes);
  const focusEdges = new Set(shot.focus_edges);
  const reveals = new Set(shot.reveal_ids);
  for (const [id, object] of nodeObjects) {
    const visible = object.userData.baseVisible || reveals.has(id);
    const selected = visible && focusNodes.has(id);
    object.visible = visible;
    for (const item of object.userData.materials) {
      item.opacity = item.userData.baseOpacity * (selected ? 1 : 0.035);
      item.transparent = item.opacity < 1;
    }
    object.userData.label.visible = selected;
  }
  for (const [id, object] of edgeObjects) {
    const visible = object.baseVisible || reveals.has(id);
    const selected = visible && focusEdges.has(id);
    object.mesh.visible = visible;
    object.mesh.material.opacity = selected ? .96 : .025;
    object.marker.visible = selected && object.flowDirection !== "none";
  }
}


function notesSection(title) {
  const section = document.createElement("section");
  section.className = "notes-section";
  const heading = document.createElement("h3");
  heading.textContent = title;
  section.appendChild(heading);
  return section;
}

function paragraph(text, className = "") {
  const value = document.createElement("p");
  value.textContent = text;
  if (className) value.className = className;
  return value;
}

function renderNotes(shot) {
  const restorePanelFocus = notesOpen && $("notes-panel").contains(document.activeElement);
  $("notes-panel").scrollTop = 0;
  $("notes-kicker").textContent = `Act ${shot.act_sequence} · ${shot.act_title}`;
  $("notes-title").textContent = shot.title;
  const body = $("notes-body");
  body.replaceChildren();

  const territory = notesSection("Teaching territory");
  territory.append(
    paragraph(`Question: ${shot.opening_question}`),
    paragraph(`Objective: ${shot.learning_objective}`),
    paragraph(`Available transformations: focused ${shot.render_mode.toUpperCase()} frame, reusable context, and this evidence view. Advance only when useful.`)
  );
  body.appendChild(territory);

  const guards = notesSection("Red-line warnings");
  guards.classList.add("gated", "guard-list");
  const guardList = document.createElement("ul");
  for (const guard of shot.promotion_guard_warnings) {
    const item = document.createElement("li");
    const label = document.createElement("strong");
    label.textContent = guard.id.replaceAll("_", " ");
    item.append(label, document.createTextNode(guard.warning));
    guardList.appendChild(item);
  }
  guards.appendChild(guardList);
  body.appendChild(guards);

  const evidence = notesSection("Validated claims");
  evidence.classList.add(shot.evidence_readiness === "evidence_ready" ? "ready" : "gated");
  evidence.appendChild(paragraph(shot.evidence_readiness.replaceAll("_", " ").toUpperCase()));
  for (const claim of shot.claims) {
    const card = document.createElement("article");
    card.className = "claim-card";
    const heading = document.createElement("h4");
    heading.textContent = `${claim.id.replaceAll("_", " ")} · ${claim.assertion.replaceAll("_", " ")}`;
    card.appendChild(heading);
    for (const fact of claim.facts) {
      card.append(
        paragraph(fact.value, "fact-value"),
        paragraph(`Scope: ${fact.scope}`),
        paragraph(`Boundary: ${fact.posture.replaceAll("_", " ")} · ${fact.lifecycle.replaceAll("_", " ")} · as of ${fact.as_of}`)
      );
      const sources = document.createElement("p");
      sources.className = "source-list";
      sources.append("Source: ");
      fact.sources.forEach((source, index) => {
        if (index) sources.append(" · ");
        const link = document.createElement("a");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = `${source.publisher} — ${source.title}`;
        sources.appendChild(link);
      });
      card.appendChild(sources);
    }
    evidence.appendChild(card);
  }
  body.appendChild(evidence);

  if (shot.blocking_research.length) {
    const blockers = notesSection("Explicit evidence boundary");
    blockers.classList.add("gated");
    const list = document.createElement("ul");
    for (const blocker of shot.blocking_research) {
      const item = document.createElement("li");
      item.textContent = blocker;
      list.appendChild(item);
    }
    blockers.appendChild(list);
    body.appendChild(blockers);
  }

  const handoff = notesSection(shot.transition ? "Handoff" : "Close");
  handoff.appendChild(paragraph(
    shot.transition
      ? shot.transition.cue
      : "Return to the opening question and state which conversions are evidenced, assumed, or still unknown."
  ));
  body.appendChild(handoff);
  if (restorePanelFocus) $("notes-close").focus();
}

function setNotesOpen(open) {
  const panel = $("notes-panel");
  const toggle = $("evidence-toggle");
  notesOpen = open;
  panel.inert = !open;
  panel.dataset.open = String(open);
  panel.setAttribute("aria-hidden", String(!open));
  toggle.setAttribute("aria-expanded", String(open));
  toggle.textContent = open ? "Hide evidence" : "Show evidence";
  if (open) {
    $("notes-close").focus();
  } else if (panel.contains(document.activeElement)) {
    toggle.focus();
  }
}


let current = 0;
let showingAnchor = false;
let notesOpen = false;

function setFrame(shot) {
  if (shot.frame.kind === "2d") {
    const view = showingAnchor ? shot.frame.anchor_viewBox : shot.frame.viewBox;
    mapSvg.setAttribute("viewBox", view.join(" "));
    return;
  }
  const position = showingAnchor ? shot.frame.anchor_position : shot.frame.position;
  const target = showingAnchor ? shot.frame.anchor_target : shot.frame.target;
  camera.position.set(...position);
  camera.up.set(...shot.frame.up);
  controls.target.set(...target);
  controls.update();
  render3d();
}

function activate(index) {
  current = Math.max(0, Math.min(shots.length - 1, index));
  showingAnchor = false;
  const shot = shots[current];
  const is3d = shot.render_mode === "3d";
  mount.style.display = is3d ? "block" : "none";
  mapStage.style.display = is3d ? "none" : "block";
  if (is3d) apply3dFocus(shot);
  else applyMapFocus(shot);
  setFrame(shot);

  $("eyebrow").textContent = `Act ${shot.act_sequence} · ${shot.act_title} · ${String(shot.sequence).padStart(2, "0")} / ${shots.length}`;
  $("title").textContent = shot.title;
  $("opening-question").textContent = shot.opening_question;
  $("objective").textContent = shot.learning_objective;
  $("scope-summary").textContent = `${shot.focus_nodes.length} nodes · ${shot.focus_edges.length} edges · ${shot.evidence_readiness.replaceAll("_", " ")}`;
  $("scope-ids").textContent = shot.focus_node_labels.join(" · ");
  $("scope-ids").title = shot.focus_nodes.join(", ");
  $("shot-id").textContent = shot.segment_id;
  $("mode").textContent = `${shot.mode} · ${shot.render_mode} · ${shot.camera_anchor}`;
  const revealCount = shot.reveal_ids.length + shot.reveal_copy_ids.length;
  $("reveal-summary").textContent = revealCount
    ? `${revealCount} explicit hidden reveals · ${shot.status}`
    : `${shot.status} view · no hidden reveal`;
  $("posture").classList.toggle("ready", shot.evidence_readiness === "evidence_ready");
  $("posture").classList.toggle("gated", shot.evidence_readiness !== "evidence_ready");
  $("context-toggle").textContent = "Show context";
  renderNotes(shot);
  document.querySelectorAll(".shot-button").forEach((button, buttonIndex) => {
    if (buttonIndex === current) {
      button.setAttribute("aria-current", "step");
      button.scrollIntoView({ block: "nearest" });
    } else {
      button.removeAttribute("aria-current");
    }
  });
  $("previous").disabled = current === 0;
  $("next").disabled = current === shots.length - 1;
}

const shotList = $("shot-list");
shots.forEach((shot, index) => {
  const button = document.createElement("button");
  button.className = "shot-button";
  button.type = "button";
  const number = document.createElement("span");
  number.className = "shot-number";
  number.textContent = String(shot.sequence).padStart(2, "0");
  const labels = document.createElement("span");
  const name = document.createElement("span");
  name.className = "shot-name";
  name.textContent = shot.title;
  const segment = document.createElement("span");
  segment.className = "segment-name";
  segment.textContent = `Act ${shot.act_sequence} · ${shot.segment_id}`;
  labels.append(name, segment);
  button.append(number, labels);
  button.addEventListener("click", () => activate(index));
  shotList.appendChild(button);
});

$("previous").addEventListener("click", () => activate(current - 1));
$("next").addEventListener("click", () => activate(current + 1));
$("evidence-toggle").addEventListener("click", () => setNotesOpen(!notesOpen));
$("notes-close").addEventListener("click", () => setNotesOpen(false));
$("context-toggle").addEventListener("click", () => {
  showingAnchor = !showingAnchor;
  $("context-toggle").textContent = showingAnchor ? "Show focus" : "Show context";
  setFrame(shots[current]);
});
addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") activate(current - 1);
  if (event.key === "ArrowRight") activate(current + 1);
  if (event.key.toLowerCase() === "e") setNotesOpen(!notesOpen);
  if (event.key === "Escape") setNotesOpen(false);
});
controls.addEventListener("change", render3d);
addEventListener("resize", () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  labelRenderer.setSize(stage.clientWidth, stage.clientHeight);
  render3d();
});

activate(0);
window.__gigawattReady();
} catch (error) {
  window.__gigawattStartupError(error);
  throw error;
}
</script>
</body>
</html>
