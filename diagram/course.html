    position: relative;

  }
  .focus-swatch::before {

ered in June 2025 and early workloads running; it does not identify an operating rack count.","lifecycle":"deployed","posture":"confirmed","ref":"abilene:rack_platform","scope":"Operationally supported first-phase rack-platform family at the original Abilene campus; family identity only, not rack, tray, or GPU quantity","sources":[{"accessed_as_of":"2026-08-25","date_note":"Reports the first phase live and the first two buildings energized.","id":"crusoe_abilene_live_2025","publication_date":"2025-09-30","publisher":"Crusoe","review_date":null,"title":"Crusoe announces flagship Abilene data center is live","url":"https://www.crusoe.ai/resources/newsroom/crusoe-announces-flagship-abilene-data-center-is-live"}],"topology_targets":[{"id":"die","kind":"node","label":"GPU die","lifecycle":"operational_confirmed","presence":"platform_evidenced"}],"value":"NVIDIA GB200 (platform family)"}],"id":"operating_platform_anchor"},{"assertion":"product_reference","binding":"topology","facts":[{"as_of":"2026-03-03","basis":"NVIDIA specifies that DGX GB200 power shelves convert AC to nominal 50-51 VDC.","lifecycle":"product_documented","posture":"confirmed_model_spec","ref":"abilene:rack_power_shelf_output_vdc","scope":"NVIDIA DGX GB200 rack power-shelf nominal DC busbar output","sources":[{"accessed_as_of":"2026-08-25","date_note":"Documentation last updated 2026-03-03.","id":"nvidia_dgx_gb200_hardware","publication_date":null,"publisher":"NVIDIA","review_date":"2026-03-03","title":"DGX GB200 Hardware Overview","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"topology_targets":[{"id":"power_shelf","kind":"node","label":"Rack power shelves","lifecycle":"conceptual","presence":"platform_evidenced"},{"id":"power_shelf_to_vrm","kind":"edge","label":"Rack power shelves → Voltage regulator module","lifecycle":"conceptual","presence":"platform_evidenced"}],"value":"50-51 (VDC)"}],"id":"rack_power_product_reference"},{"assertion":"selected_design","binding":"topology","facts":[{"as_of":"2025-08-05","basis":"Crusoe describes a selected closed-loop, non-evaporative liquid-cooling system with air-cooled chillers and no water consumed in heat rejection.","lifecycle":"selected_design","posture":"design_selected","ref":"abilene:cooling_heat_rejection_posture","scope":"Selected cooling and heat-rejection design for the original Abilene campus","sources":[{"accessed_as_of":"2026-08-25","date_note":"Describes the project-specific closed-loop, non-evaporative liquid-cooling selection, air-cooled heat rejection, initial fill requirement, and anticipated annual maintenance water.","id":"crusoe_abilene_cooling_2025","publication_date":"2025-08-05","publisher":"Crusoe","review_date":null,"title":"An inside look at the Abilene AI data center","url":"https://www.crusoe.ai/resources/blog/an-inside-look-at-the-abilene-ai-data-center"}],"topology_targets":[{"id":"facility_loop","kind":"node","label":"Closed facility water loop","lifecycle":"conceptual","presence":"site_evidenced"},{"id":"air_cooled_chiller","kind":"node","label":"Air-cooled chiller and condenser","lifecycle":"conceptual","presence":"site_evidenced"},{"id":"facility_to_chiller_return","kind":"edge","label":"Closed facility water loop → Air-cooled chiller and condenser","lifecycle":"conceptual","presence":"site_evidenced"},{"id":"chiller_to_atmosphere","kind":"edge","label":"Air-cooled chiller and condenser → Atmosphere","lifecycle":"conceptual","presence":"site_evidenced"}],"value":"closed-loop, non-evaporative; air-cooled chillers (system design)"}],"id":"selected_heat_rejection"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2026-01-16","basis":"The standard defines the numerator, denominator, period, and IT-equipment boundary.","lifecycle":"accounting_standard","posture":"authoritative_guidance","ref":"commercial_compute:pue_energy_boundary","scope":"ISO/IEC 30134-2:2026 PUE; not an Abilene measurement","sources":[{"accessed_as_of":"2026-08-27","date_note":"Current second edition defining PUE over a continuous 12-month energy boundary and distinguishing designed, interim, and partial derivatives.","id":"iso_iec_30134_2_2026","publication_date":"2026-01-16","publisher":"International Organization for Standardization and International Electrotechnical Commission","review_date":null,"title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"}],"topology_targets":[],"value":"PUE is total data-center energy consumption over a continuous 12-month period divided by IT-equipment energy consumption over the same period; IT equipment includes equipment used to store, process, and transport data. (authoritative energy-accounting definition)"}],"id":"pue_accounting_boundary"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"Algebra from the ISO PUE definition, with the standard's period and boundary preserved.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:facility_energy_to_it_energy_recipe","scope":"Energy-accounting step in a hypothetical scenario; not an Abilene estimate","sources":[{"accessed_as_of":"2026-08-27","date_note":"Current second edition defining PUE over a continuous 12-month energy boundary and distinguishing designed, interim, and partial derivatives.","id":"iso_iec_30134_2_2026","publication_date":"2026-01-16","publisher":"International Organization for Standardization and International Electrotechnical Commission","review_date":null,"title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"}],"topology_targets":[],"value":"For a matching continuous 12-month boundary, scenario IT energy equals scenario total data-center energy divided by scenario PUE. An average-power route instead requires direct IT-power metering or a boundary-matched interim or partial PUE over the same averaging interval; annual PUE must not be silently treated as a point-in-time operating ratio. (scenario calculation rule)"}],"id":"facility_to_it_scenario_step"},{"assertion":"product_reference","binding":"overlay","facts":[{"as_of":"2026-03-03","basis":"NVIDIA specifies the rack composition and approximate rack consumption.","lifecycle":"product_documented","posture":"confirmed_model_spec","ref":"commercial_compute:dgx_gb_nvl72_product_reference","scope":"NVIDIA DGX GB rack-scale product documentation; not Abilene installed quantity or draw","sources":[{"accessed_as_of":"2026-08-27","date_note":"Documentation last updated 2026-03-03.","id":"nvidia_dgx_gb_hardware_2026","publication_date":null,"publisher":"NVIDIA","review_date":"2026-03-03","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"topology_targets":[],"value":"One NVIDIA DGX GB NVL72 rack contains 72 GPUs across 18 compute trays and has approximate rack power consumption of 120 kW. (manufacturer product configuration)"}],"id":"rack_compute_product_reference"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2022-10-05","basis":"The PaLM authors define MFU and distinguish it from hardware FLOPs utilization.","lifecycle":"published_method","posture":"authoritative_guidance","ref":"commercial_compute:training_mfu_definition","scope":"Training-system analysis in the PaLM paper; not inference utilization or Abilene MFU","sources":[{"accessed_as_of":"2026-08-27","date_note":"Version 5 defines model FLOPs utilization and gives the dense decoder-only training FLOPs-per-token calculation used here.","id":"palm_2022","publication_date":"2022-10-05","publisher":"Google Research authors via arXiv","review_date":null,"title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"}],"topology_targets":[],"value":"Model FLOPs utilization is observed training throughput in tokens per second divided by the theoretical maximum token throughput of the same system operating at peak FLOPs, counting the model-required forward and backward operations rather than implementation-dependent rematerialization. (training-efficiency definition)"},{"as_of":"2022-10-05","basis":"The PaLM appendix publishes the FLOPs-per-token and MFU equations.","lifecycle":"published_method","posture":"authoritative_guidance","ref":"commercial_compute:dense_decoder_training_flops_per_token_method","scope":"Dense decoder-only training under the PaLM counting convention; not a general inference formula and not an Abilene estimate","sources":[{"accessed_as_of":"2026-08-27","date_note":"Version 5 defines model FLOPs utilization and gives the dense decoder-only training FLOPs-per-token calculation used here.","id":"palm_2022","publication_date":"2022-10-05","publisher":"Google Research authors via arXiv","review_date":null,"title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"}],"topology_targets":[],"value":"For the PaLM paper's dense decoder-only training boundary, theoretical FLOPs per token are 6N plus 12LHQT, where N is parameter count and L, H, Q, and T are layers, attention heads, head dimension, and sequence length. (published training-method boundary)"}],"id":"training_published_method"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"Derived application of the PaLM FLOPs-per-token and MFU equations with explicit hardware, power, and activity boundaries.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:dense_decoder_training_tokens_recipe","scope":"Dense decoder-only training under the PaLM counting convention; not a general inference formula and not an Abilene estimate","sources":[{"accessed_as_of":"2026-08-27","date_note":"Version 5 defines model FLOPs utilization and gives the dense decoder-only training FLOPs-per-token calculation used here.","id":"palm_2022","publication_date":"2022-10-05","publisher":"Google Research authors via arXiv","review_date":null,"title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"},{"accessed_as_of":"2026-08-27","date_note":"Documentation last updated 2026-03-03.","id":"nvidia_dgx_gb_hardware_2026","publication_date":null,"publisher":"NVIDIA","review_date":"2026-03-03","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"}],"topology_targets":[],"value":"Scenario training tokens per second equal exact active aggregate peak matmul FLOP/s times MFU measured for the same model and system, divided by the model's FLOPs-per-token term. Supply active hardware quantity and applicable per-device performance explicitly. If the route begins from accelerator power, reconcile the selected inventory's measured power to that same power boundary. Apply a separate fleet active-duty factor only when MFU is conditional on active execution. (derived training scenario rule)"}],"id":"training_scenario_step"},{"assertion":"method_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"NVIDIA documents the behavior and recommends measuring latency and throughput while tuning.","lifecycle":"product_documented","posture":"authoritative_guidance","ref":"commercial_compute:inference_batching_dependency","scope":"NVIDIA Triton inference serving; not an Abilene runtime configuration","sources":[{"accessed_as_of":"2026-08-27","date_note":"Versioned official runtime documentation; used to establish that batching configuration changes throughput and latency.","id":"nvidia_triton_batching_2_59_1","publication_date":null,"publisher":"NVIDIA","review_date":null,"title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"}],"topology_targets":[],"value":"Triton dynamic batching combines requests and typically increases throughput; batch size and queue delay are configured per model and can trade increased latency for throughput. (runtime performance dependency)"},{"as_of":"2026-08-27","basis":"MLCommons defines distinct scenarios, metrics, quality gates, and LLM latency measures.","lifecycle":"benchmark_method","posture":"authoritative_guidance","ref":"commercial_compute:inference_measurement_boundary","scope":"MLPerf Inference methodology; not an Abilene benchmark result","sources":[{"accessed_as_of":"2026-08-27","date_note":"Living official rules at the access date; used for measurement-boundary requirements, not as a performance result for any Abilene system.","id":"mlcommons_inference_rules","publication_date":null,"publisher":"MLCommons","review_date":null,"title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"topology_targets":[],"value":"A defensible inference-throughput result names the model, dataset or workload, quality target, scenario, system under test, and latency constraints. MLPerf separates Offline measured throughput from Server maximum supported throughput under benchmark-specific latency limits and records time to first token and time per output token for LLMs. (benchmark measurement boundary)"}],"id":"inference_published_boundaries"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"NVIDIA documents batching-dependent latency/throughput and MLCommons requires workload-, system-, quality-, scenario-, and latency-specific measurement.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:inference_tokens_recipe","scope":"Hypothetical inference scenario; not an Abilene estimate","sources":[{"accessed_as_of":"2026-08-27","date_note":"Versioned official runtime documentation; used to establish that batching configuration changes throughput and latency.","id":"nvidia_triton_batching_2_59_1","publication_date":null,"publisher":"NVIDIA","review_date":null,"title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"},{"accessed_as_of":"2026-08-27","date_note":"Living official rules at the access date; used for measurement-boundary requirements, not as a performance result for any Abilene system.","id":"mlcommons_inference_rules","publication_date":null,"publisher":"MLCommons","review_date":null,"title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"topology_targets":[],"value":"Use measured tokens per joule for the exact model, weights or quantization, hardware, software, batch and concurrency policy, input/output-length distribution, quality target, and latency boundary, so matching accelerator watts times tokens per joule yields tokens per second. Alternatively, scale exact-system measured tokens per second only by a matching system count and measured scale-efficiency factor, with matching measured power as a consistency check. Facility MW or product peak FLOPs alone do not establish inference tokens per second. (scenario calculation rule)"}],"id":"inference_scenario_step"},{"assertion":"derived_scenario_reference","binding":"overlay","facts":[{"as_of":"2026-08-27","basis":"The recipe preserves ISO energy boundaries, NVIDIA product/runtime distinctions, the PaLM training-MFU definition, and MLPerf measurement constraints without substituting product nameplate for observed operation.","lifecycle":"derived_scenario_method","posture":"derived_from_authoritative_sources","ref":"commercial_compute:mw_to_tokens_scenario_recipe","scope":"General teaching recipe; produces no Abilene token estimate","sources":[{"accessed_as_of":"2026-08-27","date_note":"Current second edition defining PUE over a continuous 12-month energy boundary and distinguishing designed, interim, and partial derivatives.","id":"iso_iec_30134_2_2026","publication_date":"2026-01-16","publisher":"International Organization for Standardization and International Electrotechnical Commission","review_date":null,"title":"ISO/IEC 30134-2:2026 Information technology - Data centres key performance indicators - Part 2: Power usage effectiveness (PUE)","url":"https://www.iso.org/obp/ui?_escaped_fragment_=iso%3Astd%3Aiso-iec%3A30134%3A-2%3Aed-2%3Av1%3Aen"},{"accessed_as_of":"2026-08-27","date_note":"Documentation last updated 2026-03-03.","id":"nvidia_dgx_gb_hardware_2026","publication_date":null,"publisher":"NVIDIA","review_date":"2026-03-03","title":"DGX Grace Blackwell Rack Scale Systems User Guide - Hardware","url":"https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"},{"accessed_as_of":"2026-08-27","date_note":"Versioned official runtime documentation; used to establish that batching configuration changes throughput and latency.","id":"nvidia_triton_batching_2_59_1","publication_date":null,"publisher":"NVIDIA","review_date":null,"title":"Triton Inference Server 2.59.1 - Batchers","url":"https://docs.nvidia.com/deeplearning/triton-inference-server/archives/triton-inference-server-2591/user-guide/docs/user_guide/batcher.html"},{"accessed_as_of":"2026-08-27","date_note":"Version 5 defines model FLOPs utilization and gives the dense decoder-only training FLOPs-per-token calculation used here.","id":"palm_2022","publication_date":"2022-10-05","publisher":"Google Research authors via arXiv","review_date":null,"title":"PaLM: Scaling Language Modeling with Pathways","url":"https://arxiv.org/abs/2204.02311"},{"accessed_as_of":"2026-08-27","date_note":"Living official rules at the access date; used for measurement-boundary requirements, not as a performance result for any Abilene system.","id":"mlcommons_inference_rules","publication_date":null,"publisher":"MLCommons","review_date":null,"title":"MLPerf Inference Rules","url":"https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc"}],"topology_targets":[],"value":"Choose one output and one common averaging interval. For a power-rate route, start with measured average facility power over that interval; obtain matching average IT power from direct metering or a boundary-matched interim or partial PUE, then obtain accelerator power from direct metering or a measured IT-power share. For training, supply exact active hardware quantity, applicable aggregate peak matmul FLOP/s, and MFU measured for the same model and system; divide aggregate peak FLOP/s times MFU by model FLOPs per token. Apply a separate fleet active-duty factor only when MFU is conditional on active execution, and reconcile the inventory's measured power with accelerator power. For inference, multiply matching accelerator watts by tokens per joule measured for the exact model, weights or quantization, hardware, software, batching, input/output distribution, quality, and latency boundary; or scale exact-system tokens per second with matching system count and measured scale efficiency. For an energy-yield route, start with facility energy over the interval, derive matching IT energy, then use measured accelerator-energy share and matching tokens per joule, or integrate the rate route over the same interval, to produce token count. Annual PUE is valid only for its matching annual boundary. Propagate ranges and stop with no estimate when any required site input is unavailable. (assumption-driven scenario recipe)"}],"id":"complete_scenario_recipe"},{"assertion":"no_evidence_backed_estimate","binding":"overlay","facts <script type="module">

try {

function setLayerRecursively(object, layer) {

}

function material(spec, context = false) {
  const opacity = context ? Math.min(spec.opacity ?? 1, 0.2) : (spec.opacity ?? 1);
  const value = new THREE.MeshLambertMaterial({
    color: data.scene.palette[spec.fill],
    flatShading: true,
    opacity,
    transparent: opacity < 1
  });
  value.userData.baseOpacity = opacity;
  return value;
}

function primitiveMesh(spec, context = false) {
  let geometry;
  if (spec.shape === "box") geometry = new THREE.BoxGeometry(...spec.size);
  else if (spec.shape === "cylinder") geometry = new THREE.CylinderGeometry(spec.radius, spec.radius, spec.height, 16);
  else throw new Error(`Unsupported shape: ${spec.shape}`);
  const mesh = new THREE.Mesh(geometry, material(spec, context));
  mesh.position.set(...spec.at);
  if (spec.rotate) mesh.rotation.set(...spec.rotate.map(THREE.MathUtils.degToRad));
  mesh.layers.set(CONTEXT_LAYER);
  return mesh;
}

function addPrimitives(parent, primitives, offset = [0, 0, 0], context = false) {
  const materials = [];
  for (const spec of primitives) {
    const mesh = primitiveMesh(spec, context);
    mesh.position.add(new THREE.Vector3(...offset));
    parent.add(mesh);
    materials.push(mesh.material);
  }
  return materials;
}

const ground = data.scene.world.ground;
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(...ground.size),
  material({ fill: ground.fill, opacity: 0.2 }, true)
);

function segmentedCurve(points) {
  const curve = new THREE.CurvePath();
  for (let index = 1; index < points.length; index += 1) {
    curve.add(new THREE.LineCurve3(new THREE.Vector3(...points[index - 1]), new THREE.Vector3(...points[index])));
  }
  return curve;
}

const edgeObjects = new Map();
for (const edge of data.scene.edges) {
  const curve = segmentedCurve(edge.points);
  const edgeMaterial = new THREE.MeshBasicMaterial({
    color: data.scene.palette[edge.token],
    opacity: 0.025,
    transparent: true
  });
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, Math.max(12, edge.points.length * 10), data.scene.stroke.heavy * 0.72, 8, false),
    edgeMaterial
  );
  mesh.layers.set(CONTEXT_LAYER);
  scene.add(mesh);
  const marker = new THREE.Mesh(
    new THREE.ConeGeometry(
      5.2,
      14,
      10
    ),
    new THREE.MeshBasicMaterial({ color: data.scene.palette[edge.token] })
  );
  const markerPosition = curve.getPoint(0.64);
  const markerDirection = curve.getTangent(0.64).normalize();
  marker.position.copy(markerPosition);
  marker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), markerDirection);
  marker.visible = false;
  marker.layers.set(CONTEXT_LAYER);
  scene.add(marker);
  edgeObjects.set(edge.id, { mesh, marker, baseVisible: edge.base_visible, flowDirection: edge.flow_direction });
}

function renderDepthSeparatedFocus() {

          !segmentIntersectsBox(anchor, item, box, 2)
        ) &&
        placed.every(box =>
          !markerBoxesOverlap(item.box, box, 2) &&
          !segmentIntersectsBox(anchor, item, box, 1)
        ) &&
        placedLeaders.every(leader =>
          !segmentIntersectsBox(leader.start, leader.end, item.box, 1) &&
          (
            Math.hypot(item.x - anchor.x, item.y - anchor.y) <= 1 ||
            !segmentsIntersect(anchor, item, leader.start, leader.end)
          )
        )
      );
    if (!candidate) continue;
    placed.push(candidate.box);
    const distance = Math.hypot(candidate.x - anchor.x, candidate.y - anchor.y);
    if (distance > 1) {
      const leader = document.createElement("span");
      leader.className = "focus-leader";
      leader.style.left = `${anchor.x - stageRect.left}px`;
      leader.style.top = `${anchor.y - stageRect.top}px`;
      leader.style.width = `${distance}px`;
      leader.style.transform = `rotate(${Math.atan2(candidate.y - anchor.y, candidate.x - anchor.x)}rad)`;
      layer.appendChild(leader);
      placedLeaders.push({ start: anchor, end: candidate });
    }
    const marker = document.createElement("span");
    marker.className = "focus-marker";
    marker.dataset.labelId = id;
    marker.style.left = `${candidate.x - stageRect.left}px`;
    marker.style.top = `${candidate.y - stageRect.top}px`;
    marker.textContent = markerNumber;
    layer.appendChild(marker);
  }
}

function portraitTeachingMode() {
  return matchMedia("(max-width: 520px)").matches;
}

function syncTeachingVisibility(shot, { focusDrawer = false, restoreFocus = false } = {}) {
  const overlay = $("teaching-overlay");
  const toggle = $("teaching-toggle");
  const hasAnnotation = Boolean(shot.visual?.annotation);
  const portrait = portraitTeachingMode();
  const annotationOpen = hasAnnotation && teachingOpen;
  const portraitDrawerOpen = annotationOpen && portrait;
  toggle.hidden = !hasAnnotation;
  toggle.setAttribute("aria-expanded", String(annotationOpen));
  toggle.textContent = annotationOpen ? "Hide teaching" : "Teaching";
  overlay.hidden = !annotationOpen;
  overlay.inert = overlay.hidden;
  overlay.dataset.mobileOpen = String(portraitDrawerOpen);
  stage.dataset.teachingOpen = String(portraitDrawerOpen);
  if (portraitDrawerOpen) {
    stage.inert = true;
    stage.setAttribute("aria-hidden", "true");
    if (focusDrawer) $("teaching-close").focus();
  } else if (!notesOpen) {
    stage.inert = false;
    stage.removeAttribute("aria-hidden");
  }
  if (restoreFocus && !toggle.hidden) toggle.focus();
}

function setTeachingOpen(open, { restoreFocus = false } = {}) {
  const shot = shots[current];
  teachingOpen = Boolean(open && shot.visual?.annotation);
  syncTeachingVisibility(shot, {
    focusDrawer: teachingOpen && portraitTeachingMode(),
    restoreFocus
  });
  applyTeachingDock(shot);
  resizeVisualSurface(shot);
  resolveTeachingCollisions(shot);
}

function renderTeaching(shot) {
  const overlay = $("teaching-overlay");
  const annotation = shot.visual?.annotation;
  teachingOpen = false;
  if (!annotation) {
    syncTeachingVisibility(shot);
    applyTeachingDock(shot);
    resizeVisualSurface(shot);
    resolveTeachingCollisions(shot);
    return;
  }
  overlay.dataset.position = annotation.position;
  overlay.dataset.kind = annotation.kind;
  overlay.dataset.segmentId = shot.segment_id;
  $("teaching-title").textContent = annotation.title;
  const items = $("teaching-items");
  items.replaceChildren();
  for (const item of annotation.items) {
    const entry = document.createElement("li");
    entry.textContent = item.label;
    entry.dataset.claimIds = item.claim_ids.join(" ");
    items.appendChild(entry);
  }
  syncTeachingVisibility(shot);
  applyTeachingDock(shot);
  resizeVisualSurface(shot);
  resolveTeachingCollisions(shot);
}

function notesDisclosure(title, className = "") {
  const disclosure = document.createElement("details");
  disclosure.className = `notes-section disclosure ${className}`.trim();
  const summary = document.createElement("summary");
  summary.textContent = title;
  disclosure.appendChild(summary);
  return disclosure;
}

function appendClaimCard(section, claim) {
  const card = document.createElement("article");
  card.className = "claim-card";
  const heading = document.createElement("h4");
  heading.textContent = `${claim.id.replaceAll("_", " ")} · ${claim.assertion.replaceAll("_", " ")}`;
  card.appendChild(heading);
  card.appendChild(paragraph(
    claim.binding === "overlay"
      ? "Binding: segment-local, nonphysical teaching overlay"
      : "Binding: selected topology ownership"
  ));
  for (const fact of claim.facts) {
    card.appendChild(paragraph(fact.value, "fact-value"));
    const details = document.createElement("details");
    details.className = "fact-details";
    const summary = document.createElement("summary");
    summary.textContent = "Fact, ownership, boundary, and sources";
    details.append(
      summary,
      paragraph(`Fact: ${fact.ref}`),
      paragraph(`Basis: ${fact.basis}`),
      paragraph(`Scope: ${fact.scope}`),
      paragraph(`Boundary: ${fact.posture.replaceAll("_", " ")} · ${fact.lifecycle.replaceAll("_", " ")} · as of ${fact.as_of}`)
    );
    if (fact.topology_targets.length) {
      details.appendChild(paragraph(`Topology target: ${fact.topology_targets.map(target => `${target.kind} ${target.id} (${target.label}; ${target.presence.replaceAll("_", " ")} · ${target.lifecycle.replaceAll("_", " ")})`).join(" · ")}`));
    }
    const sources = document.createElement("p");
    sources.className = "source-list";
    sources.append("Source: ");
    fact.sources.forEach((source, index) => {
      if (index) sources.append(" · ");
      const link = document.createElement("a");
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.textContent = `${source.publisher} — ${source.title}`;
      sources.appendChild(link);
      sources.append(` (accessed ${source.accessed_as_of}; ${source.date_note})`);
    });
    details.appendChild(sources);
    card.appendChild(details);
  }
  section.appendChild(card);
}

function renderNotes(shot) {
  const restorePanelFocus = notesOpen && $("notes-panel").contains(document.activeElement);
  $("notes-panel").scrollTop = 0;
  $("notes-kicker").textContent = `Act ${shot.act_sequence} · ${shot.act_title}`;
  $("notes-title").textContent = shot.title;
  const body = $("notes-body");
  body.replaceChildren();

  const limitAssertions = new Set(["explicit_unknown", "no_evidence_backed_estimate"]);
  const supportedClaims = shot.claims.filter(claim => !limitAssertions.has(claim.assertion));
  const knownLimits = shot.claims.filter(claim => limitAssertions.has(claim.assertion));
  const knownLimitCount = knownLimits.reduce((count, claim) => count + claim.facts.length, 0);
  const ready = shot.evidence_readiness === "evidence_ready";
  const summary = paragraph(
    `${ready ? "Evidence ready" : "Evidence review needed"} · ${countLabel(supportedClaims.length, "supported claim group")} · ${countLabel(knownLimitCount, "known limit")}`,
    `evidence-summary ${ready ? "ready" : "gated"}`
  );
  body.appendChild(summary);

  if (shot.blocking_research.length) {
    const blockers = notesSection(`Open research (${shot.blocking_research.length})`);
    blockers.classList.add("gated");
    const list = document.createElement("ul");
    for (const blocker of shot.blocking_research) {
      const item = document.createElement("li");
      item.textContent = blocker;
      list.appendChild(item);
    }
    blockers.appendChild(list);
    body.appendChild(blockers);
  }

  const evidence = notesSection("What the evidence supports");
  for (const claim of supportedClaims) appendClaimCard(evidence, claim);
  body.appendChild(evidence);

  if (knownLimits.length) {
    const limits = notesDisclosure(`Known limits (${knownLimitCount})`, "known-limits");
    for (const claim of knownLimits) appendClaimCard(limits, claim);
    body.appendChild(limits);
  }

  const guards = notesDisclosure(`Avoid overclaiming (${shot.promotion_guard_warnings.length})`, "guard-list");
  const guardList = document.createElement("ul");
  for (const guard of shot.promotion_guard_warnings) {
    const item = document.createElement("li");
    const label = document.createElement("strong");
    label.textContent = guard.id.replaceAll("_", " ");
    item.append(label, document.createTextNode(guard.warning));
    guardList.appendChild(item);
  }
  guards.appendChild(guardList);
  body.appendChild(guards);

  if (restorePanelFocus) $("notes-close").focus();
}

function setNotesOpen(open) {
  const panel = $("notes-panel");
  const toggle = $("evidence-toggle");
  const wasOpen = notesOpen;
  if (open && teachingOpen) setTeachingOpen(false);
  notesOpen = open;
  for (const id of ["shot-rail", "masthead", "stage", "transport", "teaching-overlay"]) {
    const element = $(id);
    element.inert = open;
    if (open) element.setAttribute("aria-hidden", "true");
    else element.removeAttribute("aria-hidden");
  }
  panel.inert = !open;
  panel.dataset.open = String(open);
  panel.setAttribute("aria-hidden", String(!open));
  toggle.setAttribute("aria-expanded", String(open));
  toggle.textContent = open ? "Hide evidence" : "Show evidence";
  if (open) {
    $("notes-close").focus();
  } else {
    syncTeachingVisibility(shots[current]);
    if (wasOpen) toggle.focus();
  }
}

function trapNotesFocus(event) {
  const panel = $("notes-panel");
  const focusable = [...panel.querySelectorAll('button, a[href], summary, [tabindex]:not([tabindex="-1"])')]
    .filter(element => !element.hidden && element.getAttribute("aria-hidden") !== "true");
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  } else if (!panel.contains(document.activeElement)) {
    event.preventDefault();
    first.focus();
  }
}


let current = 0;
let notesOpen = false;
let teachingOpen = false;

function responsive3dPosition(frame) {
  const authored = new THREE.Vector3(...frame.position);
  const target = new THREE.Vector3(...frame.target);
  const direction = authored.clone().sub(target).normalize();
  const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
  const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
  const requiredDistance = frame.focus_radius / Math.sin(limitingHalfFov) * frame.frame_margin;
  const distance = Math.max(authored.distanceTo(target), requiredDistance);
  return target.add(direction.multiplyScalar(distance)).toArray();
}

function setFrame(shot) {
  if (shot.frame.kind === "2d") {
    mapSvg.setAttribute("viewBox", shot.frame.viewBox.join(" "));
    return;
  }
  camera.position.set(...responsive3dPosition(shot.frame));
  camera.up.set(...shot.frame.up).normalize();
  controls.target.set(...shot.frame.target);
  controls.update();
  render3d();
}

function updateAccessibleState(shot) {
  const readableNodes = shot.render_mode === "3d"
    ? shot.focus_nodes.map(id => `${nodeLabels.get(id) || id}; ${nodePostures.get(id) || "posture unknown"}`)
    : (shot.focus_node_labels || shot.focus_nodes.map(id => nodeLabels.get(id) || id));
  const readableEdges = shot.focus_edge_labels || shot.focus_edges;
  const focusParts = [];
  if (readableNodes.length) focusParts.push(`Focused nodes: ${readableNodes.join(", ")}`);
  if (readableEdges.length) focusParts.push(`Focused paths: ${readableEdges.join(", ")}`);
  const detail = focusParts.join(". ");
  stage.setAttribute("aria-label", `${shot.title}. ${detail || "No focused topology."}`);
  $("state-status").textContent = `Section ${shot.sequence} of ${shots.length}: ${shot.title}. ${shot.focus_nodes.length} focused nodes and ${shot.focus_edges.length} focused paths.`;
}

function activate(index) {
  current = Math.max(0, Math.min(shots.length - 1, index));
  const shot = shots[current];
  const is3d = shot.render_mode === "3d";
  mount.style.display = is3d ? "block" : "none";
  mapStage.style.display = is3d ? "none" : "block";
  if (is3d) apply3dFocus(shot);
  else applyMapFocus(shot);
  setFrame(shot);
  updateMapLabelLegibility(shot);
  renderFocusKey(shot);
  updateAccessibleState(shot);

  $("eyebrow").textContent = `Act ${shot.act_sequence} · ${shot.act_title} · ${String(shot.sequence).padStart(2, "0")} / ${shots.length}`;
  $("title").textContent = shot.title;
  $("opening-question").textContent = shot.opening_question;
  $("objective").textContent = shot.learning_objective;
  $("boundary-full").textContent = shot.boundary_note;
  $("boundary-note").title = shot.boundary_note;
  $("scope-summary").textContent = `${shot.focus_nodes.length} nodes · ${shot.focus_edges.length} edges · ${shot.evidence_readiness.replaceAll("_", " ")}`;
  $("scope-ids").textContent = shot.focus_node_labels.join(" · ");
  $("scope-ids").title = shot.focus_nodes.join(", ");
  $("shot-id").textContent = shot.segment_id;
  $("mode").textContent = `${shot.mode} · ${shot.render_mode} · ${shot.camera_anchor}`;
  const revealCount = shot.reveal_ids.length + shot.reveal_copy_ids.length;
  $("reveal-summary").textContent = revealCount
    ? `${revealCount} explicit hidden reveals · ${shot.status}`
    : `${shot.status} view · no hidden reveal`;
  $("posture").classList.toggle("ready", shot.evidence_readiness === "evidence_ready");
  $("posture").classList.toggle("gated", shot.evidence_readiness !== "evidence_ready");
  renderTeaching(shot);
  renderNotes(shot);
  document.querySelectorAll(".shot-button").forEach((button, buttonIndex) => {
    if (buttonIndex === current) {
      button.setAttribute("aria-current", "step");
      button.scrollIntoView({ block: "nearest" });
    } else {
      button.removeAttribute("aria-current");
    }
  });
  $("previous").disabled = current === 0;
  $("next").disabled = current === shots.length - 1;
}

const shotList = $("shot-list");
shots.forEach((shot, index) => {
  const button = document.createElement("button");
  button.className = "shot-button";
  button.type = "button";
  button.setAttribute("aria-label", `${String(shot.sequence).padStart(2, "0")}. ${shot.title}`);
  const number = document.createElement("span");
  number.className = "shot-number";
  number.textContent = String(shot.sequence).padStart(2, "0");
  const labels = document.createElement("span");
  const name = document.createElement("span");
  name.className = "shot-name";
  name.textContent = shot.title;
  const segment = document.createElement("span");
  segment.className = "segment-name";
  segment.textContent = `Act ${shot.act_sequence} · ${shot.segment_id}`;
  labels.append(name, segment);
  button.append(number, labels);
  button.addEventListener("click", () => activate(index));
  shotList.appendChild(button);
});

$("previous").addEventListener("click", () => activate(current - 1));
$("next").addEventListener("click", () => activate(current + 1));
$("teaching-toggle").addEventListener("click", () => setTeachingOpen(!teachingOpen));
$("teaching-close").addEventListener("click", () => setTeachingOpen(false, { restoreFocus: true }));
$("evidence-toggle").addEventListener("click", () => setNotesOpen(!notesOpen));
$("notes-close").addEventListener("click", () => setNotesOpen(false));
addEventListener("keydown", event => {
  if (notesOpen) {
    if (event.key === "Escape") {
      event.preventDefault();
      setNotesOpen(false);
    } else if (event.key === "Tab") {
      trapNotesFocus(event);
    }
    return;
  }
  if (teachingOpen && event.key === "Escape") {
    event.preventDefault();
    setTeachingOpen(false, { restoreFocus: true });
    return;
  }
  if (event.target.closest?.("#focus-key, button, a")) return;
  if (event.key === "ArrowLeft") activate(current - 1);
  if (event.key === "ArrowRight") activate(current + 1);
  if (event.key.toLowerCase() === "e") setNotesOpen(true);
});
controls.addEventListener("change", render3d);
addEventListener("resize", () => {
  syncTeachingVisibility(shots[current]);
  applyTeachingDock(shots[current]);
  camera.aspect = mount.clientWidth / mount.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  labelRenderer.setSize(mount.clientWidth, mount.clientHeight);
  setFrame(shots[current]);
  updateMapLabelLegibility(shots[current]);
  resolveTeachingCollisions(shots[current]);
});

activate(0);
window.__gigawattReady();
} catch (error) {
  window.__gigawattStartupError(error);
  throw error;
}
</script>
