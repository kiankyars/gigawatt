<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GIGAWATT — 3D mock v0 (style test)</title>
<style>
  body { margin: 0; background: #fafaf7; overflow: hidden;
         font-family: Inter, "Helvetica Neue", sans-serif; }
  #hud { position: fixed; top: 18px; left: 22px; color: #1a1a1a; z-index: 2; }
  #hud h1 { font-size: 19px; margin: 0; }
  #hud p { font-size: 11px; color: #8a8a82; margin: 4px 0 0; }
  .tag { color: #1a1a1a; font-size: 12px; font-weight: 600;
         background: rgba(250,250,247,.85); padding: 2px 7px;
         border: 1px solid #1a1a1a; border-radius: 2px; white-space: nowrap; }
  .tag small { display: block; font-weight: 400; color: #8a8a82; }
</style>
</head>
<body>
<div id="hud">
  <h1>GIGAWATT — 3D mock v0</h1>
  <p>style test, not layout-final · drag to orbit, scroll to zoom ·
     pulses trace the watt (blue→green) and the heat (red→orange)</p>
</div>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
    "three/addons/renderers/CSS2DRenderer.js": "./vendor/three/CSS2DRenderer.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const V = { kv345: 0x0b2e59, kv34: 0x175d8d, kv20: 0x2b7fa3,
            v480: 0x2f9e8f, v54: 0x57b894, v08: 0x8fd0a5 };
const T = { die: 0xb3261e, hot: 0xd3552c, warm: 0xe8853b, air: 0xf0b34e };
const INK = 0x1a1a1a, PAPER = 0xfafaf7, STEEL = 0x9a9a92, DARK = 0x3a3a36;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 1800, 3200);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 6000);
camera.position.set(420, 520, 980);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
labels.domElement.style.cssText = "position:fixed;top:0;pointer-events:none";
document.body.appendChild(labels.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 60, 0);
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d8cf, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(500, 900, 400);
scene.add(sun);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
function box(w, h, d, c, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m;
}
function cyl(r, h, c, x, y, z, rz = 0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat(c));
  m.position.set(x, y, z); m.rotation.z = rz; scene.add(m); return m;
}
function tag(x, y, z, main, sub) {
  const div = document.createElement("div");
  div.className = "tag";
  div.innerHTML = main + (sub ? `<small>${sub}</small>` : "");
  const o = new CSS2DObject(div); o.position.set(x, y, z); scene.add(o);
}
function tube(points, color, radius = 2.4) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, "catmullrom", 0.02);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 128, radius, 10),
                           new THREE.MeshBasicMaterial({ color }));
  scene.add(m); return curve;
}

// ground
const g = new THREE.Mesh(new THREE.PlaneGeometry(4200, 2400), mat(0xeceada));
g.rotation.x = -Math.PI / 2; scene.add(g);

// --- generation yard: turbine hall + 10 turbine exhausts ---
box(220, 55, 180, STEEL, -950, 27.5, 0);
for (let i = 0; i < 10; i++)
  cyl(9, 42, DARK, -1040 + i * 20, 76, i % 2 ? 55 : -55);
box(46, 40, 46, 0x6b6b62, -800, 20, 0);   // GSU
for (let i = -1; i <= 1; i++) cyl(2.5, 22, 0xc9c9bd, -800 + i * 12, 50, 0);
tag(-950, 105, 0, "gas turbines ×10", "360.5 MW · behind the meter");

// --- 345 kV corridor: two towers + catenary ---
function towerAt(x) {
  box(8, 240, 8, STEEL, x, 120, 0);
  box(120, 6, 6, STEEL, x, 225, 0);
  box(90, 6, 6, STEEL, x, 195, 0);
}
towerAt(-600); towerAt(-380);
tube([[-800, 45, 0], [-800, 230, 0], [-690, 205, 0], [-600, 228, 0],
      [-490, 200, 0], [-380, 228, 0], [-270, 195, 0], [-180, 170, 0]],
     V.kv345, 2.8);
tag(-490, 265, 0, "345 kV corridor", "AEP Abilene Northwest line");

// --- campus substation ---
for (const [w, d, x, z] of [[200, 4, -80, 90], [200, 4, -80, -90],
                            [4, 180, 20, 0], [4, 180, -180, 0]])
  box(w, 26, d, 0xc9c9bd, x, 13, z);
box(60, 50, 50, 0x6b6b62, -80, 25, 0);       // LPT
for (let i = -1; i <= 1; i++) cyl(3, 26, 0xc9c9bd, -80 + i * 16, 62, 0);
box(20, 34, 20, STEEL, -140, 17, -40);        // breaker bay
tag(-80, 100, 0, "campus substation", "1 GW · 345 → 34.5 kV · LPT");

// --- MV run + BESS ---
tube([[-180, 170, 0], [-80, 60, 0], [-80, 12, 0], [150, 12, 0]], V.kv34, 2.4);
for (let i = 0; i < 3; i++) box(50, 26, 22, 0xf0efe6, 20 + i * 60, 13, 150);
tag(80, 55, 150, "BESS", "absorbs GPU load transients");

// --- data hall building (front face open) ---
const BX = 480, BW = 620, BD = 300, BH = 130;
box(BW, 8, BD, 0xdedcd0, BX, 4, 0);                    // slab
box(BW, BH, 8, 0xd4d2c6, BX, BH / 2 + 8, -BD / 2);     // back wall
box(8, BH, BD, 0xd4d2c6, BX - BW / 2, BH / 2 + 8, 0);  // left wall
box(8, BH, BD, 0xd4d2c6, BX + BW / 2, BH / 2 + 8, 0);  // right wall
box(BW, 10, BD, 0xe6e4d8, BX, BH + 13, 0);             // roof slab
tag(BX, BH + 95, -40, "data hall ×8", "up to ~50,000 GPUs per building");

// electrical room (left bay)
box(34, 40, 30, 0x6b6b62, BX - 250, 28, -60);           // unit sub
tag(BX - 250, 75, -60, "unit sub", "34.5 kV → 480 V");
for (let i = 0; i < 3; i++) box(22, 52, 26, 0xf0efe6, BX - 180 + i * 30, 34, -80);
tag(BX - 150, 92, -80, "UPS lineups", "Eaton · Vertiv · Schneider");

// racks: two rows, one lit
let lit = null;
for (let r = 0; r < 2; r++)
  for (let i = 0; i < 8; i++) {
    const m = box(26, 74, 34, DARK, BX - 60 + i * 42, 45, r ? 40 : -30);
    if (r === 1 && i === 2) { m.material = mat(0x2a4a44); lit = m.position.clone(); }
  }
tag(lit.x, 120, lit.z, "the rack", "PSU 54 V → VRM 0.8 V → die");

// roof: air-cooled chillers
for (let i = 0; i < 4; i++) {
  box(60, 16, 44, 0xf0efe6, BX - 180 + i * 120, BH + 26, 20);
  cyl(16, 6, STEEL, BX - 180 + i * 120, BH + 37, 20);
}
tag(BX + 180, BH + 65, 20, "air-cooled chillers", "zero-evaporation closed loop");

// --- electrical path pulse (grid side onward) + in-building drop ---
tube([[150, 12, 0], [BX - 250, 12, -60], [BX - 250, 46, -60]], V.kv34, 2.0);
tube([[BX - 250, 46, -60], [BX - 180, 60, -80], [BX - 120, 60, -80],
      [BX - 120, 100, -40], [lit.x, 100, lit.z], [lit.x, 70, lit.z]], V.v480, 2.0);
const heatCurve = tube([[lit.x, 70, lit.z], [lit.x, 110, lit.z],
                        [lit.x, BH + 20, lit.z], [BX + 60, BH + 26, 20]], T.hot, 2.0);
tube([[BX + 60, BH + 34, 20], [BX + 60, BH + 130, 20]], T.air, 1.4);

// full watt path for the animated pulse
const wattCurve = new THREE.CatmullRomCurve3([
  [-950, 40, 0], [-800, 45, 0], [-800, 230, 0], [-600, 228, 0], [-380, 228, 0],
  [-180, 170, 0], [-80, 60, 0], [-80, 12, 0], [150, 12, 0],
  [BX - 250, 12, -60], [BX - 250, 46, -60], [BX - 120, 60, -80],
  [BX - 120, 100, -40], [lit.x, 100, lit.z], [lit.x, 70, lit.z]
].map(p => new THREE.Vector3(...p)), false, "catmullrom", 0.02);

const pulse = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 16),
                             new THREE.MeshBasicMaterial({ color: V.kv345 }));
const heatPulse = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16),
                                 new THREE.MeshBasicMaterial({ color: T.die }));
scene.add(pulse, heatPulse);

const stops = [[0.12, V.kv20], [0.55, V.kv345], [0.72, V.kv34], [0.9, V.v480], [1, V.v08]];
function colorAt(t) { for (const [s, c] of stops) if (t <= s) return c; return V.v08; }

let t0 = performance.now();
function tick() {
  const t = ((performance.now() - t0) / 9000) % 1;
  pulse.position.copy(wattCurve.getPointAt(t));
  pulse.material.color.setHex(colorAt(t));
  const h = ((performance.now() - t0) / 9000 + 0.5) % 1;
  heatPulse.position.copy(heatCurve.getPointAt(h));
  heatPulse.material.color.setHex(h < 0.5 ? T.die : T.warm);
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
