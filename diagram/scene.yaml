# GIGAWATT hybrid scene placement (v1)
#
# Semantic topology, labels, facts, and edge carries remain in master.yaml.
# This file owns only spatial placement and presentation geometry. Every scene
# node and route is keyed to the corresponding master node or edge ID.

meta:
  version: 1
  master: master.yaml
  units: scene-units
  coverage: exact

world:
  camera_up: [0, 1, 0]
  ground:
    size: [2600, 1500]
    at: [0, -2, 0]
    fill: paper
  fog: {near: 1900, far: 3600}

