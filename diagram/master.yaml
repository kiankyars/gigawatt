# GIGAWATT semantic master — redline-verified v1
#
# Topology and factual copy live here. Evidence records live in
# evidence/abilene.yaml. Placement lives in diagram/layout.yaml and may contain
# coordinates, symbol choices, and visual hierarchy only.

meta:
  version: 1
  status: redline-verified conceptual release; not as-built or for design/construction
  reference_as_of: 2026-08-25
  evidence_file: evidence/abilene.yaml
  diagram_posture: >-
    IEEE/IEC-inspired conceptual one-line plus simplified thermal process
    schematic; Abilene evidence overlay; not an as-built drawing and not for
    design or construction.
  journey:
    electrical:
      grid_138: [138kV, campus_mv, facility_lv_ac, rack_dc, core_voltage]
      grid_345: [345kV, campus_mv, facility_lv_ac, rack_dc, core_voltage]
      behind_the_meter: [generator_terminal_mv, campus_mv, facility_lv_ac, rack_dc, core_voltage]
    thermal: [die_heat, technology_return, facility_return, atmosphere]
  journey_bar:
    electrical: [source_branches, campus_mv, facility_lv_ac, rack_dc, core_voltage]
    thermal: [die_heat, technology_return, facility_return, atmosphere]
  gigawatts_to_tokens_funnel: [announced, interconnected, energized, commissioned, utilized, tokens]

reference_campus:
  name: Lancium Clean Campus / Crusoe-Oracle Abilene (Stargate)
  location: Abilene, Texas (617 FM 2404)
  atlas_stable_key: curated:lancium-clean-campus-abilene-ai-data-center
  atlas_source: ../datacenter_atlas/sources/curated-official-2026-07-20-lancium-crusoe-oracle-abilene.json
  scope_boundary: >-
    Original eight-building Stargate campus only. The adjacent two-building,
    900 MW Microsoft campus announced in 2026 is excluded.

status_styles:
  energized: {line: solid, meaning: confirmed energized or operating minimum}
  permitted: {line: dotted, meaning: authorized nameplate; installation and commissioning not implied}
  future_design: {line: dashed, meaning: shown in a reference design as future}
  conceptual: {line: dashed, meaning: teaching topology; exact Abilene configuration not established}
  course_variant: {line: hidden, meaning: optional comparison, not an Abilene fact}

# Copy entries are the only strings rendered by layout.py. Factual entries use
# templates whose placeholders resolve to stable facts in evidence/abilene.yaml.
# `explicit_unknown` allows a null to render only as a disclosed unknown.
copy:
  title:
    text: "GIGAWATT — master diagram v1 · Abilene evidence overlay"
  subtitle:
    text: "conceptual one-line + thermal process schematic · status dated 2026-08-25 · not for design/construction"
  zone_btm: {text: "BEHIND-THE-METER · PERMITTED"}
  zone_grid: {text: "TWO GRID-SERVICE PATHS"}
  zone_substations: {text: "SUBSTATIONS"}
  zone_mv: {text: "CAMPUS MV ENVELOPE · CONCEPTUAL"}
  zone_building: {text: "REFERENCE BUILDING PATH · CONCEPTUAL"}
  region_substations:
    template: "{grid_initial_substation_capacity_mw} MW / {grid_initial_substation_voltage_kv} kV initial + {grid_expansion_substation_capacity_mw} MW / {grid_expansion_substation_voltage_kv} kV expansion · energized"
    facts: [grid_initial_substation_capacity_mw, grid_initial_substation_voltage_kv, grid_expansion_substation_capacity_mw, grid_expansion_substation_voltage_kv]
  region_buildings:
    template: "{campus_planned_buildings} planned buildings · at least {buildings_energized_confirmed_min} energized (confirmed minimum)"
    facts: [campus_planned_buildings, buildings_energized_confirmed_min]
  region_rack:
    template: "rack · {rack_platform}"
    facts: [rack_platform]
  room_electrical: {text: "ELECTRICAL ROOM"}
  room_data_hall: {text: "DATA HALL"}
  room_mechanical: {text: "MECHANICAL"}
  legend_title: {text: "STATUS / EVIDENCE"}
  legend_energized: {text: "solid · energized / confirmed minimum"}
  legend_permitted: {text: "dotted · permitted; installation unknown"}
  legend_future: {text: "dashed · future design"}
  legend_conceptual: {text: "pale dashed · conceptual, not site-as-built"}
  gas_units:
    template: "gas turbines ×{gas_turbine_units_authorized}"
    facts: [gas_turbine_units_authorized]
  gas_permit:
    template: "{gas_permitted_nameplate_mw} MW permitted nameplate"
    facts: [gas_permitted_nameplate_mw]
  gas_input: {text: "natural gas"}
  generator: {text: "generator"}
  generator_terminal:
    template: "Titan 350 terminal · {generator_terminal_model_voltage_range_kv} kV model range; exact Longhorn settings unknown"
    facts: [generator_terminal_model_voltage_range_kv, generator_terminal_site_voltage_kv]
    posture: explicit_unknown
  source_138:
    template: "{grid_initial_source_line}"
    facts: [grid_initial_source_line]
  tie_138:
    template: "{grid_initial_substation_voltage_kv} kV · {grid_initial_slack_span_length_ft} ft slack-span tie"
    facts: [grid_initial_substation_voltage_kv, grid_initial_slack_span_length_ft]
  station_138:
    template: "initial station · {grid_initial_substation_capacity_mw} MW / {grid_initial_substation_voltage_kv} kV"
    facts: [grid_initial_substation_capacity_mw, grid_initial_substation_voltage_kv]
  source_345: {text: "345 kV source · upstream line not named by EPC"}
  corridor_345: {text: "345 kV expansion service"}
  hv_protection: {text: "abstract 345 kV protection envelope · exact package / state unverified"}
  station_345:
    template: "expansion station · {grid_expansion_substation_capacity_mw} MW / {grid_expansion_substation_voltage_kv} kV"
    facts: [grid_expansion_substation_capacity_mw, grid_expansion_substation_voltage_kv]
  station_345_energized:
    template: "five MPTs energized by {grid_expansion_fully_energized_by}"
    facts: [grid_expansion_fully_energized_by]
  nuclear_variant:
    text: "nuclear PPA · contractual course variant, not a local source"
    base_visible: false
  mv_bus: {text: "abstract campus MV distribution envelope"}
  mv_unknown:
    template: "campus-wide as-built MV: {campus_lpt_secondary_as_built_voltage_kv}"
    facts: [campus_lpt_secondary_as_built_voltage_kv]
    posture: explicit_unknown
  mv_reference_design:
    template: "{campus_mv_reference_design_voltage_kv} kV · Buildings 1–2 review design only"
    facts: [campus_mv_reference_design_voltage_kv]
  bess:
    text: "BESS package · future in reference design"
  diesel: {text: "diesel backup package"}
  diesel_authorization:
    template: "{diesel_units_authorized} units · {diesel_permitted_nameplate_mw} MW authorized"
    facts: [diesel_units_authorized, diesel_permitted_nameplate_mw, diesel_units_installed]
    posture: explicit_unknown
  diesel_unknown: {text: "installation / operation not established"}
  unit_sub: {text: "unit sub · campus MV → facility AC"}
  lv_switchgear: {text: "LV switchgear"}
  ups: {text: "UPS lineups · quantity and topology unverified"}
  busway: {text: "busway · site AC"}
  power_shelf:
    template: "power shelf · site AC → nominal {rack_power_shelf_output_vdc} VDC"
    facts: [rack_power_shelf_output_vdc, rack_power_shelf_ac_input_voltage_v]
    posture: explicit_unknown
  power_shelf_unknown: {text: "Abilene rack AC input not established"}
  vrm: {text: "VRM · rack DC → core voltage"}
  die_turn: {text: "die — electrical power becomes heat"}
  cold_plate: {text: "cold plate · technology loop"}
  rack_air_load: {text: "air-cooled rack auxiliaries"}
  manifold: {text: "dual rack headers · supply / return"}
  cdu: {text: "CDU · loop interface"}
  crah: {text: "CRAH · parallel residual-air branch"}
  facility_loop: {text: "closed facility loop · supply + warm return"}
  air_cooled_chiller:
    template: "{cooling_heat_rejection_posture}"
