  cooling_water: {text: "closed-loop fill / treatment"}
  cooling_water_amount:
    template: "~{cooling_initial_fill_gallons_per_building} gal initial · ~{cooling_annual_maintenance_gallons_per_building} gal/yr per building"
    facts: [cooling_initial_fill_gallons_per_building, cooling_annual_maintenance_gallons_per_building]
  atmosphere: {text: "heat rejected to atmosphere · end of path"}
  footnote:
    text: "Abilene facts are source-gated; dashed downstream equipment is a teaching reference, not an asserted as-built configuration."

nodes:
  # Behind-the-meter branch: authorization is established; commissioning is not.
  - id: gas_turbine
    label: Gas turbine package
    domain: generation
    gate: fuel to shaft power
    presence: site_evidenced
    lifecycle: permitted
    as_of: 2025-01-22
    source_ids: [tceq_177263_gas_review]
    fact_ids: [gas_turbine_units_authorized, gas_permitted_nameplate_mw]
  - id: generator
    label: Generator
    domain: generation
    gate: shaft power to generator-terminal MV
    presence: site_evidenced
    lifecycle: permitted
    as_of: 2025-01-22
    source_ids: [tceq_177263_gas_review, solar_titan_350_datasheet]
    fact_ids: [gas_turbine_units_authorized, generator_terminal_model_voltage_range_kv, generator_terminal_site_voltage_kv]
  - id: gsu_transformer
    label: Generator step-up package
    domain: electrical
    gate: generator-terminal MV to a conceptual campus distribution envelope
    presence: site_evidenced
    lifecycle: permitted
    as_of: 2025-01-22
    source_ids: [tceq_177263_gas_review, tceq_37589_reference_drawing]
    fact_ids: [gas_turbine_units_authorized, campus_mv_reference_design_voltage_kv]

  # Separate grid-service paths. Neither is labeled as the other's upstream line.
  - id: utility_source_138
    label: AEP Abilene Northwest source
    domain: electrical
    gate: initial grid watt reaches the site tie
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-08-25
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_initial_source_line, grid_initial_service_operational_as_of]
  - id: initial_tie_138
    label: 138 kV slack-span tie
    domain: electrical
    gate: connects the initial station to the named AEP line
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-08-25
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_initial_substation_voltage_kv, grid_initial_slack_span_length_ft, grid_initial_service_operational_as_of]
  - id: initial_substation_138
    label: Initial 200 MW / 138 kV station
    domain: electrical
    gate: initial grid-service substation
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-08-25
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_initial_substation_voltage_kv, grid_initial_substation_capacity_mw, grid_initial_service_operational_as_of]
  - id: utility_source_345
    label: Unnamed 345 kV source
    domain: electrical
    gate: expansion grid watt reaches the transmission corridor
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-03-10
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_expansion_substation_voltage_kv, grid_expansion_fully_energized_by]
  - id: transmission_corridor_345
    label: 345 kV expansion service
    domain: electrical
    gate: moves the expansion grid watt to the site substation
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-03-10
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_expansion_substation_voltage_kv, grid_expansion_fully_energized_by]
  - id: hv_protection_envelope_345
    label: Abstract 345 kV protection envelope
    domain: electrical
    gate: abstract boundary for undisclosed switching and protection details
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-03-10
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_expansion_substation_voltage_kv, grid_expansion_fully_energized_by]
  - id: campus_substation_lpt_345
    label: 1 GW / 345 kV expansion substation
    domain: electrical
    gate: expansion grid-service substation; exact campus-MV merge is unverified
    presence: site_evidenced
    lifecycle: energized
    as_of: 2026-03-10
    source_ids: [mortenson_abilene_power_delivery]
    fact_ids: [grid_expansion_substation_voltage_kv, grid_expansion_substation_capacity_mw, grid_expansion_transformers_energized_count, grid_expansion_fully_energized_by]
  - id: nuclear_ppa
    label: Nuclear PPA overlay
    domain: commercial_overlay
    gate: contractual origination variant; not a local physical source
    presence: course_variant
    lifecycle: course_variant
    as_of: null
    source_ids: []
    fact_ids: []
    base_visible: false

  # Abstract teaching envelope. Exact campus merge, feeder topology, and MV voltage are open.
  - id: campus_mv_distribution
    label: Abstract campus MV distribution envelope
    domain: electrical
    gate: conceptual source-connection and building-feeder boundary
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: [tceq_37589_reference_drawing, mortenson_abilene_power_delivery]
    fact_ids: [campus_mv_reference_design_voltage_kv, campus_lpt_secondary_as_built_voltage_kv]
  - id: bess_package
    label: BESS package
    domain: electrical
    gate: future BESS package in a review design; exact campus connection unverified
    presence: site_evidenced
    lifecycle: future_design
    as_of: 2024-12-04
    source_ids: [tceq_37589_reference_drawing]
    fact_ids: [bess_reference_design_status, bess_operational_status]
  - id: diesel_backup_package
    label: Emergency diesel backup package
    domain: electrical
    gate: authorized standby generation; exact campus connection unverified
    presence: site_evidenced
    lifecycle: permitted
    as_of: 2025-04-24
    source_ids: [tceq_177262_diesel_application, tceq_177262_diesel_review]
    fact_ids: [diesel_units_authorized, diesel_permitted_nameplate_mw, diesel_units_installed, diesel_operational_units]

  # Downstream equipment is a teaching or product-design reference, not an Abilene as-built claim.
  - id: unit_substation
    label: Unit substation transformer
    domain: electrical
    gate: campus MV to facility LV AC
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: lv_switchgear
    label: LV switchgear
    domain: electrical
    gate: protected distribution to UPS lineups
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: ups
    label: UPS
    domain: electrical
    gate: stored-energy ride-through
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: busway
    label: Busway
    domain: electrical
    gate: facility AC to the rack position
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: power_shelf
    label: Rack power shelves
    domain: electrical
    gate: product-design reference for rack AC to nominal 50–51 VDC busbar
    presence: platform_evidenced
    lifecycle: conceptual
    as_of: 2026-03-03
    source_ids: [crusoe_abilene_expansion_2025, nvidia_dgx_gb200_hardware]
    fact_ids: [rack_platform_nvl72_design_reference, rack_power_shelf_output_vdc, rack_power_shelf_ac_input_voltage_v]
  - id: vrm
    label: Voltage regulator module
    domain: electrical
    gate: teaching reference for rack DC to core voltage
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: die
    label: GPU die
    domain: compute
    gate: electrical destination and heat source for the operating platform family
    presence: platform_evidenced
    lifecycle: operational_confirmed
    as_of: 2025-09-30
    source_ids: [crusoe_abilene_live_2025, openai_stargate_oracle_2025]
    fact_ids: [rack_platform, early_training_inference_live_by]
  - id: rack_air_load
    label: Air-cooled rack auxiliaries
    domain: thermal
    gate: product-documented non-CPU/GPU rack heat into the air path
    presence: platform_evidenced
    lifecycle: conceptual
    as_of: 2026-03-03
    source_ids: [crusoe_abilene_expansion_2025, nvidia_dgx_gb200_hardware]
    fact_ids: [rack_platform_nvl72_design_reference, rack_air_cooled_components]
  - id: cold_plate
    label: Cold plate
    domain: thermal
    gate: product/design reference for die heat into the technology coolant loop
    presence: platform_evidenced
    lifecycle: conceptual
    as_of: 2026-03-03
    source_ids: [crusoe_abilene_expansion_2025, nvidia_dgx_gb200_hardware]
    fact_ids: [rack_platform_nvl72_design_reference, cooling_direct_to_chip_design, rack_liquid_cooled_components]
  - id: rack_manifold
    label: Rack supply and return headers
    domain: thermal
    gate: product/design reference for distinct technology-loop supply and return
    presence: platform_evidenced
    lifecycle: conceptual
    as_of: 2026-03-03
    source_ids: [crusoe_abilene_expansion_2025, nvidia_dgx_gb200_hardware]
    fact_ids: [rack_platform_nvl72_design_reference, cooling_direct_to_chip_design, rack_liquid_cooled_components]
  - id: cdu
    label: Coolant distribution unit
    domain: thermal
    gate: conceptual interface between technology and facility loops
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: crah
    label: CRAH / fan-wall branch
    domain: thermal
    gate: conceptual air-load path into the facility loop
    presence: teaching_reference
    lifecycle: conceptual
    as_of: 2026-08-25
    source_ids: []
    fact_ids: []
  - id: facility_loop
    label: Closed facility water loop
    domain: thermal
    gate: selected-design closed loop carrying heat to the plant
    presence: site_evidenced
    lifecycle: conceptual
    as_of: 2025-08-05
    source_ids: [crusoe_abilene_cooling_2025, crusoe_abilene_expansion_2025]
    fact_ids: [cooling_heat_rejection_posture, cooling_direct_to_chip_design]
  - id: air_cooled_chiller
    label: Air-cooled chiller and condenser
    domain: thermal
    gate: selected-design facility-loop heat rejection to ambient air
    presence: site_evidenced
    lifecycle: conceptual
    as_of: 2025-08-05
    source_ids: [crusoe_abilene_cooling_2025]
    fact_ids: [cooling_heat_rejection_posture]
  - id: fill_treatment
    label: Initial fill and water treatment
    domain: site
    gate: design requirement for filling and maintaining the closed facility loop
    presence: site_evidenced
    lifecycle: conceptual
    as_of: 2025-08-05
    source_ids: [crusoe_abilene_cooling_2025]
    fact_ids: [cooling_initial_fill_gallons_per_building, cooling_annual_maintenance_gallons_per_building]
  - id: atmosphere
    label: Atmosphere
    domain: thermal
    gate: terminal heat sink
    presence: physical_sink
    lifecycle: terminal
    as_of: null
    source_ids: []
    fact_ids: []

