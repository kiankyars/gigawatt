<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ee" />
    <title>800 V DC — GIGAWATT teaching sample</title>
    <style>
      :root {
  --paper: #f4f3ee;
  --ink: #193139;
  --muted: #62716e;
  --teal: #0b756a;
  --amber: #ad650d;
  --line: #d7ded5;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
a {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  color: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 15px;
  background: transparent;
}
button:hover {
  background: #e6ebe3;
}
button:disabled {
  opacity: 0.35;
  cursor: default;
}
a {
  color: var(--teal);
  text-underline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #c77a15;
  outline-offset: 4px;
}
[hidden] {
  display: none !important;
}
.skip {
  position: fixed;
  top: 10px;
  left: 10px;
  padding: 12px;
  background: white;
  z-index: 9;
  transform: translateY(-160%);
}
.skip:focus {
  transform: none;
}
#audience {
  min-height: 100svh;
  display: grid;
  grid-template-rows: 64px 1fr 64px 30px;
  max-width: 1920px;
  margin: auto;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
}
.brand span {
  font-size: 10px;
  color: var(--muted);
  margin-left: 16px;
  letter-spacing: 1.5px;
}
.toolbar nav {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 12px;
}
.toolbar button {
  padding: 7px 10px;
}
.toolbar a {
  text-decoration: none;
}
#scene {
  padding: 24px 5vw 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  outline: none;
  gap: 16px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 700;
  color: var(--teal);
  margin: 0 0 10px;
}
h1 {
  font-family: Georgia, serif;
  font-weight: 400;
  letter-spacing: -1.5px;
  font-size: clamp(32px, 4vw, 64px);
  line-height: 1.05;
  margin: 0;
}
.scene-heading {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
}
#visual {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 280px;
}
.caption {
  font-size: clamp(14px, 1.25vw, 19px);
  text-align: center;
  margin: 0;
  color: var(--muted);
  line-height: 1.4;
}
.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  gap: 16px;
  border-top: 1px solid var(--line);
}
.transport > button {
  min-width: 100px;
}
.transport #next {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
#steps {
  display: flex;
  gap: 8px;
}
#steps button {
  width: 32px;
  height: 32px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  font-size: 12px;
  color: var(--muted);
}
#steps button[aria-current="step"] {
  background: var(--teal);
  color: white;
}
.workflow {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin: 0;
  padding: 6px 12px;
}
#notice:empty {
  display: none;
}
#notice {
  position: fixed;
  bottom: 40px;
  left: 5%;
  padding: 12px;
  background: var(--ink);
  color: white;
  border-radius: 8px;
  z-index: 8;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1.55fr;
  align-items: center;
  width: 100%;
  gap: 30px;
}
.hero img {
  width: 100%;
  max-height: 46vh;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.hero-number {
  font-size: clamp(78px, 12vw, 180px);
  letter-spacing: -8px;
  line-height: 1;
  font-weight: 600;
  color: var(--teal);
}
.hero-number small {
  font-size: 0.35em;
  letter-spacing: -2px;
}
.hero p {
  font-size: clamp(20px, 2.4vw, 36px);
  font-family: Georgia, serif;
  max-width: 350px;
  margin: 20px 0 0;
  line-height: 1.2;
}
.hero-goal {
  display: block;
  margin-top: 16px;
  color: var(--muted);
  font-size: 15px;
}
.copper-bundle {
  display: grid;
  gap: 22px;
  margin: 26px 12px 20px 0;
}
.copper-row {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 14px;
  align-items: center;
  height: 25px;
}
.copper-row span {
  font-size: 13px;
  font-weight: 700;
}
.copper-bar {
  display: block;
  height: 23px;
  position: relative;
  background: linear-gradient(
    180deg,
    #f5bd8c 0%,
    #c7804b 25%,
    #ba6b34 70%,
    #995027 100%
  );
  box-shadow:
    0 5px 0 #754020,
    0 9px 12px #0002;
  border: 1px solid #a35d30;
  border-radius: 2px;
}
.copper-bar::after {
  content: "";
  position: absolute;
  inset: 2px 0 2px auto;
  width: 8px;
  border-left: 1px solid #7a421e;
  background: #d38c55;
}
.copper-removed {
  color: #b8d5cb;
}
.copper-removed i {
  display: block;
  height: 23px;
  border: 1px dashed #86a79c;
  border-radius: 2px;
}
.copper-quantity {
  margin: 0;
  font-size: 16px;
}
.copper-quantity strong {
  font-size: 30px;
  font-weight: 500;
  margin-right: 6px;
}
.copper-result,
.capacity-result {
  display: grid;
  gap: 8px;
  text-align: center;
}
.copper-result strong,
.capacity-result strong {
  font:
    clamp(23px, 2.6vw, 39px) Georgia,
    serif;
  color: var(--teal);
}
.copper-result span,
.capacity-result span {
  font-size: 14px;
  color: var(--muted);
}
.rack-space {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 1px dashed var(--teal);
  border-radius: 6px;
  background: #e5f0e3;
  font-size: 12px;
  color: #256053;
}
.rack-space.occupied {
  background: #fff1d8;
  border: 1px solid #bc9358;
  color: #754a16;
}
.capacity-table {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: #fffefa;
}
.capacity-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  align-items: stretch;
}
.capacity-row:not(:last-child) {
  border-bottom: 1px solid var(--line);
}
.capacity-row > * {
  padding: 13px 24px;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.capacity-row > span {
  font-size: clamp(16px, 1.7vw, 25px);
  align-items: center;
}
.capacity-row > strong {
  justify-content: flex-end;
  font-size: clamp(24px, 2.9vw, 40px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.capacity-row > strong:last-child {
  background: var(--ink);
  color: #fffefa;
}
.capacity-row small {
  font-size: 0.5em;
}
.capacity-row.capacity-heading > * {
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}
.capacity-heading > strong:last-child {
  color: #b8d5cb;
}
.chip {
  display: inline-flex;
  padding: 8px 13px;
  border-radius: 30px;
  background: #e5ece3;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.hero .chip {
  margin-bottom: 28px;
}
.model {
  width: 100%;
  display: grid;
  gap: 22px;
}
.model-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.formula {
  font-family: Georgia, serif;
  font-size: clamp(24px, 2.6vw, 40px);
}
.comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.metric-card {
  background: #fffefa;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px 32px;
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}
.metric-card.changed {
  background: var(--ink);
  color: #fffefa;
  border-color: var(--ink);
}
.metric-label {
  font-size: clamp(18px, 1.8vw, 27px);
  color: var(--muted);
  margin: 0;
}
.changed .metric-label {
  color: #b8d5cb;
}
.metric {
  font-size: clamp(50px, 6vw, 92px);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  letter-spacing: -3px;
}
.metric small {
  font-size: 0.38em;
  letter-spacing: 0;
}
.metric-sub {
  font-size: clamp(13px, 1.2vw, 18px);
  margin: 0;
}
.conductor-lines {
  display: grid;
  gap: 6px;
  margin-top: 8px;
  min-height: 48px;
  align-content: center;
}
.conductor-lines > div {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 12px;
}
.conductor-lines span {
  width: 20px;
  font-size: 11px;
}
.conductor-lines i {
  flex: 1;
  height: 4px;
  background: var(--amber);
  border-radius: 2px;
}
.changed .conductor-lines i {
  background: #a3d597;
}
.reveal {
  background: #d1e9cd;
  color: var(--ink);
  border: 0;
  font-weight: 600;
  align-self: flex-start;
}
.changed button:hover {
  background: #e7f5e3;
}
.control-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 42px;
}
.control-line label {
  font-size: 14px;
}
.control-line input {
  width: clamp(120px, 25vw, 430px);
  accent-color: var(--teal);
}
.control-line output {
  font-variant-numeric: tabular-nums;
  min-width: 70px;
}
.control-line button {
  padding: 7px 12px;
  font-size: 13px;
}
.loss-track {
  height: 14px;
  background: #e3e7de;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.loss-bar {
  height: 100%;
  background: var(--amber);
}
.changed .loss-track {
  background: #3d5256;
}
.changed .loss-bar {
  background: #a3d597;
}
.bridge {
  font-family: Georgia, serif;
  font-size: clamp(20px, 2.4vw, 34px);
  text-align: center;
  margin: 0;
}
.bridge strong {
  font-weight: 400;
  color: var(--teal);
}
.architecture {
  width: 100%;
  display: grid;
  gap: 26px;
}
.path {
  display: grid;
  grid-template-columns: 1.15fr 2fr 2fr;
  gap: 18px;
  align-items: stretch;
}
.zone {
  border: 1px solid #c5cfc4;
  border-radius: 14px;
  padding: 18px;
  position: relative;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.zone-title {
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 700;
  margin: 0;
}
.zone.active {
  background: #e5ece3;
  border-color: #94b59f;
}
.zone.rack {
  background: #fffefa;
}
.zone-body {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 12px;
  justify-content: center;
}
.unit {
  border: 1.5px solid #80998d;
  background: var(--paper);
  border-radius: 8px;
  min-height: 95px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-align: center;
  flex: 1;
  font-size: clamp(14px, 1.45vw, 22px);
  line-height: 1.2;
}
.unit.converter {
  border: 2px solid var(--amber);
  background: #fff1d8;
}
.unit.chip-unit {
  background: var(--ink);
  color: #fffefa;
  border-color: var(--ink);
}
.unit small {
  font-size: 11px;
  color: var(--muted);
}
.chip-unit small {
  color: #b8d5cb;
}
.wire {
  color: var(--amber);
  font-size: 26px;
  font-weight: 600;
  flex: 0 0 auto;
}
.zone:not(:last-child):after {
  content: "→";
  position: absolute;
  right: -17px;
  top: 50%;
  font-size: 22px;
  color: var(--amber);
  z-index: 2;
}
.path-label {
  font-size: 16px;
  color: var(--amber);
  text-align: center;
  margin: 0;
}
.diagram-key {
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 13px;
  color: var(--muted);
}
.diagram-key span:before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  background: #fff1d8;
  border: 2px solid var(--amber);
  margin-right: 8px;
}
.boundary-line {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  font-size: clamp(18px, 1.8vw, 27px);
  font-family: Georgia, serif;
  text-align: center;
  margin: 0;
}
.transfer {
  width: 100%;
  display: grid;
  gap: 22px;
}
.transfer-path {
  display: grid;
  grid-template-columns: 1fr 60px 1.2fr;
  align-items: center;
  gap: 18px;
}
.transfer-path .metric-card {
  min-height: 210px;
}
.transfer-arrow {
  font-size: 44px;
  color: var(--amber);
  text-align: center;
}
.answer-strip {
  padding: 20px 26px;
  background: #e5ece3;
  border-radius: 10px;
  display: flex;
  gap: 24px;
  justify-content: space-between;
  align-items: center;
  min-height: 85px;
}
.answer-strip p {
  margin: 0;
  font-size: clamp(16px, 1.7vw, 25px);
  max-width: 700px;
}
.answer-strip b {
  font-size: clamp(25px, 3vw, 42px);
  font-weight: 500;
  white-space: nowrap;
}
.answer-strip button {
  background: var(--ink);
  color: white;
  margin: auto;
}
.transfer .metric-label {
  font-size: 17px;
}
#presenter {
  max-width: 1320px;
  margin: auto;
  padding: 24px;
}
.notes-header {
  display: flex;
  gap: 25px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.notes-header h1 {
  font-size: 24px;
}
.notes-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 36px;
  margin: 16px 0 90px;
}
.notes-layout article h2 {
  font:
    28px Georgia,
    serif;
  margin: 0 0 14px;
}
.notes-layout p {
  font-size: 18px;
  line-height: 1.65;
}
.speaker-points {
  display: grid;
  gap: 12px;
  padding-left: 1.25em;
  font-size: 20px;
  line-height: 1.45;
}
.speaker-points li::marker {
  color: var(--teal);
}
.notes-layout .cue {
  background: #e5ece3;
  padding: 10px 14px;
  border-left: 3px solid var(--teal);
  font-size: 16px;
  line-height: 1.4;
  margin: 0 0 12px;
}
.notes-layout aside {
  border-left: 1px solid var(--line);
  padding-left: 30px;
}
.notes-layout aside p,
.notes-layout aside a {
  font-size: 14px;
  line-height: 1.6;
}
.notes-layout .eyebrow {
  font-size: 11px;
}
.next-note {
  border-top: 1px solid var(--line);
  margin-top: 32px;
  padding-top: 20px;
}
.notes-controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 18px;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding: 16px;
}
.notes-controls button:last-child {
  background: var(--ink);
  color: white;
}
#notes-outline {
  display: grid;
  gap: 8px;
  margin-top: 26px;
}
#notes-outline button {
  text-align: left;
  font-size: 13px;
}
#notes-outline button[aria-current="step"] {
  background: var(--ink);
  color: white;
}
#connection {
  font-size: 13px;
  color: var(--muted);
}
@media (min-width: 800px) and (min-height: 560px) {
  #audience {
    height: 100svh;
  }
  #visual {
    min-height: 0;
  }
}
@media (max-height: 750px) and (min-width: 800px) {
  #audience {
    grid-template-rows: 54px 1fr 54px 26px;
  }
  #scene {
    padding-top: 16px;
    gap: 12px;
  }
  h1 {
    font-size: clamp(32px, 3.6vw, 48px);
  }
  .metric-card {
    min-height: 165px;
    padding: 18px 24px;
    gap: 6px;
  }
  .metric {
    font-size: clamp(48px, 5.8vw, 76px);
  }
  .model {
    gap: 14px;
  }
  .zone {
    min-height: 175px;
    gap: 10px;
    padding: 14px;
  }
  .unit {
    min-height: 80px;
  }
  .architecture {
    gap: 18px;
  }
  .transfer-path .metric-card {
    min-height: 165px;
  }
  .hero img {
    max-height: 43vh;
  }
  .hero .chip {
    margin-bottom: 16px;
  }
  .hero-number {
    font-size: 120px;
  }
}
@media (max-width: 799px) {
  #audience {
    grid-template-rows: auto 1fr auto auto;
  }
  .toolbar {
    padding: 14px 18px;
    align-items: flex-start;
    gap: 12px;
  }
  .brand {
    font-size: 13px;
  }
  .brand span {
    display: block;
    margin: 6px 0 0;
    font-size: 8px;
  }
  .toolbar nav {
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    font-size: 10px;
  }
  .toolbar button {
    font-size: 10px;
    padding: 7px;
  }
  .toolbar #fullscreen span {
    display: none;
  }
  #scene {
    padding: 24px 20px;
    gap: 24px;
  }
  h1 {
    font-size: 36px;
    letter-spacing: -1px;
  }
  #visual {
    min-height: 0;
  }
  .hero {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .hero-number {
    font-size: 100px;
    letter-spacing: -5px;
  }
  .hero .chip {
    margin-bottom: 18px;
  }
  .hero p {
    font-size: 24px;
    margin: 12px 0 0;
  }
  .hero img {
    max-height: 240px;
  }
  .comparison {
    gap: 12px;
  }
  .metric-card {
    padding: 18px 14px;
    min-height: 150px;
    border-radius: 10px;
  }
  .metric {
    font-size: 42px;
    letter-spacing: -2px;
  }
  .metric-label {
    font-size: 18px;
  }
  .metric-sub {
    font-size: 12px;
  }
  .model-top {
    flex-direction: column;
    align-items: flex-start;
  }
  .formula {
    font-size: 27px;
  }
  .chip {
    font-size: 12px;
  }
  .control-line {
    flex-wrap: wrap;
    gap: 12px;
  }
  .control-line input {
    width: 160px;
  }
  .caption {
    font-size: 13px;
  }
  .reveal {
    font-size: 12px;
    padding: 10px;
  }
  .transport {
    padding: 12px 16px;
    gap: 8px;
  }
  .transport > button {
    min-width: 42px;
    padding: 8px;
  }
  .transport > button span {
    display: none;
  }
  #steps {
    gap: 2px;
  }
  #steps button {
    width: 24px;
    height: 29px;
  }
  .workflow {
    font-size: 10px;
    padding: 10px 18px;
  }
  .path {

    <script id="presentation-data" type="application/json">
      {"schema_version":1,"id":"sample-800v-presentation","source_lesson_id":"sample-800v","title":"800 V DC: less copper, room for compute","planned_duration_seconds":900,"timing_note":"Unrecorded dry run first. Allow roughly fifteen minutes for explanation, predictions and discussion; these are provisional rehearsal allocations, not a measured runtime or a target to fill.","review_state":"Copper and equipment space lead the revised draft. Numerical comparisons and capacity limits await another unrecorded dry run.","defaults":{"power_kw":100,"reference_voltage_v":480,"comparison_voltage_v":800,"hours":1,"ac_conversion_kw":4,"dc_conversion_kw":3,"conductor_ohms":0.01,"power_factor":1,"dc_upstream_conversion_kw":1},"presentation_rules":["Show one step at a time. Presenter notes use a few short speaking prompts; full explanations and sources belong in student reading.","Lead with a physical constraint and a visible material comparison before introducing equations.","On copper, current, loss, energy, path-comparison and capacity-check steps, ask for a prediction before revealing the result.","Use the same load and diagram positions throughout the architecture sequence; change conversion placement deliberately.","Architecture drawings show selected functional boundaries. They are conceptual schematics, not wiring diagrams.","Keep equal conductor geometry visible in the copper scene. Equal effective resistance in the heat model is a separate idealization.","Compute displayed answers with the tested three-phase AC and two-wire DC model rather than embedding numbers in generated illustrations.","Hold receiving-end real power fixed until the explicit transfer question. State AC line-to-line RMS voltage, power factor and resistance per conductor.","Distinguish three claims: copper under equal geometry; space under a specified equipment placement; input energy under a complete loss balance.","End with a changed case that requires a prediction and identifies information the calculation cannot supply."],"steps":[{"id":"one-load","title":"Start with the physical constraint","kind":"intro","headline":"More power. Less copper. Room for compute.","caption":"Start at 100 kW: 480 V three-phase AC versus 800 V two-wire DC.","notes":["Goal: less distribution copper; more compute-rack space.","Baseline: 100 kW received; 480 V three-phase AC versus 800 V two-wire DC.","AC voltage: line-to-line RMS (effective voltage between phases); balanced AC, power factor 1.","Count three AC / two DC conductors; exclude converters, protective earth and neutral."],"duration_seconds":60,"cue":"Point to the conductors and conversion equipment; establish the fixed 100 kW load.","explanation":["The design ambition is more usable compute power with less distribution copper and less compute-rack space occupied by power-conversion equipment. Hall-space benefits depend on where that equipment moves.","Begin with 100 kW at each feeder receiving end: 480 V balanced three-phase AC, line-to-line RMS and power factor one, versus 800 V two-wire DC. This first comparison excludes converters and cooling."],"pedagogical_role":"problem"},{"id":"conductor-copper","title":"Make the copper comparison visible","kind":"copper","pedagogical_role":"comparison","headline":"Start with the copper.","caption":"Equal length, material and cross-section; compare current-carrying copper only.","duration_seconds":90,"cue":"Ask which bundle uses less copper. Count the pieces, then reveal.","notes":["Equal length, cross-section and copper material for every conductor.","Copper mass ∝ conductor count × length × cross-section: two pieces versus three.","2/3 as much copper → 33.3% less; a material comparison.","Cable capacity unproven; equal effective resistance is a separate assumption."],"explanation":["For equal conductor length L, cross-sectional area A and copper density, mass is proportional to count × L × A. Three AC conductors versus two DC conductors therefore gives a DC/AC copper ratio of 2/3: 33.3% less current-carrying conductor copper at the stated equal 100 kW load.","This excludes protective earth, any neutral, insulation and terminations. It compares material quantity; it does not establish an ampacity-qualified installation. The later equal-effective-resistance heat calculation is a separate idealization.","The ambition is more power with less material. This controlled comparison establishes the material arithmetic first; it does not yet establish safe additional power capacity."]},{"id":"current-prediction","title":"Predict the current","kind":"current","headline":"Fewer conductors. Less current?","caption":"100 kW received; 480 V AC line-to-line RMS, power factor 1; compare current per conductor.","notes":["DC: I = P/V. Balanced three-phase AC: I = P/(√3 × V_line-to-line × PF).","At 100 kW: 480 V AC → 120.3 A RMS per line; 800 V DC → 125 A per conductor.","DC current is slightly higher here; fewer conductors explain the copper reduction.","Raise DC voltage → lower DC current. Later scenes reset to 800 V."],"duration_seconds":90,"cue":"Ask whether fewer conductors means less current per conductor. Reveal, then move the DC voltage slider.","explanation":["For DC, I = P/V. For balanced three-phase AC, I = P/(√3 × V_line-to-line × PF). At 100 kW, 480 V AC and PF = 1 give 120.3 A per line; 800 V DC gives 125 A per conductor.","Two instead of three is 33.3% less conductor copper under the preceding geometry assumptions, not 33.3% less current. The DC voltage slider changes only this scene; later comparisons return to 800 V."],"pedagogical_role":"mechanism"},{"id":"conductor-loss","title":"Connect current to heating","kind":"loss","headline":"Count every conductor's heat.","caption":"Resistance: 10 mΩ per conductor in both cases; three AC conductors versus two DC conductors.","notes":["Each conductor: I²R heat. Sum all three AC conductors or both DC conductors.","Assume 10 mΩ effective resistance per conductor; AC calculation uses RMS current.","AC: 434 W. DC: 312.5 W → 28% less conductor heat.","Keep denominators distinct: 28% less heat; 33.3% less copper. Neither establishes facility savings."],"duration_seconds":90,"cue":"Ask how to total the heating across all wires, then reveal.","explanation":["At equal resistance R per conductor, total feeder heat is 3I_AC²R for balanced three-phase AC and 2I_DC²R for two-wire DC. With R = 0.01 Ω, the losses are about 434.0 W and 312.5 W respectively.","The DC-to-AC heat ratio is 0.72: 28% less conductor heat. Equal effective resistance is an additional model assumption, not an automatic consequence of equal copper geometry. The earlier 33.3% figure described material; neither number is a whole-facility saving."],"pedagogical_role":"mechanism"},{"id":"conversion-in-rack","title":"Locate conversion in the rack","kind":"ac","headline":"Rack conversion occupies room for compute.","caption":"AC reaches the compute rack; conversion and regulation occupy space there.","notes":["Follow facility AC into the compute rack; locate conversion, then device regulation.","Conversion equipment occupies rack space that could otherwise support compute.","Conceptual placement: protection, grounding and other required equipment omitted."],"duration_seconds":45,"cue":"Trace the incoming supply to the devices; point out the space occupied by conversion.","explanation":["A simplified AC-to-rack arrangement brings AC to the compute rack, converts it to DC there, and regulates voltage again near the devices. Conversion equipment occupies rack space that could otherwise serve other functions.","The functional drawing omits protection, grounding and other required equipment. It locates conversion without specifying a buildable installation."],"pedagogical_role":"architecture"},{"id":"conversion-in-sidecar","title":"Move conversion into a sidecar","kind":"sidecar","headline":"Free rack space. Locate the displaced equipment.","caption":"A nearby sidecar supplies DC; upstream AC and nearby equipment space remain.","notes":["Move conversion beside the compute rack; DC begins after the sidecar converter.","Compute-rack space released; sidecar still needs hall space, cooling and service access.","Upstream AC constraints and final low-voltage device regulation remain."],"duration_seconds":60,"cue":"Move the converter; ask which space is freed and which space is now occupied.","explanation":["A sidecar arrangement keeps upstream AC but places AC-to-DC conversion in nearby equipment. The 800 V DC segment begins after that conversion.","A sidecar can free compute-rack space while occupying space nearby. It does not by itself establish net hall-space savings. The converter still needs cooling and service access; upstream AC limits and final device regulation remain."],"pedagogical_role":"architecture"},{"id":"conversion-farther-upstream","title":"Move conversion farther upstream","kind":"facility","headline":"Move conversion toward the power room.","caption":"A longer DC distribution path can move conversion equipment out of the data hall.","notes":["Move conversion into a power room → longer DC distribution segment.","Selected equipment leaves the hall; its footprint and supporting services move elsewhere.","Final device regulation remains; conceptual placement does not establish installed results or total footprint savings.","NVIDIA’s 54 V DC rack comparison uses another boundary; our numerical baseline stays 480 V AC."],"duration_seconds":60,"cue":"Trace where DC begins; compare the released hall space with the new power-room footprint.","explanation":["Moving conversion into a power room extends the DC distribution segment and can free hall space occupied by selected conversion equipment. The equipment still has a footprint and supporting requirements at its new location.","NVIDIA also describes a separate 54 V DC rack-distribution constraint. Our numerical baseline remains the 480 V AC feeder. Final low-voltage device conversion remains necessary in both cases.","These conceptual diagrams compare placement; they do not establish installed results, total-footprint savings or an efficiency ranking."],"pedagogical_role":"architecture"},{"id":"energy-balance","title":"Close the energy balance","kind":"energy","headline":"Account for heat without overstating the saving.","caption":"480 V AC versus 800 V DC; 10 mΩ per conductor; converters excluded; one hour.","duration_seconds":90,"cue":"Ask what the source supplies beyond the load. Reveal; convert the difference to one hour of energy.","notes":["Boundary: 100 kW received; 10 mΩ per conductor; converters and cooling excluded.","Input = received power + conductor heat; sending supply also covers voltage drop.","AC input: 100.434 kW. DC input: 100.3125 kW.","One hour → 0.122 kWh less DC input. Small assumed resistance makes both feeders efficient."],"explanation":["Keep 100 kW at each feeder receiving end: 480 V balanced three-phase AC at power factor one versus 800 V two-wire DC. Each conductor has 10 mΩ resistance. The sending supply covers the conductor voltage drop.","Input equals delivered power plus conductor heat: about 100.434 kW for AC and 100.313 kW for DC. Over one hour, DC requires about 0.122 kWh less input under these assumptions.","The 28% reduction applies to a deliberately small conductor-loss budget. The hypothetical 10 mΩ resistance makes both feeders efficient; this small difference does not predict real architecture savings. Material and equipment-space claims remain separate, and converter and cooling losses are excluded."],"pedagogical_role":"balance"},{"id":"ac-dc-ledger","title":"Compare complete delivery paths","kind":"paths","headline":"Conversion losses can reverse the energy comparison.","caption":"Same final 100 kW load; calculated conductor heat plus explicitly assumed conversion losses.","duration_seconds":180,"cue":"Reveal the default balance. Raise DC conversion loss to 6 kW; ask why the ranking reverses.","notes":["New boundary: same facility AC supply → same final 100 kW DC load.","Default losses: AC 4 kW downstream; DC 1 kW upstream + 2 kW downstream.","Downstream loss raises feeder power, current and I²R heat: AC feeder 104 kW; DC feeder 102 kW.","Default: DC saves 1.144 kWh over one hour. Set DC conversion loss to 6 kW → uses 1.875 kWh more.","Hypothetical conversion losses; cooling excluded. Copper, equipment placement and input energy require separate comparisons."],"explanation":["Earlier, the 100 kW boundary was each feeder receiving end. Now it is the final useful DC load, and both paths start at the same facility AC supply boundary. Downstream conversion losses add to the power the feeder must deliver, so they also affect its current and conductor heat.","The 480 V AC feeder delivers 104 kW: 100 kW useful load plus 4 kW assumed downstream conversion loss. The 800 V DC feeder delivers 102 kW: 100 kW useful load plus 2 kW assumed downstream loss. DC also has a fixed 1 kW upstream rectifier loss. With 10 mΩ per conductor, calculated conductor heat is about 0.469 kW for AC and 0.325 kW for DC.","Required input is about 104.469 kW for AC and 103.325 kW for DC. Over one hour, DC uses about 1.144 kWh less input. Raise total DC conversion loss from 3 to 6 kW: downstream loss and feeder current increase, and DC then uses about 1.875 kWh more than AC.","Conversion losses are hypothetical operating-point assumptions; conductor heat is calculated from them. Cooling, other losses and voltage compatibility are outside the model. The reversal disproves an automatic energy advantage; it does not undo the separately defined copper comparison or equipment relocation."],"pedagogical_role":"counterexample"},{"id":"capacity-check","title":"Test the claim at a higher load","kind":"decision","pedagogical_role":"transfer","headline":"Same copper. Twice the power. What changes?","caption":"800 V DC; 100 → 200 kW received; unchanged conductors; 10 mΩ each.","duration_seconds":135,"cue":"Ask for current, heat and a capacity verdict. Reveal, then discuss the missing limits.","notes":["Hold 800 V and both conductors fixed; raise received power from 100 to 200 kW.","Current: 125 → 250 A. Conductor heat: 0.3125 → 1.25 kW at fixed resistance.","Capacity unknown: need temperature, voltage-drop and equipment limits; copper quantity stays unchanged.","Close: compare copper geometry, equipment placement and complete energy balance separately."],"explanation":["At the same 800 V DC receiving end, raising delivered power from 100 to 200 kW doubles current from 125 to 250 A. With two conductors fixed at 0.01 Ω each, conductor heat rises from 0.3125 to 1.25 kW: four times as much. Copper quantity stays fixed because the conductors were held unchanged.","Safe operating capacity is unknown. The model supplies neither conductor ampacity nor installation, temperature, voltage-drop, terminal, protection, converter or cooling limits. Resistance also varies with temperature in a real installation.","Judge copper with explicit geometry, space with explicit equipment placement, and energy with a complete loss balance. Those tools help evaluate denser racks; they do not make additional usable capacity automatic."]}],"sources":[{"title":"NVIDIA: Why Scaling AI Compute Performance Requires a New Power Architecture","url":"https://blogs.nvidia.com/blog/800-vdc-power-architecture-ai-factory/","claim":"Architecture context for higher-voltage DC distribution and conversion placement. Feeder values and conversion losses are original teaching assumptions; conductor heat is calculated from the power each feeder must deliver.","reviewed_on":"2026-09-08","limits":"Vendor roadmap; proposed architecture and availability expectations are distinct from verified installed deployment."},{"title":"Schneider Electric: Total power calculation for accuracy verification testing","url":"https://productinfo.se.com/pm2200/5afc2b5546e0fb00011e5e9d/PM2200%20series%20User%20Manual/English/BM_PM2200seriesUserManual_0000074170.ditamap.xml/%24/C_VerifyingAccuracy_PowerTotCalcuation_0000034437","claim":"Balanced three-phase real power is 3 × line-to-neutral RMS voltage × line current × power factor, equivalent to √3 × line-to-line RMS voltage × line current × power factor.","reviewed_on":"2026-09-08","limits":"Balanced three-phase relationship. Numerical loads, voltages, resistance and conversion losses are original teaching assumptions; calculated conductor losses are not equipment specifications."},{"title":"NVIDIA: Gigawatt AI factories and the 800 V DC transition","url":"https://blogs.nvidia.com/blog/gigawatt-ai-factories-ocp-vera-rubin/","claim":"Identifies 415 or 480 V three-phase AC systems as relevant baselines for the proposed transition to 800 V DC.","reviewed_on":"2026-09-08","limits":"Used only for baseline relevance. Vendor current, efficiency, copper and deployment claims are not validated by this teaching calculation."},{"title":"NVIDIA: 800 VDC Architecture Will Power the Next Generation of AI Factories","url":"https://developer.nvidia.com/blog/nvidia-800-v-hvdc-architecture-will-power-the-next-generation-of-ai-factories/","claim":"Primary context for copper and rack-space constraints, upstream conversion, and the distinct 54 V rack-distribution boundary. Numerical feeder examples are original teaching calculations.","reviewed_on":"2026-09-09","limits":"May 2025 vendor roadmap. Proposed capacity, deployment and savings figures are not field validation; its percentage claims are not used as calculated sample results."}],"aliases":{"feeder-transfer":"ac-dc-ledger"},"learning_contract":{"driving_question":"How can denser racks use less distribution copper and less space for power conversion?","fixed_boundary":"100 kW at each feeder receiving end; later 100 kW at the final DC load.","changed_variable":"480 V three-phase AC versus 800 V two-wire DC, then conversion placement.","primary_payoff":"Explain copper quantity and equipment placement before evaluating energy savings.","misconceptio     <script>
      function positive(value, name) {
  if (!Number.isFinite(value) || value <= 0)
    throw new RangeError(`${name} must be positive and finite`);
  return value;
}
function dcModel(kw, volts) {
  positive(kw, "Power");
  positive(volts, "Voltage");
  return {
    amps: (kw * 1000) / volts,
    referenceAmps: (kw * 1000) / 48,
    lossRatio: (48 / volts) ** 2,
  };
}
function thermalModel(kw, deltaT, auxiliaryKW) {
  positive(kw, "Heat duty");
  positive(deltaT, "Temperature rise");
  if (!Number.isFinite(auxiliaryKW) || auxiliaryKW < 0)
    throw new RangeError("Auxiliary input must be nonnegative");
  return {
    kgPerSecond: kw / (4.18 * deltaT),
    litersPerMinute: (kw / (4.18 * deltaT)) * 60,
    rejectedKW: kw + auxiliaryKW,
  };
}
function transferModel(gigabytes, gbps, efficiency) {
  positive(gigabytes, "Payload");
  positive(gbps, "Link rate");
  if (!Number.isFinite(efficiency) || efficiency <= 0 || efficiency > 1)
    throw new RangeError("Efficiency must lie in (0, 1]");
  const GBps = (gbps / 8) * efficiency;
  return { GBps, seconds: gigabytes / GBps };
}
function rooflineModel(intensity, bandwidthTBps, peakTFLOPS) {
  positive(intensity, "Arithmetic intensity");
  positive(bandwidthTBps, "Bandwidth");
  positive(peakTFLOPS, "Peak compute");
  const memoryCeiling = intensity * bandwidthTBps;
  return {
    memoryCeiling,
    ceiling: Math.min(memoryCeiling, peakTFLOPS),
    binding:
      memoryCeiling < peakTFLOPS
        ? "memory bandwidth"
        : memoryCeiling > peakTFLOPS
          ? "compute"
          : "both ceilings",
  };
}
function continuityModel(
  kwh,
  efficiency,
  loadKW,
  inverterKW,
  auxiliarySupported,
) {

function dcConductorModel(loadKW, loadVolts, loopOhms, hours) {
  positive(loadKW, "Delivered power");
  positive(loadVolts, "Receiving-end voltage");
  positive(hours, "Duration");

    throw new RangeError("Loop resistance must be nonnegative and finite");

  const lossKW = (amps * amps * loopOhms) / 1000;
  const inputKW = loadKW + lossKW;

    amps,
    lossKW,
    inputKW,
    sendingVolts: loadVolts + amps * loopOhms,
    deliveredKWh: loadKW * hours,
    lossKWh: lossKW * hours,
    inputKWh: inputKW * hours,
  };
}
function acdcConductorModel(
  loadKW,
  acVolts,
  dcVolts,
  powerFactor,
  conductorOhms,
  hours,
) {
  positive(loadKW, "Delivered real power");
  positive(acVolts, "Receiving-end AC line-to-line RMS voltage");
  positive(dcVolts, "Receiving-end DC pair voltage");
  positive(hours, "Duration");

    throw new RangeError("Power factor must lie in (0, 1]");

    throw new RangeError(
      "Resistance per conductor must be nonnegative and finite",

    const lossKW = (conductors * amps ** 2 * conductorOhms) / 1000;

      amps,
      conductors,
      lossKW,
      inputKW: loadKW + lossKW,

      lossKWh: lossKW * hours,
      inputKWh: (loadKW + lossKW) * hours,

    ![conversionLossKW, conductorLossKW].every(

    lossKW,

    inputKWh: (loadKW + lossKW) * hours,

function acdcDeliveryModel(

  acVolts,
  dcVolts,
  powerFactor,
  conductorOhms,
  hours,

  dcConversionKW,
  dcUpstreamConversionKW,

    acFeederKW,
    acVolts,
    dcVolts,
    powerFactor,
    conductorOhms,
    hours,
  ).ac;

    dcFeederKW,
    acVolts,
    dcVolts,
    powerFactor,
    conductorOhms,
    hours,
  ).dc;

    ac: {
      ...deliveryPathModel(loadKW, acConversionKW, ac.lossKW, hours),
      conductorLossKW: ac.lossKW,
      amps: ac.amps,
      feederKW: acFeederKW,
    },
    dc: {
      ...deliveryPathModel(loadKW, dcConversionKW, dc.lossKW, hours),
      conductorLossKW: dc.lossKW,
      amps: dc.amps,
      feederKW: dcFeederKW,
    },
    dcDownstreamKW,
  };

      ],
      dc.inputKW,
      true,
      true,
    );
    byId("dc-conversion-value").textContent =
      `${fmt(state.dcConversionKW, 1)} kW`;
    byId("path-result").textContent = pathResult(ac, dc);
    publish();
  });
  byId("dc-loss-reset")?.addEventListener("click", () =>
    change({ dcConversionKW: DEFAULTS.dc_conversion_kw }),
  );
  byId("reveal")?.addEventListener("click", reveal);
  byId("voltage")?.addEventListener("input", (event) => {
    state.volts = Number(event.target.value);
    byId("variable-voltage").textContent = state.volts;
    byId("variable-current").innerHTML = metric(
      fmt(conductorNumbers(state.volts).dc.amps, 1),
      "A",
    );
    byId("voltage-value").textContent = `${state.volts} V`;
    byId("variable-derivation").textContent =
      `${fmt(DEFAULTS.power_kw * 1000)} W ÷ ${state.volts} V`;
    publish();
  });
  byId("reset-voltage")?.addEventListener("click", () =>
    change({ volts: DEFAULTS.comparison_voltage_v }),
  );
}
function render() {
  const step = STEPS[state.index];
  document.title = `${notesMode ? "Presenter notes · " : ""}${step.title} — GIGAWATT`;
  renderSteps();
  if (notesMode) {
    renderNotes();
    return;
  }
  const focus = document.activeElement?.id;
  byId("chapter").textContent =
    `800 V DC / ${String(state.index + 1).padStart(2, "0")} · ${step.title}`;
  byId("scene-title").textContent = step.headline;
  byId("caption").textContent = step.caption;
  byId("visual").innerHTML = (
    { intro, copper, current, loss, energy, paths, decision }[step.kind] ||
    (() => architecture(step.kind))
  )();
  byId("previous").disabled = state.index === 0;
  byId("next").disabled = state.index === STEPS.length - 1;
  byId("next").innerHTML =
    state.index === STEPS.length - 1
      ? "<span>End of sample</span> ✓"
      : "<span>Next</span> →";
  if (studentMode)
    byId("student-explanation").innerHTML = step.explanation
      .map((p) => `<p>${escapeHTML(p)}</p>`)
      .join("");
  bindVisual();
  if (focus === "reveal") byId("scene").focus({ preventScroll: true });
}
byId("view-label").textContent = studentMode
  ? "800 V DC · EXPLORE"
  : "800 V DC · TEACH";
byId("open-notes").hidden = !teachingMode;
byId("fullscreen").hidden = !teachingMode;
byId("student-context").hidden = !studentMode;
byId("audience").hidden = notesMode;
byId("presenter").hidden = !notesMode;
byId("previous").addEventListener("click", () => move(-1));
byId("next").addEventListener("click", () => move(1));
byId("notes-previous").addEventListener("click", () => move(-1));
byId("notes-next-button").addEventListener("click", () => move(1));
byId("notes-reveal").addEventListener("click", reveal);
byId("open-notes").addEventListener("click", () => {
  const win = window.open(
    `sample-notes.html?session=${encodeURIComponent(session)}#${STEPS[state.index].id}`,
    `gigawatt-notes-${session}`,
    "popup,width=1120,height=850",
  );
  if (!win)
    byId("notice").textContent =
      "The notes window was blocked. Allow this popup, then select Presenter notes again.";
});
byId("fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    byId("notice").textContent =
      "Fullscreen is unavailable here. Open this page in a standalone browser window.";
  }
});
document.addEventListener("fullscreenchange", () => {
  byId("fullscreen").setAttribute(
    "aria-label",
    document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen",
  );
  byId("fullscreen").innerHTML =
    `⛶ <span>${document.fullscreenElement ? "Exit fullscreen" : "Fullscreen"}</span>`;
});
document.addEventListener("keydown", (event) => {
  if (
    event.altKey ||
    event.ctrlKey ||
    event.metaKey ||
    /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)
  )
    return;
  if (event.key === "ArrowRight" || event.key === "PageDown") {
    event.preventDefault();
    move(1);
  }
  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    move(-1);
  }
  if (event.key.toLowerCase() === "r") reveal();
  if (event.key.toLowerCase() === "p" && teachingMode)
    byId("open-notes").click();
  if (event.key.toLowerCase() === "f" && teachingMode)
    byId("fullscreen").click();
});
window.addEventListener("hashchange", () => {
  const selected = STEPS.findIndex(
    (s) =>
      s.id ===
      (PRESENTATION.aliases?.[location.hash.slice(1)] ||
        location.hash.slice(1)),
  );
  if (selected >= 0) change({ index: selected });
});
if (channel) {
  channel.addEventListener("message", ({ data }) => {
    if (!data || data.role === role) return;
    if (notesMode)
      byId("connection").textContent =
        "Connected to the visual window. Navigation and reveals stay in sync.";
    if (data.type === "hello") publish();
    if (data.type === "state" && validState(data.state))
      change(data.state, false);
  });
  channel.postMessage({ type: "hello", role });
}
byId("connection").textContent = channel
  ? "Open the visual window to connect. These notes also work on their own."
  : "Live synchronization is unavailable in this browser. Advance each window separately.";
render();
;
    </script>
  </body>
</html>
