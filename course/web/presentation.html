<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f3ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101b1f"
      media="(prefers-color-scheme: dark)"
    />
    <title>800 V DC — GIGAWATT teaching sample</title>
    <style>
      __PRESENTATION_CSS__
    </style>
  </head>
  <body data-view="__PRESENTATION_MODE__">
    <a class="skip" href="#scene">Skip to visual</a>
    <div id="audience">
      <header class="toolbar">
        <a class="brand" href="index.html"
          >ϟ GIGAWATT <span id="view-label">800 V DC</span></a
        >
        <nav aria-label="Lesson navigation">
          <a href="sample-reading.html">Read the lesson</a>
          <button id="open-notes">Presenter notes ↗</button>
          <button id="fullscreen" aria-label="Enter fullscreen">
            ⛶ <span>Fullscreen</span>
          </button>
        </nav>
      </header>
      <main id="scene" tabindex="-1" aria-labelledby="scene-title">
        <div class="scene-heading" aria-live="polite" aria-atomic="true">
          <p id="chapter" class="eyebrow"></p>
          <h1 id="scene-title"></h1>
        </div>
        <div id="visual"></div>
        <details id="student-context" hidden>
          <summary>Explanation and source</summary>
          <div id="student-explanation"></div>
          <a href="sample-reading.html">Full lesson and references ↗</a>
        </details>
      </main>
      <footer class="transport">
        <button id="previous" aria-label="Previous visual">
          ← <span>Back</span>
        </button>
        <nav id="steps" aria-label="Teaching sequence"></nav>
        <button id="next"><span>Next</span> →</button>
      </footer>
      <p id="notice" role="status"></p>
    </div>
    <main id="presenter" hidden>
      <header class="notes-header">
        <div>
          <p class="eyebrow">PRESENTER NOTES</p>
          <h1 id="notes-title"></h1>
        </div>
        <a id="audience-link" href="teach.html" target="gigawatt-audience"
          >Open visual ↗</a
        >
      </header>
      <p id="connection" role="status"></p>
      <div class="notes-layout">
        <article>
          <p class="eyebrow" id="notes-position"></p>
          <h2 id="notes-headline"></h2>
          <p class="cue" id="notes-cue"></p>
          <div id="narration"></div>
          <section class="next-note">
            <p class="eyebrow">NEXT VISUAL</p>
            <p id="notes-next"></p>
          </section>
        </article>
        <aside>
          <h2>Lesson sequence</h2>
          <a href="sample-reading.html"
            >Full explanation, worked example and sources ↗</a
          >
          <nav id="notes-outline" aria-label="Presenter sequence"></nav>
        </aside>
      </div>
      <footer class="notes-controls">
        <button id="notes-previous">← Back</button
        ><button id="notes-reveal">Reveal answer</button
        ><button id="notes-next-button">Next →</button>
      </footer>
    </main>
    <noscript
      ><p>
        <a href="SAMPLE.md">Read the sample and calculations</a>. The
        presentation controls require JavaScript.
      </p></noscript
    >
    <script id="presentation-data" type="application/json">
      __PRESENTATION_DATA__
    </script>
    <script>
      __PRESENTATION_SCRIPT__;
    </script>
  </body>
</html>
