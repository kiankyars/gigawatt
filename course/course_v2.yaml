schema_version: 1

id: gigawatt_course_v2
title: GIGAWATT
subtitle: Follow the power-and-heat service chain from source options to useful compute and atmospheric rejection

interaction:
  mode: manual
  advance: instructor_controlled

journey:
  id: physical_journey
  title: One system journey, six engineering problems
  anchor_question: >-
    What has to remain true across source branches, grid delivery, campus and
    building power, processor switching, and heat rejection?
  body: >-
    The course follows an engineered energy-service chain through six changes
    of scale. It does not trace one electron or claim that Abilene's grid and
    onsite sources form one evidenced as-built path. Each phase first explains
    the generic mechanism, then maps only supported parts onto the Abilene
    reference campus, and finally exposes the constraint handed onward.
  phase_ids:
    - phase_1_generation
    - phase_2_transmission
    - phase_3_campus
    - phase_4_building
    - phase_5_compute
    - phase_6_heat

spatial:
  minimum_width_px: 900
  state_views:
    phase_1_generation:
      abilene_selection:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s01_fire_to_electricity
        title: Fire is not electricity
        purpose: >-
          Place the permitted onsite gas package, generator, and conceptual
          step-up interface in the campus context after surveying the generic
          generation families.
        boundary: >-
          The gas-turbine and generator evidence does not establish the exact
          installed unit mix, commissioning state, present output,
          generator-terminal voltage, or as-built GSU connection.
      transmission_handoff:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s02_generator_terminal
        title: Generator-terminal MV is only the beginning
        purpose: >-
          Follow shaft-to-electric conversion through the generator terminal
          and step-up boundary before handing the watt to transmission.
        boundary: >-
          The frame is a conceptual electrical handoff, not an Abilene as-built
          one-line or evidence of the selected generator-terminal voltage,
          transformer ratio, grounding, protection, or campus-side interface.
    phase_2_transmission:
      abilene_grid_paths:
        artifact: diagram/hybrid.html
        view_kind: camera
        view_id: campus_establishing
        title: Campus establishing view
        purpose: >-
          Locate the separately evidenced 138 kV, 345 kV, and behind-the-meter
          source-side paths before the campus distribution problem begins.
        boundary: >-
          The source-side paths are evidenced separately, but their exact
          interfaces with campus MV and any common downstream merge remain
          unresolved; the view must not imply one as-built shared bus.
    phase_3_campus:
      abilene_unknown_merge:
        artifact: diagram/hybrid.html
        view_kind: camera
        view_id: campus_establishing
        title: Campus establishing view
        purpose: >-
          Hold the separately evidenced source paths in one spatial frame while
          identifying the abstract campus distribution envelope that still
          requires an as-built topology.
        boundary: >-
          No reviewed source establishes the Abilene as-built merge, campus-MV
          topology, feeder arrangement, or protective coordination; convergence
          at the abstract envelope is not evidence of a physical common bus.
    phase_4_building:
      equipment_by_verb:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s07_building_power_train
        title: From campus MV to protected building AC
        purpose: >-
          Locate the unit substation, switchgear, UPS, and busway while following
          each equipment function toward a rack position.
        boundary: >-
          This is a generic building-power reference, not the unpublished
          Abilene as-built equipment lineup, redundancy topology, protection
          study, or commissioning record.
    phase_5_compute:
      orient_inside_rack:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s08_rack_voltage_descent
        title: Rack AC becomes core voltage
        purpose: >-
          Move from room-scale distribution through the rack power shelf and
          board regulation to the processor die.
        boundary: >-
          Product evidence supports the platform family and a nominal rack-DC
          boundary, but not the Abilene rack input, board rails, installed
          topology, power allocation, utilization, or useful output.
    phase_6_heat:
      rack_cooling_split:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s10_two_rack_heat_paths
        title: One rack, two heat paths
        purpose: >-
          Separate direct-liquid component heat from the residual rack heat
          that enters the air path.
        boundary: >-
          The platform documentation supports distinct liquid and air
          categories, not an Abilene as-built rack configuration or a
          quantitative heat split.
      technology_loop:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s11_technology_loop
        title: Supply and return are different pipes
        purpose: >-
          Follow cold-plate heat into the technology return while keeping the
          coolant supply path physically distinct.
        boundary: >-
          The technology-loop relationship is a design reference; Abilene
          routing, setpoints, flow, temperature, pressure, and operating state
          are not established.
      cdu_boundary:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s12_cdu_boundary
        title: The CDU is a boundary, not a magic box
        purpose: >-
          Locate the conditional heat-exchange boundary between technology and
          facility liquid loops without collapsing them into one circuit.
        boundary: >-
          A CDU is a generic conditional interface in this view; public
          evidence does not establish its Abilene presence, arrangement,
          redundancy, or operating conditions.
      parallel_residual_air:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s13_residual_air_branch
        title: Residual air takes a parallel route
        purpose: >-
          Trace non-liquid-cooled rack heat through the room-air branch toward
          the facility heat-removal system.
        boundary: >-
          The residual-air mechanism is generic; Abilene CRAH or fan-wall
          selection, airflow path, controls, capacity, and operating state are
          not publicly established.
      facility_heat_rejection:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s14_facility_heat_rejection
        title: The facility loop carries heat to the plant
        purpose: >-
          Follow the evidenced liquid-side duty to the air-cooled rejection
          terminal while locating any residual-air contribution at a separate,
          generic, conditional facility handoff.
        boundary: >-
          The selected facility-loop and air-cooled-terminal concepts are
          evidenced. A residual-air connection into that facility path is
          generic and unresolved, not established at Abilene; detailed
          interfaces, capacities, redundancy, setpoints, and measured operating
          performance also remain unknown.
      water_accounting:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s15_water_accounting
        title: Closed loop does not mean water-free
        purpose: >-
          Keep rejection-process water, initial fill, maintenance additions,
          and measured operating water use as four separate accounts.
        boundary: >-
          Public design material identifies categories, not a complete measured
          Abilene operating-water balance or proof that every category is zero.
      whole_journey_closure:
        artifact: diagram/course.html
        view_kind: segment
        view_id: s16_close_atmosphere
        title: The figure-eight closes in the atmosphere
        purpose: >-
          Reconnect component heat, both cooling branches, the facility loop,
          and the atmospheric sink before rereading the full six-phase journey.
        boundary: >-
          This is a conceptual closure of energy flow, not an Abilene as-built
          cooling topology, measured energy balance, or claim that all source
          branches form one traced physical path.

phases:
  - id: phase_1_generation
    number: 1
    verb: Generate
    title: Make electricity
    question: Where can an electrical watt come from?
    manifest: course/pilots/phase1_generation.yaml
    artifact: diagram/phase1_generation.html
    carrier_in: primary-energy source options
    carrier_out: generation-side electrical interfaces

  - id: phase_2_transmission
    number: 2
    verb: Transmit
    title: Move and connect electricity
    question: Why can a gigawatt not simply travel down an ordinary wire?
    manifest: course/pilots/phase2_transmission.yaml
    artifact: diagram/phase2_transmission.html
    carrier_in: generator terminals and bulk-grid sources
    carrier_out: grid-delivered electrical service

  - id: phase_3_campus
    number: 3
    verb: Campus
    title: Distribute and protect electricity
    question: >-
      Once power reaches the property, how can it serve multiple buildings
      without one disturbance becoming a campus-wide failure?
    manifest: course/pilots/phase3_campus.yaml
    artifact: diagram/phase3_campus.html
    carrier_in: grid service and a separately evidenced onsite source
    carrier_out: protected building feeders

  - id: phase_4_building
    number: 4
    verb: Building
    title: Deliver protected power to the rack
    question: What must happen between a campus feeder and a rack position?
    manifest: course/pilots/phase4_building.yaml
    artifact: diagram/phase4_building.html
    carrier_in: building-feeder electrical service
    carrier_out: rack-position facility AC

  - id: phase_5_compute
    number: 5
    verb: Compute
    title: Convert facility power into useful work
    question: >-
      What must happen before facility AC can switch transistors and produce
      useful compute?
    manifest: course/pilots/phase5_compute.yaml
    artifact: diagram/phase5_compute.html
    carrier_in: rack-position facility AC
    carrier_out: information processing and equipment heat

  - id: phase_6_heat
    number: 6
    verb: Reject heat
    title: Reject heat
    question: How does heat get from silicon back to the atmosphere?
    manifest: course/pilots/phase6_heat.yaml
    artifact: diagram/phase6_heat.html
    carrier_in: equipment and room heat
    carrier_out: heat rejected to the atmosphere

synthesis:
  id: whole_system_synthesis
  title: Re-read the completed journey
  body: >-
    The engineered service chain can now be inspected through three
    system-level questions without pretending that every branch is one traced
    physical path or inventing an additional physical phase.
  lenses:
    - id: delivery_constraint
      title: Where does delivery actually bind?
      question: >-
        Which evidenced physical, interconnection, construction, equipment, or
        operating gate currently limits the usable path?
      phase_readings:
        phase_1_generation: >-
          Ask whether the selected source has crossed permit, installation,
          commissioning, and measured-output gates at an electrical interface.
        phase_2_transmission: >-
          Ask whether interconnection, voltage transformation, transfer
          equipment, and energized grid service establish deliverable power
          rather than a nameplate total.
        phase_3_campus: >-
          Ask whether independent source and feeder branches, protective
          interruption, and isolation conditions actually preserve service
          after a disturbance.
        phase_4_building: >-
          Ask whether building equipment and A/B paths can deliver facility AC
          to the particular rack, including compatible load interfaces and
          maintenance isolation.
        phase_5_compute: >-
          Ask whether rack and board conversion, installed accelerators,
          workload activity, and measured operating demand turn facility power
          into useful work.
        phase_6_heat: >-
          Ask whether component, liquid, residual-air, facility-loop, and
          atmospheric-rejection boundaries can remove heat under actual
          operating conditions.

    - id: ownership_and_risk
      title: Who owns the handoff and its risk?
      question: >-
        Who builds, owns, finances, operates, and bears utilization risk at
        each boundary?
      phase_readings:
        phase_1_generation: >-
          Separate generator owner and operator, fuel supply, storage, standby,
          and contractual-attribute roles before assigning physical delivery.
        phase_2_transmission: >-
          Separate generator, transmission owner and operator, grid operator,
          interconnection customer, and site roles at each electrical boundary.
        phase_3_campus: >-
          Separate utility service, campus sources, campus distribution,
          building feeder, and protective-device ownership; keep the source
          merge unknown where evidence is absent.
        phase_4_building: >-
          Separate campus-feeder, building power-train, maintenance, and IT
          load-interface responsibility.
        phase_5_compute: >-
          Separate facilities power, rack hardware, platform operation, and
          workload ownership before assigning output or utilization risk.
        phase_6_heat: >-
          Separate IT cooling loop, facility loop, air-side cooling,
          heat-rejection plant, and water-account responsibility.

    - id: usable_compute
      title: How much capacity becomes useful compute?
      question: >-
        Which measured inputs are required before announced power or hardware
        can become an evidence-backed useful-compute estimate?
      phase_readings:
        phase_1_generation: >-
          Generation MW is only a source-side rating; it is not delivered IT
          power, accelerators, workload activity, or useful output.
        phase_2_transmission: >-
          Grid ratings and interconnection capacity are not current site demand
          or rack power.
        phase_3_campus: >-
          Campus service and feeder capability are not the count of energized
          buildings, racks, accelerators, or live workloads.
        phase_4_building: >-
          Power at a rack position is not board input, processor-rail power,
          active silicon, or useful workload output.
        phase_5_compute: >-
          An estimate requires measured electrical inputs, installed hardware,
          workload configuration, and observed throughput or utilization on the
          same basis.
        phase_6_heat: >-
          Cooling capacity and design posture constrain availability but do not
          quantify useful compute; use measured operating power, thermal state,
          and output.
