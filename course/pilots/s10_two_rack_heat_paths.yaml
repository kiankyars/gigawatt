schema_version: 1
segment_id: s10_two_rack_heat_paths
camera_anchor: data_hall_rack
purpose: >-
  Give the instructor four coarse, manually selected comparisons for the
  product/design-referenced rack cooling split without extending the segment
  beyond its canonical evidence boundary.

transformations:
  - id: rack_context
    title: One rack, two heat paths
    instruction: >-
      Introduce the rack-package boundary and identify both heat-removal
      branches without extending either path beyond this segment's scope.
    focus_nodes: [die, rack_air_load, cold_plate, rack_manifold]
    focus_edges:
      - die_to_cold_plate_heat
      - cold_plate_to_manifold_return
      - manifold_to_cold_plate_supply
    pulse_edges: []

  - id: liquid_cooled_compute
    title: Liquid-cooled compute
    instruction: >-
      Isolate the product/design-referenced liquid branch: die heat enters the
      cold plate, while technology-loop supply and return remain distinct at
      the rack manifold.
    focus_nodes: [die, cold_plate, rack_manifold]
    focus_edges:
      - die_to_cold_plate_heat
      - cold_plate_to_manifold_return
      - manifold_to_cold_plate_supply
    pulse_edges:
      - manifold_to_cold_plate_supply
      - die_to_cold_plate_heat
      - cold_plate_to_manifold_return

  - id: air_cooled_auxiliaries
    title: Air-cooled auxiliaries
    instruction: >-
      Isolate the documented air-cooled rack auxiliaries. Stop at the
      rack-package boundary; no CRAH or site-specific downstream path is
      asserted here.
    focus_nodes: [rack_air_load]
    focus_edges: []
    pulse_edges: []

  - id: compare_paths
    title: Compare the two paths
    instruction: >-
      Compare both branches in the same rack package. Do not infer a
      quantitative heat split or promote the reference design to the site's
      as-built configuration.
    focus_nodes: [die, rack_air_load, cold_plate, rack_manifold]
    focus_edges:
      - die_to_cold_plate_heat
      - cold_plate_to_manifold_return
      - manifold_to_cold_plate_supply
    pulse_edges: []
