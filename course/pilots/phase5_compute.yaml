schema_version: 1

id: phase5_compute
title: How facility power becomes useful compute

phase:
  id: phase_5_compute
  number: 5
  title: Convert facility power into useful work
  anchor_question: >-
    What must happen before facility AC can switch transistors and produce
    useful compute?

learning_objective: >-
  Orient the rack-scale power path, distinguish facility AC from rack DC and
  processor point-of-load rails, explain why useful compute is not determined
  by facility power alone, trace correlated demand toward the site and grid,
  and preserve the limits of the Abilene operating evidence.

evidence_files:
  electrical_engineering: evidence/electrical_engineering.yaml
  abilene: evidence/abilene.yaml
  abilene_execution: evidence/abilene_execution.yaml
  commercial_compute: evidence/commercial_compute.yaml
  delivery_resilience: evidence/delivery_resilience.yaml
  thermal_engineering: evidence/thermal_engineering.yaml

interaction:
  mode: manual
  advance: instructor_controlled

canvas:
  kind: compute_power_descent_v1
  width: 1600
  height: 900
  contract:
    state_selection: exclusive_single_primary_layer
    primary_layers:
      - rack_orientation
      - rack_power_conversion
      - processor_point_of_load
      - compute_demand_loop
      - abilene_mapping
    evidence_binding: content_record_fact_refs
    geometry_owner: compute_power_descent_renderer
    handoff_requires: abilene_mapping

rack_orientation:
  title: Move from the data hall scale to the processor scale
  body: >-
    Treat the rack as a nested electrical system. The visual descends from the
    building distribution boundary through a rack power shelf and compute
    tray or board to processor point-of-load conversion. It does not assign an
    Abilene rack count, populated configuration, or internal board layout.
  layers:
    - id: data_hall_boundary
      title: Data hall distribution boundary
      contains:
        - Busway or other building distribution path
        - Tap-off toward a rack position
      carrier: facility AC
      fact_refs:
        - electrical_engineering:busway_feeder_and_plugin_distribution_role

    - id: rack_envelope
      title: Rack envelope
      contains:
        - Rack power-shelf boundary
        - Rack DC distribution boundary
        - Compute trays
      carrier: AC at the shelf input; DC after rack conversion
      boundary: >-
        NVIDIA's documented rack configuration is a product reference, not an
        Abilene installed quantity, measured draw, or operating configuration.
      fact_refs:
        - commercial_compute:dgx_gb_nvl72_product_reference
        - abilene:rack_power_shelf_output_vdc
        - abilene_execution:operating_rack_configuration

    - id: board_and_die
      title: Board and processor boundary
      contains:
        - Intermediate DC bus
        - Voltage-regulator modules
        - Processor power rails
        - GPU or other high-power processor
      carrier: progressively lower-voltage DC toward the processor
      boundary: >-
        This is a generic point-of-load teaching stack, not a disclosed GB200
        board topology or numerical Abilene rail value.
      fact_refs:
        - electrical_engineering:vrm_intermediate_bus_to_xpu_voltage_role
        - electrical_engineering:xpu_low_voltage_high_current_requirement
        - electrical_engineering:multiphase_processor_core_power_role
        - abilene_execution:rack_site_core_voltage

  orientation_boundary:
    id: nested_not_as_built
    title: Product and generic layers do not produce a site one-line
    body: >-
      The rack family and conversion functions can be taught while exact shelf
      input, board arrangement, populated trays, and site rail values remain
      unresolved.
    fact_refs:
      - abilene:rack_power_shelf_ac_input_voltage_v
      - abilene_execution:operating_rack_configuration
      - abilene_execution:rack_site_core_voltage

rack_power_conversion:
  title: A rack power shelf converts facility AC to a rack DC bus
  body: >-
    Keep the carrier boundary explicit: facility AC reaches the rack power
    shelf, conversion occurs inside the documented product boundary, and a
    nominal DC bus leaves the shelf for downstream rack distribution.
  steps:
    - id: facility_ac_input
      title: Facility AC input
      verb: enter the rack power-shelf boundary
      value_posture: site_value_withheld
      boundary: >-
        NVIDIA specifies supported product inputs, but the evidence ledger does
        not establish which AC input voltage is used at Abilene.
      fact_refs:
        - abilene:rack_power_shelf_ac_input_voltage_v

    - id: rack_power_shelf
      title: Rack power shelf
      verb: convert AC to the documented rack DC output
      value_posture: manufacturer_product_reference
      fact_refs:
        - abilene:rack_power_shelf_output_vdc

    - id: rack_dc_bus
      title: Rack DC bus
      verb: carry the shelf output toward compute trays
      value_posture: manufacturer_product_reference
      fact_refs:
        - abilene:rack_power_shelf_output_vdc
        - commercial_compute:dgx_gb_nvl72_product_reference

  conversion_boundary:
    id: product_value_not_site_measurement
    body: >-
      The nominal rack-shelf DC output is manufacturer documentation. It is not
      an Abilene measurement, rack-count multiplier, facility-load estimate, or
      evidence of the site's shelf input and internal operating point.
    fact_refs:
      - abilene:rack_power_shelf_output_vdc
      - abilene:rack_power_shelf_ac_input_voltage_v
      - abilene_execution:operating_rack_configuration

processor_point_of_load:
  title: Board-level converters create precise processor rails
  body: >-
    The rack DC boundary is not the processor core voltage. Point-of-load
    conversion steps the intermediate bus down again and supplies the precise,
    low-voltage, high-current rails required by high-power processors.
  steps:
    - id: intermediate_bus
      title: Intermediate board-level DC
      verb: arrive at the point-of-load conversion boundary
      value_posture: numerical_value_not_asserted
      fact_refs:
        - electrical_engineering:vrm_intermediate_bus_to_xpu_voltage_role

    - id: multiphase_vrm
      title: Multiphase voltage-regulator stage
      verb: step down voltage and share high processor current across phases
      value_posture: generic_product_architecture
      fact_refs:
        - electrical_engineering:vrm_intermediate_bus_to_xpu_voltage_role
        - electrical_engineering:multiphase_processor_core_power_role

    - id: processor_rails
      title: Processor rails
      verb: deliver precise low-voltage, high-current power to the processor
      value_posture: numerical_value_not_asserted
      fact_refs:
        - electrical_engineering:xpu_low_voltage_high_current_requirement

    - id: active_processor
      title: Active processor
      verb: use electrical power to execute the selected workload
      value_posture: workload_specific_output
      boundary: >-
        Product identity and peak capability do not establish active utilization,
        model configuration, throughput, or useful output.
      fact_refs:
        - commercial_compute:training_mfu_definition
        - commercial_compute:inference_measurement_boundary
        - commercial_compute:mw_to_tokens_scenario_recipe

  point_of_load_boundary:
    id: no_universal_or_site_rail
    body: >-
      No universal processor rail value is supplied, and the exact Abilene
      board-level voltage remains unestablished.
    fact_refs:
      - electrical_engineering:xpu_low_voltage_high_current_requirement
      - abilene_execution:rack_site_core_voltage

compute_demand_loop:
  title: Useful computation and upstream power demand are linked but not interchangeable
  body: >-
    Read the same system in two directions. Forward, facility electricity is
    narrowed through IT and accelerator boundaries into active computation and
    workload output. Upstream, correlated processor demand aggregates through
    rack, building, and campus electrical paths into the site load seen by the
    grid. This reverse view is a demand signature, not reverse electrical flow.
  forward_allocation:
    - id: facility_power
      title: Facility electrical input
      boundary: Includes IT equipment and non-IT facility loads.
      fact_refs:
        - commercial_compute:pue_energy_boundary

    - id: it_power
      title: IT-equipment boundary
      boundary: >-
        Facility power does not determine IT power without matching metering or
        a boundary-consistent PUE relationship.
      fact_refs:
        - commercial_compute:pue_energy_boundary
        - commercial_compute:facility_energy_to_it_energy_recipe

    - id: accelerator_power
      title: Accelerator electrical boundary
      boundary: >-
        IT power does not determine accelerator power without a measured share
        or matching inventory and power evidence.
      fact_refs:
        - commercial_compute:mw_to_tokens_scenario_recipe

    - id: active_compute
      title: Active computation
      boundary: >-
        Hardware capability does not determine active useful work without a
        model, workload, software, utilization, and measurement boundary.
      fact_refs:
        - commercial_compute:training_mfu_definition
        - commercial_compute:inference_measurement_boundary
        - commercial_compute:mw_to_tokens_scenario_recipe

    - id: useful_output
      title: Useful workload output
      boundary: >-
        Tokens or other output require a workload-specific measured or fully
        qualified scenario path; facility MW alone is insufficient.
      fact_refs:
        - commercial_compute:dense_decoder_training_tokens_recipe
        - commercial_compute:inference_tokens_recipe
        - commercial_compute:mw_to_tokens_scenario_recipe

  upstream_demand:
    - id: synchronized_work
      title: Correlated parallel computation
      body: >-
        Parallel work can correlate processor-level power variations so they
        become significant at the site-demand boundary.
      fact_refs:
        - delivery_resilience:parallel_ai_load_correlation

    - id: aggregation_path
      title: Processor -> board -> rack -> building -> campus
      body: >-
        The visual aggregates demand toward the site boundary while withholding
        a universal magnitude, waveform, and site topology.
      fact_refs:
        - delivery_resilience:parallel_ai_load_correlation
        - delivery_resilience:google_synchronized_ml_fluctuation_observation

    - id: grid_facing_load
      title: Site demand seen by the grid
      body: >-
        Large power-electronic load changes can challenge balancing, voltage,
        and frequency control when their behavior outpaces available response.
      fact_refs:
        - delivery_resilience:large_load_grid_response_mismatch

  demand_boundary:
    id: external_observation_not_abilene_trace
    body: >-
      The correlation mechanism is generic, and Google's operating observation
      comes from its own clusters. Neither establishes an Abilene waveform,
      magnitude, recurrence pattern, or grid response.
    fact_refs:
      - delivery_resilience:parallel_ai_load_correlation
      - delivery_resilience:google_synchronized_ml_fluctuation_observation
      - delivery_resilience:abilene_operating_transient_profile

abilene_mapping:
  title: Abilene confirms the platform and live work, not the operating power model
  known:
    - id: platform_family
      title: Platform family
      body: >-
        NVIDIA GB200 is the supported first-phase rack-platform family; the
        NVL72 statement remains a building design reference rather than an
        installed configuration or count.
      fact_refs:
        - abilene:rack_platform
        - abilene:rack_platform_nvl72_design_reference

    - id: rack_delivery
      title: First rack deliveries
      body: >-
        Crusoe reports that the first NVIDIA GB200 racks were delivered in June
        2025 without disclosing the delivered or operating count.
      fact_refs:
        - abilene_execution:gb200_first_rack_delivery_month
        - abilene_execution:operating_rack_configuration

    - id: live_compute
      title: Early training and inference
      body: >-
        Public evidence confirms early training and inference on operating
        Abilene capacity while leaving the exact first-live date unresolved.
      fact_refs:
        - commercial_compute:abilene_compute_activity_roles
        - abilene:early_training_inference_live_by
        - abilene:exact_workload_start_date

  unknown:
    - id: rack_and_rail_configuration
      title: Rack and electrical configuration
      body: >-
        Exact operating rack variant and count, populated trays, shelf input,
        power configuration, and board-level processor rail remain unestablished.
      fact_refs:
        - abilene:rack_power_shelf_ac_input_voltage_v
        - abilene_execution:operating_rack_configuration
        - abilene_execution:rack_site_core_voltage

    - id: power_allocation
      title: Facility-to-accelerator power allocation
      body: >-
        Current facility power, IT power, PUE, accelerator count, usable
        accelerator power, accelerator share, and active utilization have no
        evidence-backed Abilene values.
      fact_refs:
        - commercial_compute:abilene_current_facility_power_mw
        - commercial_compute:abilene_current_it_power_mw
        - commercial_compute:abilene_current_pue
        - commercial_compute:abilene_installed_accelerator_count
        - commercial_compute:abilene_usable_accelerator_power_mw
        - commercial_compute:abilene_accelerator_power_share
        - commercial_compute:abilene_accelerator_active_utilization

    - id: workload_and_output
      title: Workload configuration and useful output
      body: >-
        Public evidence does not establish the operating model and workload,
        training utilization, inference batching, or measured token throughput.
      fact_refs:
        - commercial_compute:abilene_training_mfu
        - commercial_compute:abilene_model_and_workload_configuration
        - commercial_compute:abilene_inference_batching_configuration
        - commercial_compute:abilene_measured_token_throughput

    - id: site_demand_waveform
      title: Correlated operating demand
      body: >-
        No Abilene operating trace establishes synchronized-demand magnitude,
        ramp, recurrence, or grid-facing response.
      fact_refs:
        - delivery_resilience:abilene_operating_transient_profile

  mapping_guard:
    id: no_product_to_site_promotion
    body: >-
      Product documentation supports the conceptual conversions. It must not be
      multiplied by an assumed rack count or promoted into site input voltage,
      processor rail, current load, useful output, or transient behavior.
    fact_refs:
      - abilene:rack_power_shelf_output_vdc
      - abilene_execution:operating_rack_configuration
      - commercial_compute:abilene_current_facility_power_mw
      - commercial_compute:abilene_measured_token_throughput
      - delivery_resilience:abilene_operating_transient_profile

phase6_handoff:
  title: Computation is the desired output; heat creates the cooling obligation
  body: >-
    Most electrical power consumed by information-technology equipment becomes
    heat that cooling systems must remove. Phase 6 begins at component heat and
    explains the removal paths from rack equipment to the atmosphere.
  carriers:
    - id: useful_compute_output
      title: Desired output
      carrier: training or inference work
      boundary: >-
        Abilene confirms early activity but not model, utilization, throughput,
        or a numerical useful-compute fraction.
      fact_refs:
        - commercial_compute:abilene_compute_activity_roles
        - commercial_compute:abilene_measured_token_throughput

    - id: processor_heat
      title: Unavoidable thermal output
      carrier: heat from information-technology electrical input
      boundary: >-
        The generic energy balance is not a per-die heat fraction or an Abilene
        measured thermal load.
      fact_refs:
        - thermal_engineering:generic_ite_electrical_input_heat

    - id: liquid_and_air_split
      title: Next-phase branch point
      carrier: liquid-cooled processor path and residual air-cooled rack path
      boundary: >-
        NVIDIA product documentation identifies liquid-cooled CPU/GPU components
        and air-cooled auxiliary components; Phase 6 must still preserve the
        Abilene as-built cooling-interface unknowns.
      fact_refs:
        - abilene:rack_liquid_cooled_components
        - abilene:rack_air_cooled_components
        - abilene:cooling_direct_to_chip_design
        - abilene_execution:facility_cooling_interfaces_as_built

evidence_gaps:
  - id: abilene_internal_rack_power_path
    gap: >-
      Current evidence does not expose the exact operating rack population,
      shelf input, board topology, processor rail values, or site power train.
    renderer_guard: >-
      Keep internal product conversion generic and show every site-specific
      electrical value as unresolved.
    related_fact_refs:
      - abilene:rack_power_shelf_ac_input_voltage_v
      - abilene_execution:operating_rack_configuration
      - abilene_execution:rack_site_core_voltage
      - abilene_execution:building_power_train_as_built_configuration

  - id: abilene_power_to_useful_compute_measurement
    gap: >-
      The public record supplies no complete measured allocation from facility
      power through IT and accelerator power to workload output.
    renderer_guard: Do not produce an MW-to-rack, GPU, FLOP, or token estimate.
    related_fact_refs:
      - commercial_compute:abilene_current_facility_power_mw
      - commercial_compute:abilene_current_it_power_mw
      - commercial_compute:abilene_installed_accelerator_count
      - commercial_compute:abilene_usable_accelerator_power_mw
      - commercial_compute:abilene_measured_token_throughput

  - id: abilene_correlated_demand_trace
    gap: >-
      External observations establish the mechanism but not an Abilene
      operating waveform or grid-facing response.
    renderer_guard: >-
      Show only a qualitative demand aggregation, with no magnitude,
      recurrence, or site response claim.
    related_fact_refs:
      - delivery_resilience:parallel_ai_load_correlation
      - delivery_resilience:abilene_operating_transient_profile

states:
  - id: orient_inside_rack
    nav_label: Rack
    title: Descend from the data hall boundary to the processor
    instruction: >-
      Reveal the data-hall boundary, rack envelope, and board/die boundary as
      nested scales without introducing site quantities or rail values.
    orientation_layer_ids: [data_hall_boundary, rack_envelope, board_and_die]
    rack_conversion_step_ids: []
    point_of_load_step_ids: []
    show_compute_demand_loop: false
    abilene_known_ids: []
    abilene_unknown_ids: []
    show_phase6_handoff: false

  - id: facility_ac_to_rack_dc
    nav_label: Rack power
    title: Convert facility AC into the documented rack DC boundary
    instruction: >-
      Follow facility AC into the rack shelf and reveal the manufacturer DC
      output while keeping the Abilene shelf input and operating point unknown.
    orientation_layer_ids: [rack_envelope]
    rack_conversion_step_ids: [facility_ac_input, rack_power_shelf, rack_dc_bus]
    point_of_load_step_ids: []
    show_compute_demand_loop: false
    abilene_known_ids: []
    abilene_unknown_ids: []
    show_phase6_handoff: false

  - id: board_point_of_load
    nav_label: Processor rails
    title: Step rack DC down again at the board
    instruction: >-
      Follow intermediate DC through multiphase voltage regulation to precise
      low-voltage, high-current processor rails without adding numerical values.
    orientation_layer_ids: [board_and_die]
    rack_conversion_step_ids: [rack_dc_bus]
    point_of_load_step_ids: [intermediate_bus, multiphase_vrm, processor_rails, active_processor]
    show_compute_demand_loop: false
    abilene_known_ids: []
    abilene_unknown_ids: []
    show_phase6_handoff: false

  - id: useful_compute_and_upstream_demand
    nav_label: Compute
    title: Useful output and grid-facing demand are two views of the same work
    instruction: >-
      Read forward from facility input to workload output, then trace correlated
      demand upstream as aggregation rather than reverse electrical flow.
    orientation_layer_ids: []
    rack_conversion_step_ids: []
    point_of_load_step_ids: [active_processor]
    show_compute_demand_loop: true
    abilene_known_ids: []
    abilene_unknown_ids: []
    show_phase6_handoff: false

  - id: abilene_compute_boundary
    nav_label: Abilene
    title: Keep the platform facts and the operating unknowns separate
    instruction: >-
      Show platform family, delivery, and early workload evidence, then expose
      the missing rack, rail, power-allocation, workload, output, and waveform data.
    orientation_layer_ids: [rack_envelope, board_and_die]
    rack_conversion_step_ids: [facility_ac_input, rack_power_shelf, rack_dc_bus]
    point_of_load_step_ids: [multiphase_vrm, processor_rails, active_processor]
    show_compute_demand_loop: false
    abilene_known_ids: [platform_family, rack_delivery, live_compute]
    abilene_unknown_ids:
      - rack_and_rail_configuration
      - power_allocation
      - workload_and_output
      - site_demand_waveform
    show_phase6_handoff: false

  - id: heat_carrier_handoff
    nav_label: Heat
    title: Close Phase 5 at the thermal-obligation boundary
    instruction: >-
      Keep computation as the desired output, identify heat as the thermal
      obligation created by IT electrical use, and introduce the liquid and
      residual-air removal paths that Phase 6 will explain.
    orientation_layer_ids: [board_and_die]
    rack_conversion_step_ids: []
    point_of_load_step_ids: [active_processor]
    show_compute_demand_loop: false
    abilene_known_ids: [platform_family, live_compute]
    abilene_unknown_ids: [rack_and_rail_configuration]
    show_phase6_handoff: true
