schema_version: 1

id: phase2_transmission
title: How a gigawatt reaches the campus

phase:
  id: phase_2_transmission
  number: 2
  title: Move and connect electricity
  anchor_question: Why can a gigawatt not simply travel down an ordinary wire?

learning_objective: >-
  Explain why transmission uses high voltage, read the grid as a meshed and
  continuously balanced system, identify the functions inside a substation,
  separate generator interconnection from ERCOT large-load integration, and map
  the two evidenced Abilene grid-service paths without inventing their campus
  merge.

evidence_files:
  generation_transmission: evidence/generation_transmission.yaml
  abilene: evidence/abilene.yaml
  abilene_execution: evidence/abilene_execution.yaml

interaction:
  mode: manual
  advance: instructor_controlled

canvas:
  kind: transmission_landscape_v1
  width: 1600
  height: 900
  contract:
    state_selection: exclusive_single_primary_layer
    primary_layers:
      - transmission_principles
      - substation_anatomy
      - interconnection_processes
      - abilene_case
    evidence_binding: content_record_fact_refs
    geometry_owner: transmission_landscape_renderer
    handoff_requires: abilene_case

transmission_principles:
  - id: voltage_transfer
    title: Higher voltage moves the same power with less current
    body: >-
      Hold transferred power constant: raising voltage lowers current, and lower
      current reduces current-squared conductor loss. This is a qualitative
      transmission motivation, not a voltage choice or loss estimate.
    comparison:
      fixed: Same transferred power
      lower_voltage:
        voltage: Lower voltage
        current: Higher current
        conductor_loss: Higher relative resistive loss
      higher_voltage:
        voltage: Higher voltage
        current: Lower current
        conductor_loss: Lower relative resistive loss
      relation: voltage up → current down → current-squared loss down
    fact_refs:
      - generation_transmission:high_voltage_reduces_current_and_resistive_loss

  - id: meshed_ac_network
    title: Transmission is a network, not one dedicated source-to-load wire
    body: >-
      An interconnected AC network can provide multiple physical paths between
      areas. How power distributes over them follows network physics and may
      change with topology or impedance controls; this view does not assign a
      physical route to Abilene.
    visual:
      source_labels: [Generator A, Generator B, Generator C]
      network_labels: [Transmission node 1, Transmission node 2, Transmission node 3]
      load_labels: [Regional loads, Large campus load]
      path_posture: multiple_possible_paths
    fact_refs:
      - generation_transmission:ac_meshed_network_flow_behavior

  - id: continuous_system_balance
    title: The system must balance aggregate supply and demand
    body: >-
      A balancing authority continually coordinates its portion of the power
      system so electricity supply matches electricity demand. This is not a
      reserve quantity, dispatch instruction, response requirement, or campus
      service guarantee.
    visual:
      operator_label: Balancing authority
      supply_label: Aggregate generation
      demand_label: Aggregate load
      relation: supply ↔ demand
    fact_refs:
      - generation_transmission:balancing_authority_matches_supply_and_demand

substation_anatomy:
  title: A substation is a transform, protect, control, and delivery gate
  body: >-
    The station is not a single transformer. Its functional envelope combines
    voltage transformation, interruption, isolation, protection,
    instrumentation, control, and outgoing delivery.
  functions:
    - Transform voltage
    - Interrupt current
    - Isolate equipment
    - Detect and clear faults
    - Measure system conditions
    - Control switching
    - Feed outgoing circuits
  boundary: >-
    Generic functional anatomy only; it does not identify Abilene equipment,
    protection zones, switching state, or operating configuration.
  fact_refs:
    - generation_transmission:substation_is_transform_protect_control_gate

interconnection_processes:
  title: Connecting a generator and connecting a large load are different gates
  lanes:
    - id: generator_interconnection
      title: Generator-side interconnection
      subject: Large generating facility under the FERC pro forma scope
      gate: FERC-jurisdictional large-generator study and connection process
      body: >-
        The pro forma lane applies to generating facilities above 20 MW. FERC
        Order No. 2023 also reforms broader transmission-provider processes used
        to study and connect generating facilities, including many storage
        projects, to transmission.
      gates:
        - Valid request with required project data and readiness items
        - Cluster study and any applicable affected-system studies
        - Facilities study defining equipment, interconnection facilities, network upgrades, construction work, and cost
        - Executed or unexecuted-filed Large Generator Interconnection Agreement
        - Agreed interconnection and network-upgrade construction work
      boundary: >-
        This is not ERCOT Batch Zero, an Abilene project record, or a universal
        project schedule.
      fact_refs:
        - generation_transmission:generator_interconnection_rule_scope
        - generation_transmission:ferc_large_generator_interconnection_coarse_gates

    - id: ercot_large_load_integration
      title: ERCOT large-load integration
      subject: Qualifying load facility
      gate: ERCOT Batch Zero large-load process
      body: >-
        As accessed on 2026-08-31, ERCOT's Batch Zero process addresses
        qualifying load facilities of 75 MW or greater seeking to connect to the
        ERCOT system.
      gates:
        - Eligibility plus project data, dynamic models, and a preliminary Load Commissioning Plan
        - System-wide steady-state and stability screening
        - Peak-demand allocation, identified transmission improvements, and interconnection-agreement commitment
        - Refinement of needed improvements plus short-circuit study
        - ERCOT-established pre-energization conditions, including applicable model, telemetry, stability, SSO, and current-plan requirements
      status_note:
        label: Current public posture through 2026-08-21
        body: >-
          Batch Zero became effective on 2026-07-11. The classifications
          contemplated for 2026-08-07 were not issued after a required
          verification step; the PUCT granted near-term exceptions on
          2026-08-20; and ERCOT stated on 2026-08-21 that it intended to issue
          conditional classifications by 2026-08-31. That intention is not
          evidence that conditional or final classifications were issued.
        fact_refs:
          - generation_transmission:ercot_batch_zero_current_timeline_posture
      boundary: >-
        The threshold and process posture are dated evidence, not a timeless rule,
        intact original schedule, approval, constructed-upgrade claim, or
        allowed-MW claim for Abilene.
      fact_refs:
        - generation_transmission:ercot_large_load_process_scope
        - generation_transmission:ercot_batch_zero_large_load_coarse_gates

  case_boundary:
    title: The public Abilene record does not expose its complete queue or service record
    body: >-
      Do not infer a queue position, executed agreement, contracted service MW,
      approved ramp, or current site load from the generic process lanes.
    fact_refs:
      - abilene_execution:site_specific_interconnection_queue_and_contract_record
      - abilene_execution:contracted_grid_service_capacity_mw
      - abilene_execution:current_total_facility_load_mw
      - abilene_execution:current_critical_it_load_mw

abilene_case:
  title: Two evidenced grid-service paths stop at an unknown campus merge
  paths:
    - id: initial_138
      title: Initial path — 200 MW / 138 kV station
      steps:
        - AEP Abilene Northwest transmission line
        - 300 ft slack-span tie
        - Initial 200 MW / 138 kV station
        - Campus electrical boundary
      status: >-
        The cited project evidence describes the initial grid-service path as
        operating as of 2026-08-25; it does not establish current campus load.
      fact_refs:
        - abilene:grid_initial_source_line
        - abilene:grid_initial_slack_span_length_ft
        - abilene:grid_initial_substation_voltage_kv
        - abilene:grid_initial_substation_capacity_mw
        - abilene:grid_initial_service_operational_as_of
        - abilene_execution:current_total_facility_load_mw

    - id: expansion_345
      title: Expansion path — 1 GW / 345 kV substation
      steps:
        - Upstream energized source line not established in the topology evidence
        - Separate 345 kV service path
        - Expansion 1 GW / 345 kV substation
        - Campus electrical boundary
      status: >-
        Five main power transformers were reported energized by 2026-03-10. That
        dated milestone does not establish current campus load or the downstream
        source merge.
      fact_refs:
        - abilene:grid_expansion_upstream_line
        - abilene:grid_expansion_substation_voltage_kv
        - abilene:grid_expansion_substation_capacity_mw
        - abilene:grid_expansion_transformers_energized_count
        - abilene:grid_expansion_fully_energized_by
        - abilene_execution:current_total_facility_load_mw

  boundary:
    title: Keep the paths separate until the evidence can join them
    body: >-
      The available sources do not establish a shared as-built campus bus,
      feeder arrangement, switching state, secondary voltage, or exact merge of
      the initial, expansion, and behind-the-meter paths.
    fact_refs:
      - abilene:campus_source_merge_as_built_topology
      - abilene:campus_lpt_secondary_as_built_voltage_kv

phase3_handoff:
  title: Transmission ends at the campus distribution question
  body: >-
    Both evidenced grid paths stop at the campus boundary. Phase 3 asks how
    power fans out to buildings and how resilience layers protect the load
    while preserving the unknown campus merge.
  fact_refs:
    - abilene:campus_mv_reference_design_voltage_kv
    - abilene:campus_lpt_secondary_as_built_voltage_kv
    - abilene:campus_source_merge_as_built_topology

states:
  - id: why_voltage_rises
    nav_label: Voltage
    title: Why transmission raises voltage
    instruction: >-
      Compare lower- and higher-voltage transfer while holding power fixed. Do
      not introduce a site voltage, conductor design, or numerical loss claim.
    principle_ids: [voltage_transfer]
    show_substation: false
    process_lane_ids: []
    abilene_path_ids: []
    show_handoff: false

  - id: network_and_balance
    nav_label: Network
    title: The grid is a meshed and continuously balanced system
    instruction: >-
      Replace the dedicated-wire mental model with multiple possible physical
      paths and aggregate supply-demand balancing, without assigning an Abilene
      power-flow route.
    principle_ids: [meshed_ac_network, continuous_system_balance]
    show_substation: false
    process_lane_ids: []
    abilene_path_ids: []
    show_handoff: false

  - id: substation_gate
    nav_label: Substation
    title: Open the substation box
    instruction: >-
      Show the station as a functional envelope for transformation, interruption,
      isolation, protection, measurement, control, and outgoing delivery.
    principle_ids: []
    show_substation: true
    process_lane_ids: []
    abilene_path_ids: []
    show_handoff: false

  - id: generator_vs_large_load
    nav_label: Gates
    title: Generation and large-load connection are different processes
    instruction: >-
      Compare the two process lanes side by side, retain the ERCOT access date,
      and stop before making an Abilene queue, agreement, capacity, or load claim.
    principle_ids: []
    show_substation: false
    process_lane_ids: [generator_interconnection, ercot_large_load_integration]
    abilene_path_ids: []
    show_handoff: false

  - id: abilene_grid_paths
    nav_label: Abilene
    title: Map the separate 138 kV and 345 kV paths
    instruction: >-
      Compare the two evidenced service paths without extending either rating
      into current load or drawing their unknown campus merge.
    principle_ids: []
    show_substation: false
    process_lane_ids: []
    abilene_path_ids: [initial_138, expansion_345]
    show_handoff: false

  - id: campus_distribution_handoff
    nav_label: Campus
    title: The next problem begins behind the campus boundary
    instruction: >-
      Leave both grid paths at the unresolved campus interface and motivate the
      next phase: distribution to buildings and resilience across the campus.
    principle_ids: []
    show_substation: false
    process_lane_ids: []
    abilene_path_ids: [initial_138, expansion_345]
    show_handoff: true
