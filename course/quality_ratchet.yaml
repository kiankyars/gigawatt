schema_version: 1

hard_constraints:
  evidence_and_topology_remain_correct: true
  unknowns_remain_unknown: true
  forbidden_motion_patterns: [autoplay, micro_beats, generic_zoom]
  accessibility_must_pass: true
  deterministic_generation_must_pass: true
  forbidden_render_defects: [clipping, collisions, illegible_labels]

frozen_champion:
  git_sha: 9a76191764c9b2d998950069090548439dfc4007
  origin_sha: 9a76191764c9b2d998950069090548439dfc4007
  source_tree_aggregate_sha256: 737a7797e014a5daf2c64395ce6b9cc134d007d3c34e61013468cce58adf1aee
  baseline_test_count: 75
  baseline_runtime_source_digest: 224b79da0d4d3e4fd44e78e91efe8341633f732d1014729b13ee847e25e3f9e2
  artifact_sha256:
    diagram/course.html: b24659fb7d10c70cf450e1ae8168d764dba47ca7a803bd3b3a5dfa95211237c7
    diagram/course_runtime.json: e414be7d923525190eabebf66672906a31235a777889c9193a577053a32c8597
    diagram/planned_shots.html: 761823c86a73ece50faac1c1dd797f174c09de18f759d523c9801bce1548c4d0
    diagram/planned_shots.json: f5fdbc5e276bb856f073c19ed2a13dd59bb522d2722d15ec5660538f07ee105f
    course/INSTRUCTOR_PACKET.md: d70471737ba3c61a1593d5e76ad357f9d36e500cf737a10decc946e4af1e04a5

experiment_control:
  control_id: corrected_current_worktree_context_control
  provenance: synthetic model on the corrected current worktree
  frozen_champion_equivalent: false
  historical_viewport_captures_available: false
  visual_overrides: {}
  label_source: champion_context
  annotation_source: none

hypothesis_id: HYP-FOCUS-OVERLAY-01
hypothesis: Relative to the corrected experiment control, combining focused labels with claim-bound semantic overlays removes label pressure and dense-annotation gaps without changing facts, topology, order, or frames.

prerequisite_repairs:
  status: separate_correctness_candidate
  rationale: Evidence, topology, accessibility, and frame-derivation defects found during the audit must not be attributed to the visual hypothesis.
  frozen_champion_invariant_delta:
    facts_unchanged: false
    topology_unchanged: false
    claim_set_unchanged: false
    derived_frames_unchanged: false
    course_order_unchanged: true
    course_objectives_unchanged: true
  scopes:
    - effective-versus-access date correction
    - conceptual topology posture and exact owner correction
    - claim locality and source disclosure
    - accessibility and keyboard repair
    - rotated geometry bounds and complete generator dependency digest

variants:
  labels_only:
    label_source: current
    annotation_source: none
  annotations_only:
    label_source: champion_context
    annotation_source: current
  combined:
    label_source: current
    annotation_source: current

change_owners:
  - change_owner_id: OWNER-VISUAL-AUTHORING
    source_paths: [course/visuals.yaml, tests/test_course.py]
    responsibilities:
      - label hierarchy and focus selection
      - claim-bound semantic annotations
  - change_owner_id: OWNER-SEGMENT-AUTHORING
    source_paths: [course/segments.yaml, diagram/master.yaml, tests/test_course.py]
    responsibilities:
      - focus topology and reveal scope
      - learning-objective-to-frame alignment
  - change_owner_id: OWNER-QUALITY-CONTRACT
    source_paths:
      - course/quality_ratchet.yaml
      - course/quality_audits.yaml
      - pyproject.toml
      - src/gigawatt/quality.py
      - src/gigawatt/ratchet.py
      - tests/test_quality.py
      - tests/test_quality_validation.py
      - tests/test_ratchet.py
    responsibilities:
      - experiment provenance and Pareto acceptance
      - audit coverage and saturation policy
  - change_owner_id: OWNER-RELEASE-DOCUMENTATION
    source_paths:
      - README.md
      - course/README.md
      - course/REDLINE.md
      - tests/test_ratchet_docs.py
    responsibilities:
      - release-evidence wording
  - change_owner_id: OWNER-RUNTIME-PRIMITIVE
    source_paths:
      - course/quality_ratchet.yaml
      - diagram/cameras.yaml
      - src/gigawatt/course_runtime.py
      - src/gigawatt/scene.py
      - src/gigawatt/shots.py
      - tests/test_course_runtime.py
      - tests/test_scene.py
      - tests/test_shots.py
    responsibilities:
      - shared responsive layout primitives
      - label-aware derived 2D framing
      - portrait masthead and focus-key fallback estimates
      - portrait teaching-drawer interaction contract
  - change_owner_id: OWNER-EVIDENCE-LEDGER
    source_paths:
      - evidence/abilene.yaml
      - tests/test_course.py
    responsibilities:
      - source-bound evidence states and explicit unknowns
      - evidence-to-segment teaching boundaries
  - change_owner_id: OWNER-VALIDATION-CHAMPION
    source_paths:
      - diagram/generate_s10_two_rack_heat_paths.py
      - src/gigawatt/generated_artifacts.py
      - src/gigawatt/scene.py
      - src/gigawatt/validate.py
      - src/gigawatt/champion.py
      - tests/test_scene.py
      - tests/test_project.py
      - tests/test_s10_pilot.py
      - tests/test_quality_validation.py
      - tests/test_champion.py
      - tests/test_generated_artifacts.py
    responsibilities:
      - fail-closed YAML and evidence validation
      - immutable frozen-champion reconstruction and verification
      - deterministic pilot-generator dependency closure

