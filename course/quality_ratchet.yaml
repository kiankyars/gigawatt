changes:
  - change_id: CHANGE-FOCUS-LABELS
    finding_ids: [VIS-LABEL-01]
    change_owner_ids: [OWNER-VISUAL-AUTHORING]
    source_paths: [course/visuals.yaml]
    description: Replace experiment-control context labels with authored focus-only labels.
  - change_id: CHANGE-SEMANTIC-OVERLAYS
    finding_ids: [PED-ANNOTATION-01]
    change_owner_ids: [OWNER-VISUAL-AUTHORING]
    source_paths: [course/visuals.yaml]
    description: Add claim-bound semantic overlays without changing course invariants.
  - change_id: CHANGE-S09-HANDOFF
    finding_ids: [VIS-PED-06]
    change_owner_ids: [OWNER-VISUAL-AUTHORING]
    source_paths: [course/visuals.yaml]
    description: Make the electrical endpoint and thermal-source handoff explicit in s09.
  - change_id: CHANGE-S21-QUALIFIERS
    finding_ids: [PED-07]
    change_owner_ids: [OWNER-VISUAL-AUTHORING]
    source_paths: [course/visuals.yaml]
    description: Restore announcement, contract, and reported-status qualifiers in s21 copy.
  - change_id: CHANGE-S21-REVEAL-SCOPE
    finding_ids: [PED-VIS-08]
    change_owner_ids: [OWNER-SEGMENT-AUTHORING]
    source_paths: [course/segments.yaml]
    description: Remove the disconnected PPA reveal from s21 while retaining it in its proper sections.
  - change_id: CHANGE-PARETO-CONTRACT
    finding_ids: [QA-03, QA-PARETO-01, QA-CHAMPION-01]
    change_owner_ids: [OWNER-QUALITY-CONTRACT]
    source_paths:
      - course/quality_ratchet.yaml
      - course/quality_audits.yaml
      - pyproject.toml
      - src/gigawatt/quality.py
      - src/gigawatt/ratchet.py
    description: Separate frozen and synthetic baselines and enforce the full non-regression contract.
  - change_id: CHANGE-RELEASE-EVIDENCE-WORDING
    finding_ids: [DOC-01]
    change_owner_ids: [OWNER-RELEASE-DOCUMENTATION]
    source_paths:
      - README.md
      - course/README.md
      - course/REDLINE.md
      - tests/test_ratchet_docs.py
    description: Attribute historical evidence only to the frozen release and keep challenger approval pending.
  - change_id: CHANGE-PORTRAIT-FALLBACK-ESTIMATE
    finding_ids: [VIS-FALLBACK-02]
    change_owner_ids: [OWNER-RUNTIME-PRIMITIVE, OWNER-QUALITY-CONTRACT]
    source_paths:
      - course/quality_ratchet.yaml
      - src/gigawatt/course_runtime.py
      - src/gigawatt/quality.py
      - tests/test_course_runtime.py
