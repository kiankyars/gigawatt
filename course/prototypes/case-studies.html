<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Real campus case studies · GIGAWATT</title>
<style>
:root{color-scheme:light;--paper:#f4f3ee;--text:#193139;--muted:#5b6c70;--line:#c8d4d4;--panel:#e8eeea;--power:#086e83;--heat:#ac4e2f;--data:#6951a5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--paper)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#101b1f;--text:#e8f1ef;--muted:#a8bfbd;--line:#35504f;--panel:#1b2d31;--power:#74d9e6;--heat:#f2a387;--data:#c3b2ff}}
*{box-sizing:border-box}body{margin:0}a{color:var(--power)}button,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:7px;min-height:40px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--text);color:var(--paper)}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}:is(button,select,a,summary):focus-visible{outline:3px solid var(--heat);outline-offset:3px}
#viewer{min-height:100svh;display:flex;flex-direction:column;max-width:1920px;margin:auto;background:var(--paper)}#viewer::backdrop{background:var(--paper)}.toolbar,footer{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line)}.toolbar nav,.navigation{display:flex;align-items:center;gap:10px}.brand{font-size:12px;font-weight:800;letter-spacing:1.5px;color:inherit;text-decoration:none}.toolbar nav{font-size:12px}main{flex:1;padding:25px 5vw 20px;display:flex;flex-direction:column}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--power);margin:0 0 12px}h1{font:400 clamp(30px,3.2vw,50px)/1.1 Georgia,serif;letter-spacing:-.6px;margin:0;max-width:1400px}#scope{color:var(--muted);font-size:13px;line-height:1.5;margin:14px 0}#visual{min-height:280px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0;gap:20px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:6vw}.compare>div{border-top:2px solid var(--line);padding-top:22px}h2{font:400 29px/1.2 Georgia,serif;margin:0 0 12px}.big{font-size:clamp(36px,5vw,72px);font-weight:600;letter-spacing:-2px;color:var(--power);line-height:1.1}.unit{font-size:23px;letter-spacing:0}.caption{font-size:17px;color:var(--muted);line-height:1.6;margin:10px 0}.path{font-size:clamp(18px,2vw,27px);line-height:1.8}.path strong{color:var(--power)}.path .delay{color:var(--heat);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:7px}.path-label{font-size:13px;color:var(--muted);display:block}.bar-track{display:flex;width:100%;height:68px;background:var(--panel)}.bar-track>span{background:var(--power)}.bar-track>span:first-child{background:var(--data)}.legend{display:flex;justify-content:space-between;gap:25px;font-size:20px;line-height:1.5}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.formula{font-size:24px;line-height:1.6}table{border-collapse:collapse;width:100%;font-size:19px}td,th{padding:16px 10px;text-align:left;border-bottom:1px solid var(--line);line-height:1.5}th{font-size:13px;color:var(--muted);font-weight:650}.schedule{display:grid;grid-template-columns:170px 1fr 1fr;align-items:stretch;gap:12px;font-size:18px}.schedule>div{padding:16px 10px}.period{border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}.run{border-left:5px solid var(--power);background:var(--panel)}.defer{border-left:5px solid var(--heat)}#check{border-top:1px solid var(--line);padding-top:18px}#question{font-size:21px;line-height:1.5;margin:0 0 12px}#answer{font-size:18px;line-height:1.6;max-width:1100px;margin:14px 0 0}footer{border-top:1px solid var(--line);border-bottom:0}#scenes{max-width:55vw;font-size:13px}#progress{font-size:12px;color:var(--muted);min-width:45px;text-align:center}dialog{color:var(--text);background:var(--paper);width:min(760px,94vw);max-height:86svh;border:1px solid var(--line);border-radius:12px;padding:25px;line-height:1.7}dialog::backdrop{background:#08131ab3}dialog header{display:flex;justify-content:space-between;align-items:start;gap:15px}dialog li{margin:14px 0}dialog a{overflow-wrap:anywhere}dialog p{font-size:16px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){.toolbar,footer{padding:10px 14px}.toolbar nav{gap:6px}.toolbar nav>a{display:none}main{padding:22px 18px}#visual{padding:20px 0;min-height:340px}.compare{grid-template-columns:1fr;gap:25px}.big{font-size:48px}.legend{font-size:16px}.bar-track{height:45px}.schedule{grid-template-columns:80px 1fr 1fr;gap:6px;font-size:14px}.schedule>div{padding:12px 5px}td,th{padding:12px 5px;font-size:14px}#question{font-size:19px}.formula{font-size:21px}.navigation{gap:5px}footer button{padding:8px}#scenes{max-width:52vw}}
@media print{.toolbar,footer,button{display:none}#answer[hidden]{display:block!important}}
</style></head><body><div id="viewer">
<header class="toolbar"><a class="brand" href="../index.html">GIGAWATT</a><nav aria-label="Case resources"><a id="lesson-link" href="../index.html">Read the lesson</a><button id="explain">Explanation &amp; sources</button><button id="fullscreen" hidden>Full screen</button></nav></header>
<main><header><p id="domain" class="eyebrow"></p><h1 id="title">Real campus case studies</h1><p id="scope"></p></header><section id="visual" aria-label="Case comparison"></section><section id="check" aria-label="Predict and explain"><p id="question"></p><button id="reveal" aria-expanded="false" aria-controls="answer">Reveal reasoning</button><p id="answer" hidden></p></section></main>
<footer><label for="scenes" class="sr-only">Choose case slide</label><select id="scenes"></select><div class="navigation"><button id="previous" aria-label="Previous case slide">←</button><span id="progress" aria-live="polite"></span><button id="next" aria-label="Next case slide">→</button></div></footer></div>
<dialog id="reading" aria-labelledby="reading-title"><header><h2 id="reading-title"></h2><button id="close-reading" aria-label="Close explanation">×</button></header><p id="explanation"></p><p><a id="reader-link" href="../index.html">Continue in the reader</a></p><details><summary>Sources and reading limits</summary><ul id="sources"></ul><p>Reviewed 12 September 2026. Source dates above describe the evidence snapshot.</p></details></dialog>
<noscript><p><a href="../EXPANDED_COURSE.md">Read the case studies in the course</a>.</p></noscript>
<script type="module">
import {scenes,sources,transferCurrent,storageHours} from './case-studies.js';
const $=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teaching=new URLSearchParams(location.search).get('teach')==='1';
let index=0,voltage=34.5,load=3;const revealed=new Set();
$('fullscreen').hidden=!teaching;
$('scenes').innerHTML=scenes.map((s,i)=>`<option value="${i}">${i+1}. ${escape(s.title)}</option>`).join('');
function visuals(kind){
 if(kind==='land')return '<div class="compare"><div><h2>Abilene · greenfield</h2><p class="path">Undeveloped land → new campus</p><p class="caption">Freedom to arrange the campus<br>New buildings and service paths</p></div><div><h2>Colossus 1 · brownfield</h2><p class="path">Existing industrial site → new use</p><p class="caption">Retained shell and utility access<br>Fit, conversion and service constraints</p></div></div>';
 if(kind==='colossus')return '<div class="legend"><span>Existing substation<br><strong>8 MW</strong></span><span>New substation<br><strong>142 MW</strong></span></div><div class="bar-track" role="img" aria-label="Of 150 MW, 8 MW through the existing substation and 142 MW through the new substation"><span style="width:5.333333%"></span><span style="width:94.666667%"></span></div><p class="caption">Total in this historical service account: 150 MW</p>';
 if(kind==='procurement')return '<div><span class="path-label">Conceptual route with large-transformer stages</span><p class="path">Generation → <span class="delay">raise voltage</span> → HV transfer → <span class="delay">step down</span> → load supply</p></div><div><span class="path-label">Reported workaround, simplified to its function</span><p class="path">Generation → <strong>MV distribution</strong> → MV/LV transformers → load supply</p></div><p class="caption">Fewer large-transformer dependencies; a different current and conductor problem.</p>';
 if(kind==='current')return `<div class="controls" role="group" aria-label="Transfer voltage">${[34.5,161].map(v=>`<button data-voltage="${v}" aria-pressed="${voltage===v}">${v} kV</button>`).join('')}</div><div class="big">${(transferCurrent(200,voltage)/1000).toFixed(3)} <span class="unit">kA</span></div><p class="formula">I = 200 MW ÷ (√3 × ${voltage} kV × 1)</p><p class="caption">Aggregate line current · parallel circuits and conductor sizes are unspecified</p>`;
 if(kind==='sparks')return `<div class="compare"><div><h2>Solar generation rating</h2><div class="big">12 <span class="unit">MW</span></div><p class="caption">A power capability, not continuous output</p></div><div><h2>Battery energy rating</h2><div class="big">63 <span class="unit">MWh</span></div><p class="caption">Energy inventory, not a discharge-power limit</p></div></div><div class="controls" role="group" aria-label="Hypothetical constant load">Assumed load: ${[3,6].map(v=>`<button data-load="${v}" aria-pressed="${load===v}">${v} MW</button>`).join('')}</div><p class="formula">63 MWh ÷ ${load} MW = <strong>${storageHours(63,load)} hours</strong></p><p class="caption">Full usable store · no solar input, losses or reserve · sufficient discharge power assumed</p>`;
 if(kind==='availability')return '<div class="compare"><div><h2>Microgrid</h2><div class="big">99.2<span class="unit">%</span></div><p class="caption">Reported availability over seven months</p></div><div><h2>Crusoe Cloud</h2><div class="big">99.9<span class="unit">%</span></div><p class="caption">Reported availability using grid backup</p></div></div><p class="path">Solar + stored energy + grid backup → service</p>';
 if(kind==='cooling')return '<div><span class="path-label">Heat moves across these interfaces</span><p class="path">IT heat → recirculating facility coolant → <strong>air-cooled chiller</strong> → outdoor air</p></div><div><span class="path-label">The chiller adds compressor work</span><p class="formula">Outdoor rejection = collected heat + compressor work</p></div><p class="caption">Non-evaporative rejection · initial fill and maintenance water remain separate</p>';
 if(kind==='demand')return '<div class="schedule"><div></div><div class="period">Two-hour grid event</div><div class="period">Later capacity</div><div>Interactive</div><div class="run">Respond within 200 ms</div><div class="run">Continue serving</div><div>Video job</div><div class="defer">Eligible to defer</div><div class="run">Finish by tomorrow</div></div><p class="caption">Moving work requires enough later capacity to preserve its deadline.</p>';
 if(kind==='ledger')return '<table><thead><tr><th>Project scope</th><th>March 2026 source statement</th></tr></thead><tbody><tr><td>Original campus · first two buildings</td><td>Two 100 MW buildings energized</td></tr><tr><td>Original campus · six further buildings</td><td>Expected by end-2026</td></tr><tr><td>Adjacent Microsoft development · 900 MW</td><td>First energization expected mid-2027</td></tr></tbody></table>';
 return '';
}
function render(){const s=scenes[index];for(const id of ['title','domain','scope','question','answer','explanation'])$(id).textContent=s[id];document.title=`${s.title} · GIGAWATT`;$('reading-title').textContent=s.title;$('visual').innerHTML=visuals(s.kind);$('lesson-link').href=$('reader-link').href=`../index.html#${s.reference}`;$('answer').hidden=!revealed.has(s.id);$('reveal').setAttribute('aria-expanded',String(revealed.has(s.id)));$('reveal').textContent=revealed.has(s.id)?'Hide reasoning':'Reveal reasoning';$('previous').disabled=index===0;$('next').disabled=index===scenes.length-1;$('scenes').value=String(index);$('progress').textContent=`${index+1} / ${scenes.length}`;$('sources').innerHTML=s.sources.length?s.sources.map(k=>{const a=sources[k];return `<li><a href="${escape(a.url)}">${escape(a.title)}</a> · ${a.date}<br>${escape(a.limits)}</li>`}).join(''):'<li>Original calculation using the three-phase relationships developed in the linked lesson. Voltages are teaching inputs.</li>';}
function go(i){index=Math.max(0,Math.min(scenes.length-1,i));history.replaceState(null,'',`#${scenes[index].id}`);render();}
function fromHash(){let i=scenes.findIndex(s=>s.id===location.hash.slice(1));index=i<0?0:i;render();}
$('visual').addEventListener('click',e=>{let b=e.target.closest('button[data-voltage],button[data-load]');if(!b)return;const key=b.hasAttribute('data-voltage')?'voltage':'load',value=b.dataset[key];if(key==='voltage')voltage=Number(value);else load=Number(value);render();$('visual').querySelector(`[data-${key}="${value}"]`)?.focus();});
$('reveal').addEventListener('click',()=>{const id=scenes[index].id;revealed.has(id)?revealed.delete(id):revealed.add(id);render();});$('previous').addEventListener('click',()=>go(index-1));$('next').addEventListener('click',()=>go(index+1));$('scenes').addEventListener('change',e=>go(Number(e.target.value)));$('explain').addEventListener('click',()=>$('reading').showModal());$('close-reading').addEventListener('click',()=>$('reading').close());$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewer').requestFullscreen();}catch{$('fullscreen').textContent='Use browser full screen';}});
window.addEventListener('hashchange',fromHash);window.addEventListener('keydown',e=>{if($('reading').open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,select,input,textarea,a,[contenteditable]'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1);}if(e.key.toLowerCase()==='r')$('reveal').click();if(e.key.toLowerCase()==='f'&&teaching)$('fullscreen').click();});fromHash();
</script></body></html>
