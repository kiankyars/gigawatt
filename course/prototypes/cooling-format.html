        #diagram {
          min-height: 430px;
        }
      }

    <script type="module">
      import { presentationLabels } from './teaching-navigation.js';
      import { renderFoundation } from "./cooling-foundations.js?v=20260911-formula5";

      import { scenes } from "./cooling-scenes.js";
      import { renderCDU } from "./cooling-cdu.js";
      import { renderContinuity } from "./cooling-continuity.js";
      const $ = (id) => document.getElementById(id);
      const compactQuery = matchMedia("(max-width:600px)");
      const state = {
        index: 0,
        cduFault: "module",
        pathFault: "shared-path",
        loadMode: "full",
        deratingPathLost: false,
        flow: 2.5,
        capture: "air",
        humidity: "dry",
        plant: "adiabatic",
        interior: true,
        fluidC: "35", restriction: "normal", branch: "balanced", retrofit: "air", reveal: "hidden",
      };
      const selected = scenes.findIndex(
        (scene) => scene.id === location.hash.slice(1),
      );
      if (selected >= 0) state.index = selected;
      $("scenes").innerHTML = scenes
        .map(
          (scene, index) =>
            `<option value="${index}">${index + 1}. ${scene.label}</option>`,
        )
        .join("");
      const text = (x, y, value, cls = "svg-label", extra = "") =>
        `<text x="${x}" y="${y}" class="${cls}" ${extra}>${value}</text>`;
      const line = (d, cls, arrow = false, extra = "") =>
        `<path d="${d}" class="${cls}" ${extra}${arrow ? ` marker-end="url(#${cls.includes("heat") ? "heat" : cls.includes("facility") ? "facility" : "tech"}-arrow)"` : ""}/>`;
      const defs = `<defs>${["tech", "facility", "heat"].map((name) => `<marker id="${name}-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--${name})"/></marker>`).join("")}</defs>`;
      const pump = (x, y, color = "tech", stopped = false) =>
        `<g><circle cx="${x}" cy="${y}" r="17" fill="var(--paper)" stroke="var(--${stopped ? "muted" : color})" stroke-width="3"/><path d="M${x + 6} ${y - 8} L${x - 8} ${y} L${x + 6} ${y + 8} Z" fill="var(--${stopped ? "muted" : color})"/></g>`;
      function rack(x, y, w, h, visibleHeat) {
        const source = {
          x: x + w * 0.2,
          y: y + h * 0.41,
          w: w * 0.42,
          h: h * 0.19,
        };
        const cx = source.x + source.w / 2;
        const cy = source.y + source.h / 2;
        return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" class="panel"/>
          ${[
            [0.1, 0.18],
            [0.35, 0.3],
            [0.72, 0.18],
          ]
            .map(
              ([top, height], i) =>
                `<rect ${i === 1 ? 'id="heat-server"' : ""} x="${x + 12}" y="${y + h * top}" width="${w - 24}" height="${h * height}" rx="3" class="face"/>`,
            )
            .join("")}
          <rect id="rack-heat-source" data-inside="heat-server" x="${source.x}" y="${source.y}" width="${source.w}" height="${source.h}" rx="3" fill="var(--heatfill)" stroke="var(--heat)" stroke-width="1.7"/>
          ${visibleHeat ? text(cx, cy, "Heat", "svg-small heat-text", 'text-anchor="middle" dominant-baseline="central" data-label-for="rack-heat-source"') + line(`M${source.x + source.w + 4} ${cy} H${x + w - 25}`, "heat", true, 'data-heat-from="rack-heat-source"') : ""}</g>`;
      }
      function fan(x, y, r = 28) {
        return `<g><circle cx="${x}" cy="${y}" r="${r}" class="outline"/>${[0, 120, 240].map((a) => `<path d="M${x} ${y} q${r * 0.9} ${-r * 0.85} ${r * 0.4} ${-r * 0.1} Q${x + 4} ${y + 8} ${x} ${y}" fill="var(--muted)" transform="rotate(${a} ${x} ${y})"/>`).join("")}<circle cx="${x}" cy="${y}" r="4" fill="var(--ink)"/></g>`;
      }
      function route(scene, compact) {
        const available = true;
        const visibleHeat = scene.kind !== "trace" || state.trace;
        if (compact) return compactRoute(scene, available, visibleHeat);
        const dimTech = scene.kind === "outdoors";
        let out = `<rect x="25" y="52" width="718" height="315" rx="15" class="boundary"/>${text(43, 76, "DATA HALL", "svg-tiny")}${text(875, 76, "OUTDOORS", "svg-tiny")}`;
        out += `<g class="${dimTech ? "muted-object" : ""}">${rack(65, 118, 176, 205, visibleHeat)}${text(83, 104, "Compute rack")}${text(93, 351, "Cold plate → coolant", "svg-small")}</g>`;
        out += `<rect x="472" y="119" width="174" height="205" rx="9" class="panel"/>${scene.kind === "route" ? text(488, 90, "Coolant distribution", "svg-label") + text(488, 111, "unit (CDU)", "svg-label") : text(488, 104, "CDU")}${text(487, 350, "Liquid-to-liquid", "svg-small")}<rect x="517" y="160" width="37" height="133" rx="7" class="face"/><rect x="568" y="160" width="37" height="133" rx="7" class="face"/>`;
        out += `<g class="${dimTech ? "muted-object" : ""}">${line("M218 282 V181 H535 V282 H218", "tech")}${line("M310 181 H373", "tech", true)}${line("M445 282 H410", "tech", true)}${pump(351, 282)}${text(291, 158, "Warm return", "svg-small tech-text")}${text(272, 316, "Technology coolant", "svg-label tech-text")}</g>`;
        const fcls = available ? "facility" : "facility stopped";
        out += `<rect x="924" y="146" width="171" height="158" rx="8" class="panel"/>${text(927, 124, "Dry cooler")}`;
        out += line("M586 282 V181 H967 V282 H586", fcls);
        if (available)
          out +=
            line("M730 181 H792", "facility", true) +
            line("M837 282 H788", "facility", true);
        out +=
          pump(737, 282, "facility", !available) +
          text(704, 316, "Facility water", "svg-label facility-text");
        out += text(
          704,
          158,
          available ? "Warm return" : "Circulation stopped",
          available ? "svg-small facility-text" : "svg-small fault-text",
        );
        out +=
          `<rect id="outdoor-coil" x="948" y="171" width="38" height="111" fill="none"/>` +
          Array.from(
            { length: 7 },
            (_, i) =>
              `<path d="M948 ${173 + i * 15} h38" stroke="var(--muted)" stroke-width="1.5"/>`,
          ).join("") +
          fan(1040, 225, 27);
        if (visibleHeat) {
          out +=
            line("M546 213 H574", "heat", true) +
            line("M546 255 H574", "heat", true);
          if (available)
            out +=
              line(
                "M984 192 H1124",
                "heat",
                true,
                'data-heat-from="outdoor-coil"',
              ) +
              line(
                "M984 258 H1124",
                "heat",
                true,
                'data-heat-from="outdoor-coil"',
              ) +
              text(998, 337, "Heat to air", "svg-small heat-text");
        }
        if (scene.kind === "loops")
          out += text(
            559,
            143,
            "Heat exchanger",
            "svg-small",
            'text-anchor="middle"',
          );

        if (scene.kind === "route" || scene.kind === "trace")
          out +=
            text(
              40,
              399,
              "Blue / green arrows: circulating liquid",
              "svg-small",
            ) +
            text(
              718,
              399,
              "Gold arrows: heat crossing a boundary",
              "svg-small",
            );
        return out;
      }
      function compactRoute(scene, available, visibleHeat) {
        let out = `<rect x="9" y="5" width="354" height="366" rx="12" class="boundary"/>${text(22, 27, "DATA HALL", "svg-tiny")}${text(22, 405, "OUTDOORS", "svg-tiny")}`;
        const dimTech = scene.kind === "outdoors";
        out += `<g class="${dimTech ? "muted-object" : ""}">${rack(33, 60, 110, 128, visibleHeat)}${text(33, 49, "Rack")}</g>`;
        out += `<rect x="184" y="59" width="146" height="133" rx="7" class="panel"/>${scene.kind === "route" ? text(195, 29, "Coolant distribution", "svg-small") + text(195, 48, "unit (CDU)", "svg-small") : text(206, 48, "CDU")}<rect x="216" y="83" width="26" height="85" rx="4" class="face"/><rect x="256" y="83" width="26" height="85" rx="4" class="face"/>`;
        out += `<g class="${dimTech ? "muted-object" : ""}">${line("M128 156 V97 H230 V156 H128", "tech")}${line("M154 97 H194", "tech", true)}${pump(179, 156, "tech")}</g>`;
        out +=
          text(32, 220, "Technology coolant", "svg-label tech-text") +
          text(32, 241, "Rack ⇄ CDU", "svg-small");
        out += `<rect x="185" y="431" width="149" height="120" rx="7" class="panel"/>${text(34, 458, "Dry cooler")}`;
        const fcls = available ? "facility" : "facility stopped";
        out += line("M269 97 H307 V524 H236 V330 H269 V97", fcls);
        if (available)
          out +=
            line("M307 255 V296", "facility", true) +
            line("M236 393 V350", "facility", true);
        out +=
          text(31, 302, "Facility water", "svg-label facility-text") +
          text(
            31,
            324,
            available ? "CDU ⇄ outdoors" : "Circulation stopped",
            available ? "svg-small" : "svg-small fault-text",
          );
        out +=
          `<rect id="outdoor-coil" x="293" y="439" width="28" height="87" fill="none"/>` +
          Array.from(
            { length: 5 },
            (_, i) =>
              `<path d="M293 ${439 + i * 18} h28" stroke="var(--muted)" stroke-width="1.4"/>`,
          ).join("") +
          fan(268, 480, 23);
        if (visibleHeat) {
          out +=
            line("M238 112 H260", "heat", true) +
            line("M238 143 H260", "heat", true);
          if (available)
            out +=
              line(
                "M321 462 H353",
                "heat",
                true,
                'data-heat-from="outdoor-coil"',
              ) +
              line(
                "M321 501 H353",
                "heat",
                true,
                'data-heat-from="outdoor-coil"',
              );
        }
        if (scene.kind === "loops")
          out += text(
            29,
            273,
            "Heat crosses; the fluids do not.",
            "svg-small heat-text",
          );
        else if (scene.kind === "route" || scene.kind === "trace")
          out += text(
            29,
            273,
            "Gold arrows = heat transfer",
            "svg-small heat-text",
          );

        return out;
      }
      function plate(compact) {
        const x = compact ? 26 : 160,
          y = compact ? 128 : 110,
          w = compact ? 316 : 660,
          h = compact ? 108 : 125;
        let out = text(
          compact ? 28 : 161,
          compact ? 43 : 47,
          "INSIDE A SERVER",
          "svg-tiny",
        );
        out += text(x, y - 30, "Cold plate", "svg-label");
        out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>`;
        const path = `M${x - 14} ${y + 25} H${x + w - 28} Q${x + w - 10} ${y + 25} ${x + w - 10} ${y + 42} Q${x + w - 10} ${y + 58} ${x + w - 28} ${y + 58} H${x + 29} Q${x + 12} ${y + 58} ${x + 12} ${y + 75} Q${x + 12} ${y + 92} ${x + 29} ${y + 92} H${x + w + 14}`;
        out +=
          line(path, "tech") +
          line(`M${x + w - 45} ${y + 92} H${x + w + 9}`, "tech", true);
        out += text(x + 18, y + 45, "Coolant channels", "svg-small tech-text");
        out += `<rect x="${x + 30}" y="${y + h}" width="${w - 60}" height="10" fill="var(--heatfill)" stroke="var(--heat)"/>`;
        out += `<rect x="${x + 48}" y="${y + h + 10}" width="${w - 96}" height="65" rx="3" class="face"/>`;
        for (const frac of [0.25, 0.5, 0.75])
          out += line(
            `M${x + w * frac} ${y + h + 58} V${y + h - 13}`,
            "heat",
            true,
          );
        if (compact) {
          out +=
            text(30, 378, "Thermal interface", "svg-label") +
            `<path d="M25 364 V241 H56" class="outline"/>`;
          out +=
            text(180, 430, "Processor package", "svg-label") +
            `<path d="M295 415 V284 H285" class="outline"/>`;
        } else {
          out +=
            text(853, y + h + 10, "Thermal interface", "svg-small") +
            `<path d="M${x + w - 20} ${y + h + 5} H839" class="outline"/>`;
          out +=
            text(853, y + h + 55, "Processor package", "svg-label") +
            `<path d="M${x + w - 44} ${y + h + 44} H839" class="outline"/>`;
        }
        return out;
      }
      function render() {
        const scene = scenes[state.index],
          compact = compactQuery.matches;
        const captureTitles = {
          air: "A CRAH transfers room-air heat into a chilled-water loop.",
          coldplate:
            "Cold plates remove chip heat while the remaining components still need air.",
          "rear-door":
            "A rear-door exchanger captures rack exhaust heat before it returns to the room.",
          immersion:
            "Immersion transfers hardware heat into a dielectric liquid bath.",
        };
        $("title").textContent = scene.kind === "capture-options" ? captureTitles[state.capture] : scene.title;
        document.querySelector('.reading-link').href = `../index.html#${scene.reference}`;
        $("scenes").value = state.index;
        $("progress").textContent = `${state.index + 1} / ${scenes.length}`;
        $("previous").disabled = state.index === 0;
        $("next").disabled = state.index === scenes.length - 1;
        $("diagram").setAttribute(
          "viewBox",
          scene.kind === "capture-detail" ? (compact ? "0 0 420 720" : `0 0 1100 ${scene.id === "cooling-retrofit" ? 650 : 500}`) : (compact ? "0 0 372 580" : "0 0 1160 420"),
        );
        $("diagram").setAttribute(
          "aria-labelledby",
          "diagram-title diagram-description",
        );
        $("diagram").dataset.scene = scene.id;
        const foundationKinds = [
          "why-liquid",
          "capture-options",
          "water-balance",
          "approach",
        ];
        const continuityKinds = ["redundancy", "independent-paths", "derating"];
        const content = scene.kind === "capture-detail" ? renderCapture(scene.id, state, compact) : continuityKinds.includes(scene.kind)
          ? renderContinuity(scene.kind, compact, state)
          : foundationKinds.includes(scene.kind)
            ? renderFoundation(scene.kind, compact, state)
            : scene.kind === "cdu"
                ? renderCDU(compact, state.interior)
                : scene.kind === "plate"
                  ? plate(compact)
                  : route(scene, compact);
        $("diagram").innerHTML =
          `<title id="diagram-title">${$("title").textContent}</title><desc id="diagram-description">${scene.description}${scene.kind === "water-balance" ? ` Selected mass flow is ${state.flow} kilograms per second.` : ""}</desc>${defs}${content}`;
        const continuity = $("diagram").querySelector(
          "[data-cooling-capacity]",
        );
        if (continuity) {
          const current = continuity.dataset;
          $("diagram-description").textContent +=
            ` Current selection: ${current.coolingCapacity} kilowatts of usable cooling for ${current.coolingLoad} kilowatts of heat. Capacity ${current.supported === "true" ? "meets" : "does not meet"} this load.`;
        }
        const choices = (key, options) =>
          options
            .map(
              ([value, label]) =>
                `<button data-setting="${key}" data-value="${value}" aria-pressed="${String(state[key]) === value}">${label}</button>`,
            )
            .join("");
        const controlGroup = (name, buttons) =>
          `<div class="control-group" role="group" aria-label="${name}"><span class="control-group-label" aria-hidden="true">${name}</span><div class="control-group-buttons">${buttons}</div></div>`;
        $("actions").innerHTML =
          scene.controls ? scene.controls.map(c => controlGroup(c.label, choices(c.key, c.options))).join("") : scene.kind === "redundancy"
            ? choices("cduFault", [
                ["none", "All CDUs healthy"],
                ["module", "One CDU fails"],
                ["shared-path", "Lose shared path"],
              ])
            : scene.kind === "independent-paths"
              ? choices("pathFault", [
                  ["none", "Both paths available"],
                  ["shared-path", "Lose path A"],
                ])
              : scene.kind === "derating"
                ? controlGroup(
                    "Compute power",
                    choices("loadMode", [
                      ["full", "Full"],
                      ["reduced", "Reduced"],
                    ]),
                  ) +
                  controlGroup(
                    "Facility path",
                    choices("deratingPathLost", [
                      ["false", "Available"],
                      ["true", "Lost"],
                    ]),
                  )
                : scene.kind === "water-balance"
                  ? choices("flow", [
                      ["2.5", "2.5 kg/s"],
                      ["5", "Double flow: 5 kg/s"],
                    ])
                  : scene.kind === "capture-options"
                    ? choices("capture", [
                        ["air", "Air / CRAH"],
                        ["coldplate", "Cold plates"],
                        ["rear-door", "Rear door"],
                        ["immersion", "Immersion"],
                      ])
                        : scene.kind === "cdu"
                          ? choices("interior", [
                              ["false", "Cabinet"],
                              ["true", "Inside the CDU"],
                            ])
                          : "";
        document.querySelectorAll("[data-setting]").forEach((button) =>
          button.addEventListener("click", () => {
            const { setting, value } = button.dataset;
            state[setting] = ["interior", "deratingPathLost"].includes(setting)
              ? value === "true"
              : setting === "flow"
                ? Number(value)
                : value;
            render();
            document
              .querySelector(
                `[data-setting="${setting}"][data-value="${value}"]`,
              )
              .focus();
          }),
        );
        document.title = `${presentationLabels.cooling} · ${scene.label} · From Watts to Tokens`;
      }
      function go(index) {
        if (index < 0 || index >= scenes.length) return;
        state.index = index;
        history.replaceState(null, "", `#${scenes[index].id}`);
        render();
      }
      $("previous").addEventListener("click", () => go(state.index - 1));
      $("next").addEventListener("click", () => go(state.index + 1));
      $("scenes").addEventListener("change", (event) =>
        go(Number(event.target.value)),
      );
      addEventListener("hashchange", () => {
        const index = scenes.findIndex(
          (scene) => scene.id === location.hash.slice(1),
        );
        if (index >= 0) {
          state.index = index;
          render();
        }
      });
      addEventListener("keydown", (event) => {
        if (
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.target.closest(
            "input,select,textarea,button,[contenteditable=true]",
          )
        )
          return;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          go(state.index + 1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          go(state.index - 1);
        }
      });
      compactQuery.addEventListener("change", render);
      if (new URLSearchParams(location.search).get("teach") === "1") {
        $("fullscreen").hidden = false;
        $("fullscreen").addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch {}
        });
      }
      render();
    </script>
  <script type="module" src="slide-chrome.js"></script></body>
