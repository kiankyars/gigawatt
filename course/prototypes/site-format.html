 .toolbar nav a{text-decoration:none;color:inherit} #actions>a{display:inline-flex;padding:10px 16px;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:var(--surface);font-size:14px} </style></head><body>
<div id="viewer"><header class="toolbar"><a class="back-to-course" href="../index.html?view=slides">← Back to course</a><nav aria-label="Lesson controls"><a data-course-reading id="lesson-reference" href="../index.html#d12-hazards-and-site-evidence">Reading</a><button id="fullscreen" hidden>Full screen</button></nav></header>
<main><header><h1 id="title"></h1></header><section id="stage" aria-label="Site, buildings and operating boundaries"><svg id="diagram" role="img" aria-labelledby="diagram-title diagram-description"></svg><div id="actions"></div><p class="sr-only" id="status" role="status"></p></section></main>
<footer><label class="sr-only" for="scenes">Choose scene</label><select id="scenes"></select><div class="navigation"><button id="previous" aria-label="Previous scene">←</button><span id="progress" aria-live="polite"></span><button id="next" aria-label="Next scene">→</button></div></footer></div>
<noscript><p>Read the chapter in <a href="../index.html#d12-room-and-replacement-route">the site and building reference</a>.</p></noscript>
<script type="module">
import {scenes,initialState} from './site-scenes.js';
import {renderSite} from './site-visuals.js';
const $=id=>document.getElementById(id),state={...initialState};
const teaching=new URLSearchParams(location.search).get('teach')==='1';
$('fullscreen').hidden=!teaching;
let index=0;
for(const[i,s]of scenes.entries())$('scenes').add(new Option(`${i+1} · ${s.label}`,s.id));
function draw(){const scene=scenes[index],compact=matchMedia('(max-width:600px)').matches,{markup,description}=renderSite(scene.id,state,compact);$('diagram').setAttribute('viewBox',compact?'0 0 390 680':'0 0 1200 560');$('diagram').innerHTML=`<title id="diagram-title">${scene.title}</title><desc id="diagram-description">${description}</desc>${markup}`;$('status').textContent=description;}
function controls(){$('actions').replaceChildren();for(const group of scenes[index].controls||[]){const field=document.createElement('fieldset');field.className='choices';const legend=document.createElement('legend');legend.textContent=group.label;field.append(legend);for(const[value,label]of group.options){const b=document.createElement('button');b.textContent=label;b.dataset.key=group.key;b.dataset.value=String(value);b.setAttribute('aria-pressed',String(state[group.key]===value));b.onclick=()=>{state[group.key]=value;field.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button===b)));draw();};field.append(b);}$('actions').append(field);}if(index===scenes.length-1){const a=document.createElement('a');a.href='../index.html#d04-read-the-power-train';a.textContent='Next: campus electrical distribution →';$('actions').append(a);}}
function render(){const s=scenes[index];$('title').textContent=s.title;$('scenes').value=s.id;$('progress').textContent=`${index+1} / ${scenes.length}`;$('previous').disabled=index===0;$('next').disabled=index===scenes.length-1;$('lesson-reference').href='../index.html#'+s.reference;controls();draw();}
function go(i){index=Math.max(0,Math.min(scenes.length-1,i));history.replaceState(null,'',`#${scenes[index].id}`);render();}
function fromHash(){const i=scenes.findIndex(s=>s.id===location.hash.slice(1));index=i<0?0:i;render();}
$('scenes').onchange=e=>go(scenes.findIndex(s=>s.id===e.target.value));$('previous').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewer').requestFullscreen();}catch{$('fullscreen').textContent='Use browser full screen';}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,select,input,textarea,a,[contenteditable]'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1);}if(e.key.toLowerCase()==='f'&&teaching)$('fullscreen').click();});
window.addEventListener('hashchange',fromHash);matchMedia('(max-width:600px)').addEventListener('change',draw);fromHash();
</script><script type="module" src="slide-chrome.js"></script></body></html>
