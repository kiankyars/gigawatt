schema_version: 1

# Presenter-facing emphasis for sections whose teaching objective is not carried
# by geometry alone. This file may select existing labels and bind concise
# annotations to validated segment claims. It does not own facts, topology,
# camera geometry, order, pacing, or spoken words.
segments:
  p0_gigawatt_not_workload:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - gas_units
      - gas_permit
      - station_138
      - station_345
      - diesel
      - diesel_authorization
      - diesel_unknown
      - mv_bus
      - mv_unknown
      - die_turn
    annotation:
      kind: funnel
      position: top-right
      title: Five stages; PERMITTED is a separate authorization
      items:
        - label: PLANNED — 1.2 GW grid interconnection
          claim_ids: [planned_grid_boundary]
        - label: CONSTRUCTED — 200 MW / 138 kV station; PERMITTED gas/diesel is a separate axis
          claim_ids: [initial_substation_rating, permitted_gas_layer, permitted_diesel_layer]
        - label: ENERGIZED — 1 GW / 345 kV station and at least two buildings
          claim_ids: [expansion_substation_rating, energized_building_minimum]
        - label: LIVE — training and inference within a published date boundary
          claim_ids: [workloads_live_by]
        - label: UNKNOWN — delivered basis, exact operations, and installed GPUs
          claim_ids: [untyped_delivery_percentage, operational_buildings_unknown, installed_gpu_no_estimate]

  p1_read_the_machine:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - legend_title
      - legend_direction
      - legend_posture
      - legend_energized
      - legend_permitted
      - legend_future
      - legend_conceptual
      - gas_permit
      - station_138
      - bess
      - mv_unknown
      - air_cooled_chiller
    annotation:
      kind: layers
      position: top-left
      title: Four independent visual channels
      items:
        - label: COLOR = carrier, independent of lifecycle
          claim_ids: [energized_example, permitted_example, selected_design_example]
        - label: DIRECTION = initial 138 kV tie → initial 200 MW / 138 kV station
          claim_ids: [energized_example]
        - label: STROKE = energized, permitted, future-design, or conceptual lifecycle
          claim_ids: [energized_example, permitted_example, future_example, unknown_example, selected_design_example]
        - label: POSTURE = claim copy / evidence drawer, not stroke
          claim_ids: [energized_example, permitted_example, future_example, unknown_example, selected_design_example]

  s01_fire_to_electricity:
    label_policy: focus
    show_legend: false
    label_node_ids: [gas_turbine, generator, gsu_transformer]
    label_copy_ids: []
    annotation:
      kind: layers
      position: top-right
      title: Conversion path and evidence posture are separate
      items:
        - label: "Generic conversion: combustion gas → shaft → generator-terminal electricity"
          claim_ids: [turbine_generator_conversion_reference]
        - label: Ten units totaling 360.5 MW remain permit scope
          claim_ids: [gas_authorization]
        - label: Onsite plant and GE Vernova turbine family confirmed installed
          claim_ids: [installed_turbine_presence]
        - label: Installed count, model mix, commissioning, output, and operation remain unknown
          claim_ids: [installed_turbine_configuration_unknown, operating_posture_unknown]

  s02_generator_terminal:
    label_policy: focus
    show_legend: false
    label_node_ids: [generator, gsu_transformer, campus_mv_distribution]
    label_copy_ids: []
    annotation:
      kind: comparison
      position: top-right
      title: Reference voltage is not site configuration
      items:
        - label: Titan 350 model range 11–13.8 kV; selected site voltage unknown
          claim_ids: [model_voltage_range, site_voltage_unknown]
        - label: 34.5 kV is a review-design campus-interface reference
          claim_ids: [campus_interface_design]
        - label: Exact generator, GSU, and as-built campus interface remain unknown
          claim_ids: [campus_interface_unknown, site_generator_configuration_boundary]

  s03_initial_grid_path:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids: [source_138, tie_138, station_138, mv_bus, mv_unknown]
    annotation: null

  s04_expansion_grid_path:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - source_345
      - corridor_345
      - hv_protection
      - station_345
      - station_345_energized
      - mv_bus
      - mv_unknown
    annotation: null

  s05_ppa_not_wire:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids: [source_345]
    annotation: null

  s06_campus_mv_envelope:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - generator_terminal
      - station_138
      - station_345
      - mv_bus
      - mv_unknown
      - mv_reference_design
      - bess
      - diesel
      - diesel_authorization
      - diesel_unknown
    annotation: null

  s07_building_power_train:
    label_policy: focus
    show_legend: false
    label_node_ids:
      - campus_mv_distribution
      - unit_substation
      - lv_switchgear
      - ups
      - busway
    label_copy_ids: []
    annotation: null

  s08_rack_voltage_descent:
    label_policy: focus
    show_legend: false
    label_node_ids: [busway, power_shelf, vrm, die]
    label_copy_ids: []
    annotation:
      kind: comparison
      position: top-right
      title: Product voltage is not site configuration
      items:
        - label: Abilene rack-shelf AC input is unknown
          claim_ids: [rack_ac_unknown]
        - label: DGX GB200 product output is nominal 50–51 VDC
          claim_ids: [rack_dc_product_reference]
        - label: Exact operating rack and core electrical configuration is unknown
          claim_ids: [operating_rack_configuration_unknown]

  s09_watt_becomes_heat:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids: [die_turn, cold_plate]
    annotation:
      kind: sequence
      position: left
      title: Electrical endpoint, thermal source
      items:
        - label: Core-voltage power terminates at the die
          claim_ids: [operating_family, electrical_input_to_cold_plate_reference]
        - label: Die heat enters the cold plate; no heat split is inferred
          claim_ids: [direct_cooling_design, liquid_path_product_reference, electrical_input_to_cold_plate_reference]

  s10_two_rack_heat_paths:
    label_policy: focus
    show_legend: false
    label_node_ids: [die, rack_air_load, cold_plate, rack_manifold]
    label_copy_ids: []
    annotation: null

  s11_technology_loop:
    label_policy: focus
    show_legend: false
    label_node_ids: [cold_plate, rack_manifold, cdu]
    label_copy_ids: []
    annotation: null

  s12_cdu_boundary:
    label_policy: focus
    show_legend: false
    label_node_ids: [rack_manifold, cdu, facility_loop]
    label_copy_ids: []
    annotation: null

  s13_residual_air_branch:
    label_policy: focus
    show_legend: false
    label_node_ids: [rack_air_load, crah, facility_loop]
    label_copy_ids: []
    annotation: null

  s14_facility_heat_rejection:
    label_policy: focus
    show_legend: false
    label_node_ids: [cdu, crah, facility_loop, air_cooled_chiller]
    label_copy_ids: []
    annotation: null

  s15_water_accounting:
    label_policy: focus
    show_legend: false
    label_node_ids: [fill_treatment, facility_loop, air_cooled_chiller]
    label_copy_ids: []
    annotation:
      kind: comparison
      position: top-right
      title: Design requirement is not measured consumption
      items:
        - label: Initial-fill design is about 1,000,000 gallons per building
          claim_ids: [initial_fill_design]
        - label: Anticipated maintenance is about 50,000 gallons per building per year
          claim_ids: [anticipated_maintenance]
        - label: Measured operating consumption remains unknown
          claim_ids: [measured_operating_consumption_unknown]

  s16_close_atmosphere:
    label_policy: focus
    show_legend: false
    label_node_ids:
      - die
      - cold_plate
      - rack_manifold
      - cdu
      - rack_air_load
      - crah
      - facility_loop
      - air_cooled_chiller
      - atmosphere
    label_copy_ids: []
    annotation:
      kind: parallel
      position: left
      title: Parallel rack paths converge at the facility loop
      items:
        - label: Rack heat splits into direct-to-chip liquid and residual-air paths
          claim_ids: [cooling_design, rack_component_paths]
        - label: Liquid path crosses the conceptual CDU interface
          claim_ids: [rack_component_paths, facility_interface_boundary]
        - label: Residual-air path crosses the conceptual CRAH interface
          claim_ids: [rack_component_paths, facility_interface_boundary]
        - label: Both paths feed the selected-design facility loop, air-cooled plant, and atmosphere
          claim_ids: [selected_heat_rejection, facility_interface_boundary]

  s17_interconnection_schedule:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - source_138
      - tie_138
      - station_138
      - source_345
      - corridor_345
      - hv_protection
      - station_345
      - station_345_energized
      - mv_bus
      - mv_unknown
    annotation:
      kind: sequence
      position: right
      title: Distinct interconnection gates
      items:
        - label: PLANNED — 1.2 GW grid-interconnection boundary
          claim_ids: [planned_grid_boundary]
        - label: CONFIRMED — initial utility gates energized 2023-06-30
          claim_ids: [initial_aep_delivery_gates]
        - label: REPORTED — line schedule 2025-05-12→2025-11-21; completion/energization unestablished
          claim_ids: [expansion_line_schedule]
        - label: PLANNED — permanent-transformer swaps expected by 2026-10-31
          claim_ids: [expansion_permanent_transformer_schedule]
        - label: UNKNOWN — customer queue/service agreement/capacity/load-ramp administrative record
          claim_ids: [private_interconnection_and_load_boundary]

  s18_long_lead_equipment:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - gas_units
      - gas_permit
      - hv_protection
      - station_345
      - unit_sub
      - lv_switchgear
      - ups
      - cdu
      - air_cooled_chiller
    annotation:
      kind: comparison
      position: right
      title: Evidence bases are not interchangeable
      items:
        - label: "U.S. LPT market example: up to/over 36 months; not an Abilene schedule"
          claim_ids: [transformer_delivery_exposure]
        - label: "External GE portfolio: ~10 GW available for 2029 delivery; not an Abilene schedule"
          claim_ids: [turbine_manufacturing_slot]
        - label: "External cooling: XCA first shipped 2026-06; generic acceptance sequence; not Abilene"
          claim_ids: [cooling_product_availability_example, liquid_cooling_acceptance]

  s19_fast_load_slow_grid:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - source_345
      - station_345
      - bess
      - mv_bus
      - ups
      - power_shelf
      - die_turn
    annotation:
      kind: layers
      position: left
      title: Fast event, layered response
      items:
        - label: "External NERC example: ~250 ms fastest ramp; transitions <1 s; not Abilene"
          claim_ids: [synchronized_ai_load_dynamics]
        - label: Facility ride-through and grid response are different layers
          claim_ids: [ride_through_engineering_boundary, voltage_sensitive_load_event, synchronized_ai_load_dynamics]
        - label: Abilene transient profile and BESS role remain unknown
          claim_ids: [abilene_transient_and_bess_boundary, bess_operation_unknown]

  s20_build_sequence:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - station_138
      - station_345
      - region_buildings
      - mv_bus
      - unit_sub
      - ups
      - power_shelf
      - die_turn
    annotation:
      kind: funnel
      position: left
      title: Five stages; no capacity-basis substitutions
      items:
        - label: PLANNED — grid interconnection and remaining six buildings
          claim_ids: [planned_grid_boundary, remaining_buildings_plan]
        - label: CONSTRUCTED — campus construction started in June 2024
          claim_ids: [construction_start]
        - label: ENERGIZED — grid infrastructure as of evidenced dates; at least two buildings
          claim_ids: [infrastructure_milestones, energized_minimum, first_two_buildings_energized]
        - label: LIVE — first phase operating and workloads live within dated boundaries
          claim_ids: [first_phase_operational, live_compute_boundary]
        - label: UNKNOWN — exact load, accelerators, and delivered basis
          claim_ids: [installed_gpu_no_estimate, untyped_delivery_boundary, current_delivery_boundary]

  s21_capital_ownership:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - zone_btm
      - zone_grid
      - zone_substations
      - zone_mv
      - zone_building
      - room_electrical
      - room_data_hall
      - room_mechanical
    annotation:
      kind: layers
      position: top-right
      title: Named roles do not establish asset ownership
      items:
        - label: "Program: four funders; SoftBank finance, OpenAI operations"
          claim_ids: [stargate_responsibility_structure]
        - label: "Announcement: Crusoe owner/developer; Lancium developer role"
          claim_ids: [abilene_developer_roles]
        - label: "Contract: Crusoe designs, builds, operates phase-one 206 MW"
          claim_ids: [phase1_delivery_and_operations_contract]
        - label: "Compute: Oracle delivered GB200 racks; OpenAI reported workloads"
          claim_ids: [operating_compute_roles]
        - label: "Unknown ownership: land, components, IT, phase-one tenant"
          claim_ids: [legal_ownership_boundary]

  s22_capital_risk:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - zone_btm
      - zone_grid
      - zone_substations
      - zone_mv
      - zone_building
      - room_electrical
      - room_data_hall
      - room_mechanical
    annotation:
      kind: layers
      position: top-right
      title: Public structure, private earning gates
      items:
        - label: Published phase-one financing and lease structure
          claim_ids: [phase1_financing_and_lease]
        - label: Published phase-two joint-venture structure
          claim_ids: [phase2_joint_venture]
        - label: Equipment finance, acceptance, rent, and utilization terms remain unknown
          claim_ids: [undisclosed_capital_and_risk_terms]

  s23_business_models:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - gas_units
      - source_345
      - mv_bus
      - power_shelf
      - die_turn
    annotation:
      kind: comparison
      position: right
      title: Same machine, different risk allocation
      items:
        - label: "Developer: Crusoe owner/developer announcement; Lancium development functions"
          claim_ids: [developer_role_comparison]
        - label: "Colo: Equinix operates space and power; customers place IT; facility tenure varies"
          claim_ids: [colocation_comparison]
        - label: "Neocloud: leased space, equipment commitments, and utilization-linked contract risk"
          claim_ids: [neocloud_operating_comparison, neocloud_contract_risk_comparison]
        - label: "Hyperscaler: Microsoft owns or leases facilities and aggregates cloud demand"
          claim_ids: [hyperscale_cloud_comparison]

  s24_megawatts_to_tokens:
    label_policy: focus
    show_legend: false
    label_node_ids: []
    label_copy_ids:
      - mv_bus
      - unit_sub
      - ups
      - power_shelf
      - die_turn
      - cold_plate
      - manifold
      - cdu
      - facility_loop
      - air_cooled_chiller
      - atmosphere
    annotation:
      kind: routes
      position: top-left
      title: Scenario unit cancellation; no Abilene values
      items:
        - label: "Inference rate: W_facility×W_IT/W_facility×W_accel/W_IT×tokens/J=tokens/s"
          claim_ids: [facility_to_it_scenario_step, inference_published_boundaries, inference_scenario_step, complete_scenario_recipe]
        - label: "Energy yield: J_facility×J_IT/J_facility×J_accel/J_IT×tokens/J=tokens"
          claim_ids: [pue_accounting_boundary, facility_to_it_scenario_step, inference_scenario_step, complete_scenario_recipe]
        - label: "Training: active peak matmul FLOP/s × same-system measured MFU ÷ model FLOP/token = tokens/s"
          claim_ids: [training_published_method, training_scenario_step, complete_scenario_recipe]
        - label: Missing site input means no Abilene estimate
          claim_ids: [site_power_no_estimates, site_compute_no_estimates, site_workload_configuration_unknown]
