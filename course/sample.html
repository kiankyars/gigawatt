<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ee" />
    <title>800 V DC — GIGAWATT teaching sample</title>
    <style>
      :root {
  --paper: #f4f3ee;
  --ink: #193139;
  --muted: #62716e;
  --teal: #0b756a;
  --amber: #ad650d;
  --line: #d7ded5;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
a {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  color: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 15px;
  background: transparent;
}
button:hover {
  background: #e6ebe3;
}
button:disabled {
  opacity: 0.35;
  cursor: default;
}
a {
  color: var(--teal);
  text-underline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #c77a15;
  outline-offset: 4px;
}
[hidden] {
  display: none !important;
}
.skip {
  position: fixed;
  top: 10px;
  left: 10px;
  padding: 12px;
  background: white;
  z-index: 9;
  transform: translateY(-160%);
}
.skip:focus {
  transform: none;
}
#audience {
  min-height: 100svh;
  display: grid;
  grid-template-rows: 64px 1fr 64px 30px;
  max-width: 1920px;
  margin: auto;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
}
.brand span {
  font-size: 10px;
  color: var(--muted);
  margin-left: 16px;
  letter-spacing: 1.5px;
}
.toolbar nav {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 12px;
}
.toolbar button {
  padding: 7px 10px;
}
.toolbar a {
  text-decoration: none;
}
#scene {
  padding: 24px 5vw 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  outline: none;
  gap: 16px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 700;
  color: var(--teal);
  margin: 0 0 10px;
}
h1 {
  font-family: Georgia, serif;
  font-weight: 400;
  letter-spacing: -1.5px;
  font-size: clamp(32px, 4vw, 64px);
  line-height: 1.05;
  margin: 0;
}
.scene-heading {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
}
#visual {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 280px;
}
.caption {
  font-size: clamp(14px, 1.25vw, 19px);
  text-align: center;
  margin: 0;
  color: var(--muted);
  line-height: 1.4;
}
.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  gap: 16px;
  border-top: 1px solid var(--line);
}
.transport > button {
  min-width: 100px;
}
.transport #next {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
#steps {
  display: flex;
  gap: 8px;
}
#steps button {
  width: 32px;
  height: 32px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  font-size: 12px;
  color: var(--muted);
}
#steps button[aria-current="step"] {
  background: var(--teal);
  color: white;
}
.workflow {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin: 0;
  padding: 6px 12px;
}
#notice:empty {
  display: none;
}
#notice {
  position: fixed;
  bottom: 40px;
  left: 5%;
  padding: 12px;
  background: var(--ink);
  color: white;
  border-radius: 8px;
  z-index: 8;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1.55fr;
  align-items: center;
  width: 100%;
  gap: 30px;
}
.hero img {
  width: 100%;
  max-height: 46vh;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.hero-number {
  font-size: clamp(78px, 12vw, 180px);
  letter-spacing: -8px;
  line-height: 1;
  font-weight: 600;
  color: var(--teal);
}
.hero-number small {
  font-size: 0.35em;
  letter-spacing: -2px;
}
.hero p {
  font-size: clamp(20px, 2.4vw, 36px);
  font-family: Georgia, serif;
  max-width: 350px;
  margin: 20px 0 0;
  line-height: 1.2;
}
.chip {
  display: inline-flex;
  padding: 8px 13px;
  border-radius: 30px;
  background: #e5ece3;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.hero .chip {
  margin-bottom: 28px;
}
.model {
  width: 100%;
  display: grid;
  gap: 22px;
}
.model-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.formula {
  font-family: Georgia, serif;
  font-size: clamp(24px, 2.6vw, 40px);
}
.comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.metric-card {
  background: #fffefa;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px 32px;
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}
.metric-card.changed {
  background: var(--ink);
  color: #fffefa;
  border-color: var(--ink);
}
.metric-label {
  font-size: clamp(18px, 1.8vw, 27px);
  color: var(--muted);
  margin: 0;
}
.changed .metric-label {
  color: #b8d5cb;
}
.metric {
  font-size: clamp(50px, 6vw, 92px);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  letter-spacing: -3px;
}
.metric small {
  font-size: 0.38em;
  letter-spacing: 0;
}
.metric-sub {
  font-size: clamp(13px, 1.2vw, 18px);
  margin: 0;
}
.conductor-lines {
  display: grid;
  gap: 6px;
  margin-top: 8px;
  min-height: 48px;
  align-content: center;
}
.conductor-lines > div {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 12px;
}
.conductor-lines span {
  width: 20px;
  font-size: 11px;
}
.conductor-lines i {
  flex: 1;
  height: 4px;
  background: var(--amber);
  border-radius: 2px;
}
.changed .conductor-lines i {
  background: #a3d597;
}
.reveal {
  background: #d1e9cd;
  color: var(--ink);
  border: 0;
  font-weight: 600;
  align-self: flex-start;
}
.changed button:hover {
  background: #e7f5e3;
}
.control-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 42px;
}
.control-line label {
  font-size: 14px;
}
.control-line input {
  width: clamp(120px, 25vw, 430px);
  accent-color: var(--teal);
}
.control-line output {
  font-variant-numeric: tabular-nums;
  min-width: 70px;
}
.control-line button {
  padding: 7px 12px;
  font-size: 13px;
}
.loss-track {
  height: 14px;
  background: #e3e7de;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.loss-bar {
  height: 100%;
  background: var(--amber);
}
.changed .loss-track {
  background: #3d5256;
}
.changed .loss-bar {
  background: #a3d597;
}
.bridge {
  font-family: Georgia, serif;
  font-size: clamp(20px, 2.4vw, 34px);
  text-align: center;
  margin: 0;
}
.bridge strong {
  font-weight: 400;
  color: var(--teal);
}
.architecture {
  width: 100%;
  display: grid;
  gap: 26px;
}
.path {
  display: grid;
  grid-template-columns: 1.15fr 2fr 2fr;
  gap: 18px;
  align-items: stretch;
}
.zone {
  border: 1px solid #c5cfc4;
  border-radius: 14px;
  padding: 18px;
  position: relative;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.zone-title {
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 700;
  margin: 0;
}
.zone.active {
  background: #e5ece3;
  border-color: #94b59f;
}
.zone.rack {
  background: #fffefa;
}
.zone-body {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 12px;
  justify-content: center;
}
.unit {
  border: 1.5px solid #80998d;
  background: var(--paper);
  border-radius: 8px;
  min-height: 95px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-align: center;
  flex: 1;
  font-size: clamp(14px, 1.45vw, 22px);
  line-height: 1.2;
}
.unit.converter {
  border: 2px solid var(--amber);
  background: #fff1d8;
}
.unit.chip-unit {
  background: var(--ink);
  color: #fffefa;
  border-color: var(--ink);
}
.unit small {
  font-size: 11px;
  color: var(--muted);
}
.chip-unit small {
  color: #b8d5cb;
}
.wire {
  color: var(--amber);
  font-size: 26px;
  font-weight: 600;
  flex: 0 0 auto;
}
.zone:not(:last-child):after {
  content: "→";
  position: absolute;
  right: -17px;
  top: 50%;
  font-size: 22px;
  color: var(--amber);
  z-index: 2;
}
.path-label {
  font-size: 16px;
  color: var(--amber);
  text-align: center;
  margin: 0;
}
.diagram-key {
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 13px;
  color: var(--muted);
}
.diagram-key span:before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  background: #fff1d8;
  border: 2px solid var(--amber);
  margin-right: 8px;
}
.boundary-line {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  font-size: clamp(18px, 1.8vw, 27px);
  font-family: Georgia, serif;
  text-align: center;
  margin: 0;
}
.transfer {
  width: 100%;
  display: grid;
  gap: 22px;
}
.transfer-path {
  display: grid;
  grid-template-columns: 1fr 60px 1.2fr;
  align-items: center;
  gap: 18px;
}
.transfer-path .metric-card {
  min-height: 210px;
}
.transfer-arrow {
  font-size: 44px;
  color: var(--amber);
  text-align: center;
}
.answer-strip {
  padding: 20px 26px;
  background: #e5ece3;
  border-radius: 10px;
  display: flex;
  gap: 24px;
  justify-content: space-between;
  align-items: center;
  min-height: 85px;
}
.answer-strip p {
  margin: 0;
  font-size: clamp(16px, 1.7vw, 25px);
  max-width: 700px;
}
.answer-strip b {
  font-size: clamp(25px, 3vw, 42px);
  font-weight: 500;
  white-space: nowrap;
}
.answer-strip button {
  background: var(--ink);
  color: white;
  margin: auto;
}
.transfer .metric-label {
  font-size: 17px;
}
#presenter {
  max-width: 1320px;
  margin: auto;
  padding: 32px;
}
.notes-header {
  display: flex;
  gap: 25px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
}
.notes-header h1 {
  font-size: 36px;
}
.notes-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 60px;
  margin: 24px 0 110px;
}
.notes-layout article h2 {
  font:
    36px Georgia,
    serif;
  margin: 0 0 22px;
}
.notes-layout p {
  font-size: 18px;
  line-height: 1.65;
}
.notes-layout .cue {
  background: #e5ece3;
  padding: 18px;
  border-left: 3px solid var(--teal);
}
.notes-layout aside {
  border-left: 1px solid var(--line);
  padding-left: 30px;
}
.notes-layout aside p,
.notes-layout aside a {
  font-size: 14px;
  line-height: 1.6;
}
.notes-layout .eyebrow {
  font-size: 11px;
}
.next-note {
  border-top: 1px solid var(--line);
  margin-top: 32px;
  padding-top: 20px;
}
.notes-controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 18px;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding: 16px;
}
.notes-controls button:last-child {
  background: var(--ink);
  color: white;
}
#notes-outline {
  display: grid;
  gap: 8px;
  margin-top: 26px;
}
#notes-outline button {
  text-align: left;
  font-size: 13px;
}
#notes-outline button[aria-current="step"] {
  background: var(--ink);
  color: white;
}
#connection {
  font-size: 13px;
  color: var(--muted);
}
@media (min-width: 800px) and (min-height: 560px) {
  #audience {
    height: 100svh;
  }
  #visual {
    min-height: 0;
  }
}
@media (max-height: 750px) and (min-width: 800px) {
  #audience {
    grid-template-rows: 54px 1fr 54px 26px;
  }
  #scene {
    padding-top: 16px;
    gap: 12px;
  }
  h1 {
    font-size: clamp(32px, 3.6vw, 48px);
  }
  .metric-card {
    min-height: 165px;
    padding: 18px 24px;
    gap: 6px;
  }
  .metric {
    font-size: clamp(48px, 5.8vw, 76px);
  }
  .model {
    gap: 14px;
  }
  .zone {
    min-height: 175px;
    gap: 10px;
    padding: 14px;
  }
  .unit {
    min-height: 80px;
  }
  .architecture {
    gap: 18px;
  }
  .transfer-path .metric-card {
    min-height: 165px;
  }
  .hero img {
    max-height: 43vh;
  }
  .hero .chip {
    margin-bottom: 16px;
  }
  .hero-number {
    font-size: 120px;
  }
}
@media (max-width: 799px) {
  #audience {
    grid-template-rows: auto 1fr auto auto;
  }
  .toolbar {
    padding: 14px 18px;
    align-items: flex-start;
    gap: 12px;
  }
  .brand {
    font-size: 13px;
  }
  .brand span {
    display: block;
    margin: 6px 0 0;
    font-size: 8px;
  }
  .toolbar nav {
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    font-size: 10px;
  }
  .toolbar button {
    font-size: 10px;
    padding: 7px;
  }
  .toolbar #fullscreen span {
    display: none;
  }
  #scene {
    padding: 24px 20px;
    gap: 24px;
  }
  h1 {
    font-size: 36px;
    letter-spacing: -1px;
  }
  #visual {
    min-height: 0;
  }
  .hero {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .hero-number {
    font-size: 100px;
    letter-spacing: -5px;
  }
  .hero .chip {
    margin-bottom: 18px;
  }
  .hero p {
    font-size: 24px;
    margin: 12px 0 0;
  }
  .hero img {
    max-height: 240px;
  }
  .comparison {
    gap: 12px;
  }
  .metric-card {
    padding: 18px 14px;
    min-height: 150px;
    border-radius: 10px;
  }
  .metric {
    font-size: 42px;
    letter-spacing: -2px;
  }
  .metric-label {
    font-size: 18px;
  }
  .metric-sub {
    font-size: 12px;
  }
  .model-top {
    flex-direction: column;
    align-items: flex-start;
  }
  .formula {
    font-size: 27px;
  }
  .chip {
    font-size: 12px;
  }
  .control-line {
    flex-wrap: wrap;
    gap: 12px;
  }
  .control-line input {
    width: 160px;
  }
  .caption {
    font-size: 13px;
  }
  .reveal {
    font-size: 12px;
    padding: 10px;
  }
  .transport {
    padding: 12px 16px;
    gap: 8px;
  }
  .transport > button {
    min-width: 42px;
    padding: 8px;
  }
  .transport > button span {
    display: none;
  }
  #steps {
    gap: 2px;
  }
  #steps button {
    width: 29px;
    height: 29px;
  }
  .workflow {
    font-size: 10px;
    padding: 10px 18px;
  }
  .path {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .zone {
    min-height: 115px;
    padding: 14px;
    gap: 12px;
  }
  .zone-body {
    min-height: 80px;
  }
  .zone:not(:last-child):after {
    content: "↓";
    top: auto;
    right: 50%;
    bottom: -21px;
  }
  .unit {
    min-height: 70px;
    font-size: 18px;
  }
  .path-label {
    font-size: 14px;
  }
  .diagram-key {
    font-size: 11px;
    gap: 12px;
  }
  .boundary-line {
    font-size: 22px;
  }
  .transfer-path {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .transfer-arrow {
    transform: rotate(90deg);
    font-size: 30px;
    line-height: 1;
  }
  .transfer-path .metric-card {
    min-height: 135px;
  }
  .answer-strip {
    padding: 18px;
    gap: 14px;
    flex-direction: column;
  }
  .answer-strip p {
    font-size: 17px;
    text-align: center;
  }
  #presenter {
    padding: 20px;
  }
  .notes-header {
    align-items: flex-start;
    flex-direction: column;
  }
  .notes-header h1 {
    font-size: 28px;
  }
  .notes-layout {
    grid-template-columns: 1fr;
    gap: 30px;
  }
  .notes-layout aside {
    border-left: 0;
    border-top: 1px solid var(--line);
    padding: 20px 0 0;
  }
  .notes-controls {
    gap: 8px;
    padding: 12px;
  }
  .notes-controls button {
    font-size: 12px;
  }
  .notes-layout article h2 {
    font-size: 30px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button,
  a {
    transition:
      background 0.15s,
      color 0.15s;
  }
  .loss-bar {
    transition: width 0.3s;
  }
}
@media (max-width: 799px) {
  .zone.rack .zone-body {
    flex-direction: column;
  }
  .zone.rack .unit {
    width: 100%;
  }
  .zone.rack .wire {
    transform: rotate(90deg);
    line-height: 1;
  }
}

#audience {
  grid-template-rows: 64px 1fr 64px;
}
.energy-ledger {
  width: 100%;
  display: grid;
  gap: 18px;
}
.ledger-formula {
  font:
    clamp(18px, 2vw, 28px) Georgia,
    serif;
}
.path-assumption {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin: 0;
  line-height: 1.4;
}
.ledger-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffefa;
  padding: 20px 26px;
  height: 100%;
}
.ledger-card.changed {
  background: var(--ink);
  color: #fffefa;
  border-color: var(--ink);
}
.ledger-card h2 {
  font-size: clamp(18px, 1.8vw, 27px);
  font-weight: 500;
  margin: 0 0 16px;
}
.ledger-card dl {
  margin: 0;
  display: grid;
  gap: 12px;
}
.ledger-card dl > div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: clamp(16px, 1.4vw, 22px);
}
.ledger-card dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ledger-card small {
  font-size: 0.75em;
}
.ledger-total {
  border-top: 1px solid #9dafaa;
  margin-top: 18px;
  padding-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ledger-total span {

      {"schema_version":1,"id":"sample-800v-presentation","source_lesson_id":"sample-800v","title":"What 800 V changes","planned_duration_seconds":365,"timing_note":"Unrecorded dry run first. Timing targets are prompts for rehearsal, not an instruction to record or a measured duration.","review_state":"Revised after presenter feedback clarified the intended comparison: 480 V three-phase AC versus 800 V two-wire DC.","defaults":{"power_kw":100,"reference_voltage_v":480,"comparison_voltage_v":800,"hours":1,"ac_conversion_kw":4,"dc_conversion_kw":3,"conductor_ohms":0.01,"power_factor":1,"dc_upstream_conversion_kw":1},"presentation_rules":["Show one step at a time. Keep notes, cues and sources in the separate presenter or reading view.","On current, loss, energy and path-comparison steps, ask for a prediction before revealing the result.","Use the same load and diagram positions throughout the architecture sequence; change conversion placement deliberately.","Architecture drawings show selected functional boundaries. They are conceptual schematics, not wiring diagrams.","Show the fixed-resistance assumption alongside the loss comparison, including after revealing its answer.","Compute displayed answers with the tested three-phase AC and two-wire DC model rather than embedding numbers in generated illustrations.","Hold receiving-end real power fixed. State AC line-to-line RMS voltage, power factor and resistance per conductor; distinguish amperes, conductor count and total loss."],"steps":[{"id":"one-load","title":"Hold the load fixed","kind":"intro","headline":"100 kW delivered. AC versus DC.","caption":"480 V three-phase AC versus 800 V two-wire DC, measured at the feeder receiving end.","notes":["The intended comparison is four-hundred-and-eighty-volt balanced three-phase AC versus eight-hundred-volt two-wire DC. Each feeder delivers one hundred kilowatts of real power at its receiving end. Conversion is outside this first comparison; we account for complete delivery paths at the end.","For AC, four hundred and eighty volts means line-to-line RMS voltage. Line-to-line means measured between two phase conductors. RMS is the effective value used to calculate resistive heating; it is not the peak voltage. Power factor is real power divided by apparent power. Here we use ideal balanced sinusoidal AC with power factor one.","Count three current-carrying conductors for AC and two for DC. Protective earth and any neutral are outside this simplified comparison. Distribution voltage does not mean that the processor itself operates at eight hundred volts."],"duration_seconds":30,"cue":"Point to the fixed 100 kW receiving-end power. Define the AC voltage convention; the next visual counts conductors.","explanation":["Compare 480 V balanced three-phase AC with 800 V two-wire DC. Both feeders deliver 100 kW of real power at their receiving ends. The equipment picture locates the idea; it is not a wiring diagram.","AC voltage is line-to-line RMS, with power factor equal to one. Count three AC lines and two DC conductors; exclude protective earth and any neutral. Conversion losses are outside this feeder comparison."]},{"id":"current-prediction","title":"Predict the current","kind":"current","headline":"Fewer conductors. Less current?","caption":"100 kW received; 480 V AC line-to-line RMS, power factor 1; compare current per conductor.","notes":["Predict before revealing: does two conductors instead of three automatically mean less current in each? No. The AC feeder transfers power across three phases, so we must use the three-phase power equation rather than the DC equation.","For DC, current equals power divided by voltage. For balanced three-phase AC, line current equals real power divided by the square root of three times line-to-line RMS voltage times power factor. At one hundred kilowatts and power factor one, the four-hundred-and-eighty-volt AC feeder carries about 120.3 amperes in each line. At eight hundred volts, each DC conductor carries 125 amperes.","The DC current per conductor is about four percent higher in this comparison. Move only the DC voltage control: raising it reduces DC current, while the 480 V AC reference stays fixed. The following scenes return to the stated 800 V DC case."],"duration_seconds":50,"cue":"Leave both currents hidden. Ask whether fewer conductors guarantee less current per conductor, then Reveal. Move the DC voltage slider while keeping the AC reference fixed.","explanation":["For DC, I = P/V. For balanced three-phase AC, I = P/(√3 × V_line-to-line × PF). At 100 kW, 480 V AC and PF = 1 give 120.3 A per line; 800 V DC gives 125 A per conductor.","Two instead of three is 33% fewer current-carrying conductors, not 33% less current. The DC voltage slider changes only this scene; later comparisons use 800 V again."]},{"id":"conductor-loss","title":"Connect current to heating","kind":"loss","headline":"Count every conductor's heat.","caption":"Resistance: 10 mΩ per conductor in both cases; three AC conductors versus two DC conductors.","notes":["Each conductor produces heat at current squared times resistance. AC uses RMS current in this calculation. To compare total feeder heat, add the losses from all three AC conductors or both DC conductors.","Give each conductor an invented resistance of ten milliohms. For AC, three times 120.281 amperes squared times 0.01 ohm is about 434 watts. For DC, two times 125 amperes squared times 0.01 ohm is 312.5 watts. DC produces 72 percent as much conductor heat, or 28 percent less, despite slightly higher current in each conductor.","This result depends on the stated voltages, power factor and equal resistance per conductor. It is not a universal DC advantage or a whole-facility saving. Two instead of three also means 33 percent less conductor material only if conductor lengths, cross-sections and materials remain equal. A real design must meet thermal and other constraints."],"duration_seconds":45,"cue":"Ask how to combine heating across the wires. Reveal 3I²R versus 2I²R, then point to 28% less conductor heat. Distinguish that result from current and copper quantity.","explanation":["At equal resistance R per conductor, total feeder heat is 3I_AC²R for balanced three-phase AC and 2I_DC²R for two-wire DC. With R = 0.01 Ω, the losses are about 434.0 W and 312.5 W respectively.","The DC-to-AC loss ratio is 0.72: 28% less conductor heat under these assumptions. This does not mean 28% less current or 28% less facility electricity. Fewer conductors imply proportionally less conductor material only if their lengths, cross-sections and materials stay equal."]},{"id":"conversion-in-rack","title":"Locate conversion in the rack","kind":"ac","headline":"First, locate the converter.","caption":"AC reaches the rack. Conceptual schematic, not a wiring diagram.","notes":["The current calculation does not choose an architecture for us. We also need to locate the equipment that changes voltage and converts alternating current to direct current.","In this simplified arrangement, facility AC reaches the compute rack. Conversion happens there, followed by regulation near the devices. Trace those functions from the incoming supply toward the load. We are showing selected functional boundaries; protection, grounding and other required equipment are omitted from this schematic."],"duration_seconds":40,"cue":"Trace the diagram left to right. Point to rack conversion and final device regulation. Keep the load position consistent for the next two steps.","explanation":["A simplified AC-to-rack arrangement brings alternating current to the rack, converts it to DC there, and regulates voltage again near the devices.","The functional drawing omits protection, grounding and other required equipment. It locates conversion without specifying a buildable installation."]},{"id":"conversion-in-sidecar","title":"Move conversion into a sidecar","kind":"sidecar","headline":"Move conversion. Keep the upstream obligations.","caption":"Existing upstream AC remains. Conceptual schematic, not a wiring diagram.","notes":["Now move conversion into a nearby power rack or sidecar. The higher-voltage DC segment begins after that converter. Existing facility AC is still upstream; follow that retained path before looking at the new segment.","Moving conversion can free space in the compute rack and move some heat elsewhere. The converter still needs space, cooling and service access. Its upstream electrical limits remain relevant. Final voltage reduction near the processor also remains necessary. We have moved equipment and interfaces, not made their requirements disappear."],"duration_seconds":45,"cue":"Point to the converter's new location, then deliberately return to the retained upstream AC path. Finish at the device-regulation stage.","explanation":["A sidecar arrangement keeps upstream AC but places AC-to-DC conversion in nearby equipment. The 800 V DC segment begins after that conversion.","Moving the converter moves its space, heat and maintenance requirements. The processor still needs a much lower voltage; upstream AC limits remain relevant."]},{"id":"conversion-farther-upstream","title":"Move conversion farther upstream","kind":"facility","headline":"A broader DC path changes more interfaces.","caption":"Conversion moves upstream. Conceptual schematic, not a wiring diagram.","notes":["A broader facility-DC proposal moves conversion farther upstream. That extends the portion of the path carrying DC and changes which equipment interfaces must be designed together.","These three views show different placements of functions. They do not rank whole-system efficiency. Converter performance, protection, insulation, transients, cooling and maintenance still need evaluation. The useful question is which actual project constraint this arrangement would relieve."],"duration_seconds":35,"cue":"Trace where DC now begins. Compare conversion placement with the preceding views; avoid implying that either proposal is a measured installed deployment.","explanation":["Broader facility DC places conversion farther upstream and extends the DC portion of the path. That changes which interfaces must be coordinated.","These diagrams compare placement. They do not establish an efficiency ranking or demonstrate an installed deployment."]},{"id":"energy-balance","title":"Close the energy balance","kind":"energy","headline":"Less heat. Less energy required upstream.","caption":"480 V AC versus 800 V DC; 10 mΩ per conductor; converters excluded; one hour.","duration_seconds":50,"cue":"Ask what the source must supply in addition to the 100 kW load. Reveal the balances, then read input = useful output + conductor heat. Explain the one-hour energy comparison.","notes":["Keep the same feeder assumptions: one hundred kilowatts received, four hundred and eighty volts line-to-line RMS for balanced AC at power factor one, eight hundred volts for DC, and ten milliohms per conductor. These are receiving-end voltages. The sending supply must cover the resistive voltage drop.","The three AC conductors together dissipate about 0.434 kilowatts, so the source supplies about 100.434 kilowatts. The two DC conductors dissipate 0.3125 kilowatts, so their source supplies 100.3125 kilowatts. Both receiving ends get exactly one hundred kilowatts. Input equals useful output plus heat.","Over one hour, this DC feeder requires about 0.122 fewer kilowatt-hours at its input. It wastes less energy as conductor heat; no energy is created. Converters and cooling are excluded. A 28 percent reduction in this small conductor-loss budget is a much smaller percentage of total input energy."],"explanation":["Keep 100 kW at each feeder receiving end: 480 V balanced three-phase AC at power factor one versus 800 V two-wire DC. Each conductor has 10 mΩ resistance. The sending supply covers the conductor voltage drop.","Input equals delivered power plus conductor heat: about 100.434 kW for AC and 100.313 kW for DC. Over one hour, DC requires about 0.122 kWh less input under these assumptions.","The 28% figure applies to conductor heat, not total input energy. Converter and cooling losses remain outside this feeder balance."]},{"id":"ac-dc-ledger","title":"Compare complete delivery paths","kind":"paths","headline":"AC versus DC: account for every loss.","caption":"480 V AC: three-phase, line-to-line RMS, PF 1. 800 V DC: two conductors. Resistance: 10 mΩ/conductor.","duration_seconds":70,"cue":"Point to the final 100 kW DC load and the conversion stages. Reveal the input balances. Raise total DC conversion loss to 6 kW; track the resulting feeder power and heat before comparing inputs.","notes":["Now change the boundary deliberately. Earlier, each feeder delivered one hundred kilowatts at its receiving end, with conversion excluded. Here both paths begin at the same facility AC supply boundary and serve the same final one-hundred-kilowatt DC load. A converter downstream of a feeder needs input power for the useful load plus its own losses. That extra power raises feeder current and conductor heat.","Keep the feeder voltages and resistance: four hundred and eighty volts line-to-line RMS for balanced three-phase AC at power factor one, eight hundred volts for two-wire DC, and ten milliohms per conductor. Assume four kilowatts of conversion loss downstream of the AC feeder, so it must deliver 104 kilowatts. For DC, assume one kilowatt of upstream rectifier loss and two kilowatts of downstream DC-to-DC loss. Its feeder must deliver 102 kilowatts.","Calculate conductor heat from those receiving-end powers. AC conductor heat is about 0.469 kilowatts; its required facility input is about 104.469 kilowatts. DC conductor heat is about 0.325 kilowatts; adding both conversion losses gives about 103.325 kilowatts input. Over one hour, this DC arrangement requires about 1.144 fewer kilowatt-hours.","Raise total DC conversion loss to six kilowatts. The upstream rectifier loss stays at one, so downstream loss becomes five. The DC feeder now delivers 105 kilowatts, conductor heat rises to about 0.345 kilowatts, and facility input becomes about 106.345 kilowatts. It uses about 1.875 more kilowatt-hours over the hour than AC. Break-even total DC conversion loss is about 4.137 kilowatts, between the slider positions 4.1 and 4.2.","The conversion losses are hypothetical watts at these operating points, not manufacturer efficiencies. Conductor heat is calculated, not assigned a separate budget. Cooling and other losses are excluded, and voltage compatibility is not modeled. For dense racks, the useful question is how 800 V DC distribution and conversion placement change conductor, space and heat constraints while still meeting the complete energy balance. The earlier 28 percent conductor-loss reduction is not a fixed whole-path or facility saving."],"explanation":["Earlier, the 100 kW boundary was each feeder receiving end. Now it is the final useful DC load, and both paths start at the same facility AC supply boundary. Downstream conversion losses add to the power the feeder must deliver, so they also affect its current and conductor heat.","The 480 V AC feeder delivers 104 kW: 100 kW useful load plus 4 kW assumed downstream conversion loss. The 800 V DC feeder delivers 102 kW: 100 kW useful load plus 2 kW assumed downstream loss. DC also has a fixed 1 kW upstream rectifier loss. With 10 mΩ per conductor, calculated conductor heat is about 0.469 kW for AC and 0.325 kW for DC.","Required input is about 104.469 kW for AC and 103.325 kW for DC. Over one hour, DC uses about 1.144 kWh less input. Raise total DC conversion loss from 3 to 6 kW: downstream loss and feeder current increase, and DC then uses about 1.875 kWh more than AC.","Conversion losses are hypothetical operating-point assumptions; conductor heat is calculated from them. Cooling, other losses and voltage compatibility are outside the model. This comparison does not establish a universal AC/DC efficiency ranking."]}],"sources":[{"title":"NVIDIA: Why Scaling AI Compute Performance Requires a New Power Architecture","url":"https://blogs.nvidia.com/blog/800-vdc-power-architecture-ai-factory/","claim":"Architecture context for higher-voltage DC distribution and conversion placement. Feeder values and conversion losses are original teaching assumptions; conductor heat is calculated from the power each feeder must deliver.","reviewed_on":"2026-09-08","limits":"Vendor roadmap; proposed architecture and availability expectations are distinct from verified installed deployment."},{"title":"Schneider Electric: Total power calculation for accuracy verification testing","url":"https://productinfo.se.com/pm2200/5afc2b5546e0fb00011e5e9d/PM2200%20series%20User%20Manual/English/BM_PM2200seriesUserManual_0000074170.ditamap.xml/%24/C_VerifyingAccuracy_PowerTotCalcuation_0000034437","claim":"Balanced three-phase real power is 3 × line-to-neutral RMS voltage × line current × power factor, equivalent to √3 × line-to-line RMS voltage × line current × power factor.","reviewed_on":"2026-09-08","limits":"Balanced three-phase relationship. Numerical loads, voltages, resistance and conversion losses are original teaching assumptions; calculated conductor losses are not equipment specifications."},{"title":"NVIDIA: Gigawatt AI factories and the 800 V DC transition","url":"https://blogs.nvidia.com/blog/gigawatt-ai-factories-ocp-vera-rubin/","claim":"Identifies 415 or 480 V three-phase AC systems as relevant baselines for the proposed transition to 800 V DC.","reviewed_on":"2026-09-08","limits":"Used only for baseline relevance. Vendor current, efficiency, copper and deployment claims are not validated by this teaching calculation."}],"aliases":{"feeder-transfer":"ac-dc-ledger"}}

    <script>
      function positive(value, name) {
  if (!Number.isFinite(value) || value <= 0)
    throw new RangeError(`${name} must be positive and finite`);
  return value;
}
function dcModel(kw, volts) {
  positive(kw, "Power");
  positive(volts, "Voltage");
  return {
    amps: (kw * 1000) / volts,
    referenceAmps: (kw * 1000) / 48,
    lossRatio: (48 / volts) ** 2,
  };
}
function thermalModel(kw, deltaT, auxiliaryKW) {
  positive(kw, "Heat duty");
  positive(deltaT, "Temperature rise");
  if (!Number.isFinite(auxiliaryKW) || auxiliaryKW < 0)
    throw new RangeError("Auxiliary input must be nonnegative");
  return {
    kgPerSecond: kw / (4.18 * deltaT),
    litersPerMinute: (kw / (4.18 * deltaT)) * 60,
    rejectedKW: kw + auxiliaryKW,
  };
}
function transferModel(gigabytes, gbps, efficiency) {
  positive(gigabytes, "Payload");
  positive(gbps, "Link rate");
  if (!Number.isFinite(efficiency) || efficiency <= 0 || efficiency > 1)
    throw new RangeError("Efficiency must lie in (0, 1]");
  const GBps = (gbps / 8) * efficiency;
  return { GBps, seconds: gigabytes / GBps };
}
function rooflineModel(intensity, bandwidthTBps, peakTFLOPS) {
  positive(intensity, "Arithmetic intensity");
  positive(bandwidthTBps, "Bandwidth");
  positive(peakTFLOPS, "Peak compute");
  const memoryCeiling = intensity * bandwidthTBps;
  return {
    memoryCeiling,
    ceiling: Math.min(memoryCeiling, peakTFLOPS),
    binding:
      memoryCeiling < peakTFLOPS
        ? "memory bandwidth"
        : memoryCeiling > peakTFLOPS
          ? "compute"
          : "both ceilings",
  };
}
function continuityModel(
  kwh,
  efficiency,
  loadKW,
  inverterKW,
  auxiliarySupported,
) {
  positive(kwh, "Stored energy");
  positive(loadKW, "Load");
  positive(inverterKW, "Inverter rating");
  if (!Number.isFinite(efficiency) || efficiency <= 0 || efficiency > 1)
    throw new RangeError("Efficiency must lie in (0, 1]");
  return {
    powerSufficient: inverterKW >= loadKW,
    electricalMinutes:
      inverterKW >= loadKW ? ((kwh * efficiency) / loadKW) * 60 : 0,
    auxiliarySupported: Boolean(auxiliarySupported),
  };
}
function checkpointModel(checkpointSeconds, intervalSeconds, mttfHours) {
  positive(checkpointSeconds, "Checkpoint duration");
  positive(intervalSeconds, "Interval");
  positive(mttfHours, "MTTF");
  const mttfSeconds = mttfHours * 3600;
  return {
    checkpointFraction: checkpointSeconds / intervalSeconds,
    recomputeFraction: intervalSeconds / (2 * mttfSeconds),
    optimumSeconds: Math.sqrt(2 * checkpointSeconds * mttfSeconds),
  };
}
function capacityModel(
  siteMW,
  overheadMW,
  coolingMW,
  rackKW,
  acceptedRacks,
) {
  positive(siteMW, "Site limit");
  positive(rackKW, "Rack load");
  if (
    ![overheadMW, coolingMW, acceptedRacks].every(
      (v) => Number.isFinite(v) && v >= 0,
    ) ||
    overheadMW > siteMW ||
    !Number.isInteger(acceptedRacks)
  )
    throw new RangeError("Capacity inputs are outside the stated domain");
  const powerMW = siteMW - overheadMW,
    acceptedMW = (acceptedRacks * rackKW) / 1000;
  const limit = Math.min(powerMW, coolingMW, acceptedMW);
  return {
    racks: Math.floor((limit * 1000) / rackKW + 1e-9),
    powerMW,
    acceptedMW,
    binding: [
      ["electrical budget", powerMW],
      ["cooling", coolingMW],
      ["accepted rack paths", acceptedMW],
    ]
      .filter(([, v]) => Math.abs(v - limit) < 1e-9)
      .map(([name]) => name),
  };
}

function dcConductorModel(loadKW, loadVolts, loopOhms, hours) {
  positive(loadKW, "Delivered power");
  positive(loadVolts, "Receiving-end voltage");
  positive(hours, "Duration");
  if (!Number.isFinite(loopOhms) || loopOhms < 0)
    throw new RangeError("Loop resistance must be nonnegative and finite");
  const amps = (loadKW * 1000) / loadVolts;
  const lossKW = (amps * amps * loopOhms) / 1000;
  const inputKW = loadKW + lossKW;
  return {
    amps,
    lossKW,
    inputKW,
    sendingVolts: loadVolts + amps * loopOhms,
    deliveredKWh: loadKW * hours,
    lossKWh: lossKW * hours,
    inputKWh: inputKW * hours,
  };
}
function acdcConductorModel(
  loadKW,
  acVolts,
  dcVolts,
  powerFactor,
  conductorOhms,
  hours,
) {
  positive(loadKW, "Delivered real power");
  positive(acVolts, "Receiving-end AC line-to-line RMS voltage");
  positive(dcVolts, "Receiving-end DC pair voltage");
  positive(hours, "Duration");
  if (!Number.isFinite(powerFactor) || powerFactor <= 0 || powerFactor > 1)
    throw new RangeError("Power factor must lie in (0, 1]");
  if (!Number.isFinite(conductorOhms) || conductorOhms < 0)
    throw new RangeError(
      "Resistance per conductor must be nonnegative and finite",
    );
  function segment(amps, conductors) {
    const lossKW = (conductors * amps ** 2 * conductorOhms) / 1000;
    return {
      amps,
      conductors,
      lossKW,
      inputKW: loadKW + lossKW,
      deliveredKWh: loadKW * hours,
      lossKWh: lossKW * hours,
      inputKWh: (loadKW + lossKW) * hours,
    };
  }
  const ac = segment(
    (loadKW * 1000) / (Math.sqrt(3) * acVolts * powerFactor),
    3,
  );
  const dc = segment((loadKW * 1000) / dcVolts, 2);
  return { ac, dc, lossRatio: (2 * dc.amps ** 2) / (3 * ac.amps ** 2) };
}
function deliveryPathModel(
  loadKW,
  conversionLossKW,
  conductorLossKW,
  hours,
) {
  positive(loadKW, "Delivered power");
  positive(hours, "Duration");
  if (
    ![conversionLossKW, conductorLossKW].every(
      (v) => Number.isFinite(v) && v >= 0,
    )
  )
    throw new RangeError("Stipulated losses must be nonnegative and finite");
  const lossKW = conversionLossKW + conductorLossKW;
  return {
    lossKW,
    inputKW: loadKW + lossKW,
    inputKWh: (loadKW + lossKW) * hours,
    efficiency: loadKW / (loadKW + lossKW),
  };
}
function acdcDeliveryModel(
  loadKW,
  acVolts,
  dcVolts,
  powerFactor,
  conductorOhms,
  hours,
  acConversionKW,
  dcConversionKW,
  dcUpstreamConversionKW,
) {
  if (
    ![acConversionKW, dcConversionKW, dcUpstreamConversionKW].every(
      (v) => Number.isFinite(v) && v >= 0,
    ) ||
    dcUpstreamConversionKW > dcConversionKW
  )
    throw new RangeError(
      "Conversion losses must be nonnegative with upstream loss within the DC total",
    );
  const dcDownstreamKW = dcConversionKW - dcUpstreamConversionKW;
  const acFeederKW = loadKW + acConversionKW;
  const dcFeederKW = loadKW + dcDownstreamKW;
  const ac = acdcConductorModel(
    acFeederKW,
    acVolts,
    dcVolts,
    powerFactor,
    conductorOhms,
    hours,
  ).ac;
  const dc = acdcConductorModel(
    dcFeederKW,
    acVolts,
    dcVolts,
    powerFactor,
    conductorOhms,
    hours,
  ).dc;
  return {
    ac: {
      ...deliveryPathModel(loadKW, acConversionKW, ac.lossKW, hours),
      conductorLossKW: ac.lossKW,
      amps: ac.amps,
      feederKW: acFeederKW,
    },
    dc: {
      ...deliveryPathModel(loadKW, dcConversionKW, dc.lossKW, hours),
      conductorLossKW: dc.lossKW,
      amps: dc.amps,
      feederKW: dcFeederKW,
    },
    dcDownstreamKW,
  };
}

const PRESENTATION = JSON.parse(
  document.getElementById("presentation-data").textContent,
);
const STEPS = PRESENTATION.steps;
const DEFAULTS = PRESENTATION.defaults;
const notesMode = document.body.dataset.view === "notes";
const teachingMode = document.body.dataset.view === "teach";
const studentMode = !notesMode && !teachingMode;
const byId = (id) => document.getElementById(id);
const escapeHTML = (value) =>
  String(value).replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const fmt = (value, decimals = 0) =>
  value.toLocaleString("en-US", { maximumFractionDigits: decimals });
let index = Math.max(
  0,
  STEPS.findIndex(
    (step) =>
      step.id ===
      (PRESENTATION.aliases?.[location.hash.slice(1)] ||
        location.hash.slice(1)),
  ),
);
let state = {
  index,
  revealed: [],
  volts: DEFAULTS.comparison_voltage_v,
  dcConversionKW: DEFAULTS.dc_conversion_kw,
};
const session =
  new URLSearchParams(location.search).get("session") || crypto.randomUUID();
const channel =
  !studentMode && typeof BroadcastChannel === "function"
    ? new BroadcastChannel(`gigawatt-sample-${session}`)
    : null;
const role = notesMode ? "notes" : "audience";
const revealKinds = new Set(["current", "loss", "energy", "paths"]);
const isRevealed = () => state.revealed.includes(STEPS[state.index].id);

function validState(value) {
  return (
    value &&
    Number.isInteger(value.index) &&
    value.index >= 0 &&
    value.index < STEPS.length &&
    Array.isArray(value.revealed) &&
    value.revealed.every((id) => STEPS.some((s) => s.id === id)) &&
    Number.isFinite(value.volts) &&
    value.volts >= 400 &&
    value.volts <= 1000 &&
    Number.isFinite(value.dcConversionKW) &&
    value.dcConversionKW >= 1 &&
    value.dcConversionKW <= 7
  );
}
function publish() {
  channel?.postMessage({ type: "state", role, state });
}
function change(patch, announce = true) {
  state = { ...state, ...patch };
  history.replaceState(null, "", `#${STEPS[state.index].id}`);
  render();
  if (announce) publish();
}
function move(delta) {
  change({
    index: Math.max(0, Math.min(STEPS.length - 1, state.index + delta)),
  });
}
function reveal() {
  const step = STEPS[state.index];
  if (!revealKinds.has(step.kind)) return;
  change({
    revealed: isRevealed()
      ? state.revealed.filter((id) => id !== step.id)
      : [...state.revealed, step.id],
  });
}
function renderSteps() {
  const buttons = STEPS.map(
    (s, i) =>
      `<button data-step="${i}" ${i === state.index ? 'aria-current="step"' : ""} aria-label="${i + 1}. ${escapeHTML(s.title)}">${i + 1}</button>`,
  ).join("");
  byId("steps").innerHTML = buttons;
  byId("notes-outline").innerHTML = STEPS.map(
    (s, i) =>
      `<button data-step="${i}" ${i === state.index ? 'aria-current="step"' : ""}>${i + 1}. ${escapeHTML(s.title)}</button>`,
  ).join("");
  document
    .querySelectorAll("[data-step]")
    .forEach((b) =>
      b.addEventListener("click", () =>
        change({ index: Number(b.dataset.step) }),
      ),
    );
}
function metric(value, unit) {
  return `<div class="metric">${value} <small>${unit}</small></div>`;
}
function intro() {
  return `<div class="hero"><div class="hero-copy"><span class="chip">480 V AC ↔ 800 V DC</span><div class="hero-number">100<small> kW</small></div><p>Real power arriving<br>at the feeder end</p></div><img src="assets/power-equipment.png" width="1672" height="941" alt="Illustrative conversion equipment beside a compute rack; not a wiring diagram or an equipment rating." /></div>`;
}
function conductorNumbers(volts = DEFAULTS.comparison_voltage_v) {
  return acdcConductorModel(
    DEFAULTS.power_kw,
    DEFAULTS.reference_voltage_v,
    volts,
    DEFAULTS.power_factor,
    DEFAULTS.conductor_ohms,
    DEFAULTS.hours,
  );
}
function conductors(labels) {
  return `<div class="conductor-lines" aria-label="${labels.length} current-carrying conductors">${labels.map((label) => `<div><span>${label}</span><i></i></div>`).join("")}</div>`;
}
function current() {
  const { ac, dc } = conductorNumbers(state.volts);
  const shown = isRevealed();
  return `<div class="model"><div class="model-top"><span class="chip">${DEFAULTS.power_kw} kW REAL POWER · AC PF = ${DEFAULTS.power_factor}</span><span class="ledger-formula">Current in each conductor</span></div><div class="comparison"><div class="metric-card"><p class="metric-label">${DEFAULTS.reference_voltage_v} V three-phase AC</p>${metric(shown ? fmt(ac.amps, 1) : "?", "A")}<p class="metric-sub">RMS · I = P / (√3 × V<sub>LL</sub> × PF)</p>${conductors(["L1", "L2", "L3"])}</div><div class="metric-card changed"><p class="metric-label"><span id="variable-voltage">${state.volts}</span> V DC</p><div id="variable-current">${metric(shown ? fmt(dc.amps, 1) : "?", "A")}</div><p class="metric-sub" id="variable-derivation">${shown ? `${fmt(DEFAULTS.power_kw * 1000)} W ÷ ${state.volts} V` : "I = P / V"}</p>${conductors(["+", "−"])}</div></div>${shown ? `<div class="control-line"><label for="voltage">Try another DC voltage</label><input id="voltage" type="range" min="400" max="1000" step="1" value="${state.volts}" /><output id="voltage-value" for="voltage">${state.volts} V</output><button id="reset-voltage">800 V</button></div>` : `<div class="control-line"><button class="reveal" id="reveal">Reveal the currents</button></div>`}</div>`;
}
function loss() {
  const shown = isRevealed(),
    ratio = conductorNumbers().lossRatio * 100;
  return `<div class="model"><div class="model-top"><span class="chip">EQUAL RESISTANCE PER CONDUCTOR · PF = 1</span><span class="ledger-formula">Add the heat from every conductor</span></div><div class="comparison"><div class="metric-card"><p class="metric-label">480 V three-phase AC</p>${metric("100", "%")}<p class="metric-sub">3 × I²R · reference conductor loss</p><div class="loss-track"><div class="loss-bar" style="width:100%"></div></div></div><div class="metric-card changed"><p class="metric-label">800 V DC</p>${metric(shown ? fmt(ratio, 1) : "?", "%")}<p class="metric-sub">2 × I²R · of the AC conductor loss</p><div class="loss-track">${shown ? `<div class="loss-bar" style="width:${ratio}%"></div>` : ""}</div></div></div>${shown ? `<p class="bridge">${fmt(100 - ratio)}% less conductor heat at these assumptions.</p>` : `<div class="control-line"><button class="reveal" id="reveal">Reveal the loss comparison</button></div>`}</div>`;
}
function unit(label, style = "", detail = "") {
  return `<div class="unit ${style}">${label}${detail ? `<small>${detail}</small>` : ""}</div>`;
}
function architecture(kind) {
  const converter = unit("AC → DC", "converter", "conversion");
  const regulator = unit("DC → DC", "converter", "device regulation");
  const chip = unit("Compute", "chip-unit", "low device voltage");
  const arrow = '<span class="wire" aria-hidden="true">→</span>';
  let facility, adjacent, rack;
  if (kind === "ac") {
    facility = unit("Facility AC");
    adjacent = unit("AC path");
    rack = converter + arrow + regulator + arrow + chip;
  }
  if (kind === "sidecar") {
    facility = unit("Facility AC");
    adjacent = converter + arrow + unit("800 V DC");
    rack = regulator + arrow + chip;
  }
  if (kind === "facility") {
    facility = converter;
    adjacent = unit("Broader DC path");
    rack = regulator + arrow + chip;
  }
  const observation = {
    ac: "Conversion occupies space in the compute rack.",
    sidecar: "The sidecar still needs power, cooling and service access.",
    facility: "A longer DC path means more interfaces to coordinate.",
  }[kind];
  return `<div class="architecture"><div class="path"><section class="zone ${kind === "facility" ? "active" : ""}"><h2 class="zone-title">Upstream facility</h2><div class="zone-body">${facility}</div></section><section class="zone ${kind === "sidecar" ? "active" : ""}"><h2 class="zone-title">${kind === "sidecar" ? "Nearby power rack / sidecar" : "Distribution space"}</h2><div class="zone-body">${adjacent}</div></section><section class="zone rack ${kind === "ac" ? "active" : ""}"><h2 class="zone-title">Compute rack</h2><div class="zone-body">${rack}</div></section></div><p class="path-label">${kind === "ac" ? "AC toward the rack" : kind === "sidecar" ? "AC to the sidecar → 800 V DC toward the rack" : "AC conversion upstream → DC across the facility"}</p><p class="boundary-line">${observation}</p></div>`;
}
function ledgerCard(title, rows, inputKW, shown, changed = false) {
  return `<section class="ledger-card ${changed ? "changed" : ""}"><h2>${title}</h2><dl>${rows.map(([label, value]) => `<div><dt>${label}</dt><dd>${value} <small>kW</small></dd></div>`).join("")}</dl><div class="ledger-total"><span>Required input</span><strong>${shown ? fmt(inputKW, 3) : "?"} <small>kW</small></strong></div></section>`;
}
function energy() {
  const { ac, dc } = conductorNumbers();
  const shown = isRevealed();
  return `<div class="energy-ledger"><div class="model-top"><span class="chip">SAME 100 kW AT THE FEEDER END</span><span class="ledger-formula">Input = delivered power + heat</span></div><div class="comparison">${ledgerCard(
    "480 V three-phase AC",
    [
      ["Delivered power", "100"],
      ["Conductor heat", fmt(ac.lossKW, 3)],
    ],
    ac.inputKW,
    shown,
  )}${ledgerCard(
    "800 V DC",
    [
      ["Delivered power", "100"],
      ["Conductor heat", fmt(dc.lossKW, 3)],
    ],
    dc.inputKW,
    shown,
    true,
  )}</div><div class="ledger-result">${shown ? `<strong>${fmt(ac.inputKWh - dc.inputKWh, 3)} kWh less input over 1 h</strong><span>Same delivered power. Less conductor heat. Converters excluded.</span>` : `<button id="reveal">Reveal the required input</button>`}</div></div>`;
}
function pathNumbers() {
  return acdcDeliveryModel(
    DEFAULTS.power_kw,
    DEFAULTS.reference_voltage_v,
    DEFAULTS.comparison_voltage_v,
    DEFAULTS.power_factor,
    DEFAULTS.conductor_ohms,
    DEFAULTS.hours,
    DEFAULTS.ac_conversion_kw,
    state.dcConversionKW,
    DEFAULTS.dc_upstream_conversion_kw,
  );
}
function pathResult(ac, dc) {
  const difference = ac.inputKWh - dc.inputKWh;
  return Math.abs(difference) < 1e-9
    ? "Same input energy over 1 h"
    : `DC uses ${fmt(Math.abs(difference), 3)} kWh ${difference > 0 ? "less" : "more"} input over 1 h`;
}
function paths() {
  const { ac, dc } = pathNumbers(),
    shown = isRevealed();
  return `<div class="energy-ledger"><div class="model-top"><span class="chip">SAME AC INPUT BOUNDARY · 100 kW FINAL DC LOAD</span><span class="ledger-formula">Input = load + all path losses</span></div><div class="comparison">${ledgerCard(
    "480 V AC-distributed path",
    [
      ["Final DC load", "100"],
      ["Conductors · calculated", fmt(ac.conductorLossKW, 3)],
      ["Conversion · assumed", fmt(DEFAULTS.ac_conversion_kw)],
    ],
    ac.inputKW,
    shown,
  )}<div id="dc-path-card">${ledgerCard(
    "800 V DC-distributed path",
    [
      ["Final DC load", "100"],
      ["Conductors · calculated", fmt(dc.conductorLossKW, 3)],
      ["Conversion · assumed", fmt(state.dcConversionKW, 1)],
    ],
    dc.inputKW,
    shown,
    true,
  )}</div></div><p class="path-assumption">AC: conversion after feeder. DC: 1 kW before feeder; remaining conversion after.</p>${shown ? `<div class="control-line"><label for="dc-conversion">Total DC conversion loss</label><input id="dc-conversion" type="range" min="1" max="7" step="0.1" value="${state.dcConversionKW}" /><output id="dc-conversion-value" for="dc-conversion">${fmt(state.dcConversionKW, 1)} kW</output><button id="dc-loss-reset">Reset</button></div><div class="ledger-result"><strong id="path-result">${pathResult(ac, dc)}</strong></div>` : `<div class="ledger-result"><button id="reveal">Reveal both input budgets</button></div>`}</div>`;
}
function renderNotes() {
  const step = STEPS[state.index];
  byId("notes-title").textContent = PRESENTATION.title;
  byId("notes-position").textContent =
    `VISUAL ${state.index + 1} OF ${STEPS.length} · ~${step.duration_seconds} SECONDS PLANNED`;
  byId("notes-headline").textContent = step.headline;
  byId("notes-cue").textContent = step.cue;
  byId("narration").innerHTML = step.notes
    .map((p) => `<p>${escapeHTML(p)}</p>`)
    .join("");
  if (step.kind === "current" && isRevealed())
    byId("narration").insertAdjacentHTML(
      "afterbegin",
      `<p class="cue">Live DC comparison: ${state.volts} V · ${fmt(conductorNumbers(state.volts).dc.amps, 1)} A. AC stays at 480 V · ${fmt(conductorNumbers().ac.amps, 1)} A RMS</p>`,
    );
  if (step.kind === "paths" && isRevealed()) {
    const { ac, dc } = pathNumbers();
    byId("narration").insertAdjacentHTML(
      "afterbegin",
      `<p class="cue">Live DC conversion loss: ${fmt(state.dcConversionKW, 1)} kW total; ${fmt(state.dcConversionKW - DEFAULTS.dc_upstream_conversion_kw, 1)} kW after the feeder. DC feeder carries ${fmt(dc.feederKW, 1)} kW at ${fmt(dc.amps, 2)} A. ${pathResult(ac, dc)}.</p>`,
    );
  }
  byId("notes-next").textContent =
    STEPS[state.index + 1]?.headline ||
    "End of sample. Discuss the learner’s reasoning.";
  byId("notes-previous").disabled = state.index === 0;
  byId("notes-next-button").disabled = state.index === STEPS.length - 1;
  byId("notes-reveal").hidden = !revealKinds.has(step.kind);
  byId("notes-reveal").textContent = isRevealed()
    ? "Hide answer"
    : "Reveal answer";
  byId("audience-link").href =
    `teach.html?session=${encodeURIComponent(session)}#${step.id}`;
}
function bindVisual() {
  byId("dc-conversion")?.addEventListener("input", (event) => {
    state.dcConversionKW = Number(event.target.value);
    const { ac, dc } = pathNumbers();
    byId("dc-path-card").innerHTML = ledgerCard(
      "800 V DC-distributed path",
      [
        ["Final DC load", "100"],
        ["Conductors · calculated", fmt(dc.conductorLossKW, 3)],
        ["Conversion · assumed", fmt(state.dcConversionKW, 1)],
      ],
      dc.inputKW,
      true,
      true,
    );
    byId("dc-conversion-value").textContent =
      `${fmt(state.dcConversionKW, 1)} kW`;
    byId("path-result").textContent = pathResult(ac, dc);
    publish();
  });
  byId("dc-loss-reset")?.addEventListener("click", () =>
    change({ dcConversionKW: DEFAULTS.dc_conversion_kw }),
  );
  byId("reveal")?.addEventListener("click", reveal);
  byId("voltage")?.addEventListener("input", (event) => {
    state.volts = Number(event.target.value);
    byId("variable-voltage").textContent = state.volts;
    byId("variable-current").innerHTML = metric(
      fmt(conductorNumbers(state.volts).dc.amps, 1),
      "A",
    );
    byId("voltage-value").textContent = `${state.volts} V`;
    byId("variable-derivation").textContent =
      `${fmt(DEFAULTS.power_kw * 1000)} W ÷ ${state.volts} V`;
    publish();
  });
  byId("reset-voltage")?.addEventListener("click", () =>
    change({ volts: DEFAULTS.comparison_voltage_v }),
  );
}
function render() {
  const step = STEPS[state.index];
  document.title = `${notesMode ? "Presenter notes · " : ""}${step.title} — GIGAWATT`;
  renderSteps();
  if (notesMode) {
    renderNotes();
    return;
  }
  const focus = document.activeElement?.id;
  byId("chapter").textContent =
    `800 V DC / ${String(state.index + 1).padStart(2, "0")} · ${step.title}`;
  byId("scene-title").textContent = step.headline;
  byId("caption").textContent = step.caption;
  byId("visual").innerHTML = (
    { intro, current, loss, energy, paths }[step.kind] ||
    (() => architecture(step.kind))
  )();
  byId("previous").disabled = state.index === 0;
  byId("next").disabled = state.index === STEPS.length - 1;
  byId("next").innerHTML =
    state.index === STEPS.length - 1
      ? "<span>End of sample</span> ✓"
      : "<span>Next</span> →";
  if (studentMode)
    byId("student-explanation").innerHTML = step.explanation
      .map((p) => `<p>${escapeHTML(p)}</p>`)
      .join("");
  bindVisual();
  if (focus === "reveal") byId("scene").focus({ preventScroll: true });
}
byId("view-label").textContent = studentMode
  ? "800 V DC · EXPLORE"
  : "800 V DC · TEACH";
byId("open-notes").hidden = !teachingMode;
byId("fullscreen").hidden = !teachingMode;
byId("student-context").hidden = !studentMode;
byId("audience").hidden = notesMode;
byId("presenter").hidden = !notesMode;
byId("previous").addEventListener("click", () => move(-1));
byId("next").addEventListener("click", () => move(1));
byId("notes-previous").addEventListener("click", () => move(-1));
byId("notes-next-button").addEventListener("click", () => move(1));
byId("notes-reveal").addEventListener("click", reveal);
byId("open-notes").addEventListener("click", () => {
  const win = window.open(
    `sample-notes.html?session=${encodeURIComponent(session)}#${STEPS[state.index].id}`,
    `gigawatt-notes-${session}`,
    "popup,width=1120,height=850",
  );
  if (!win)
    byId("notice").textContent =
      "The notes window was blocked. Allow this popup, then select Presenter notes again.";
});
byId("fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    byId("notice").textContent =
      "Fullscreen is unavailable here. Open this page in a standalone browser window.";
  }
});
document.addEventListener("fullscreenchange", () => {
  byId("fullscreen").setAttribute(
    "aria-label",
    document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen",
  );
  byId("fullscreen").innerHTML =
    `⛶ <span>${document.fullscreenElement ? "Exit fullscreen" : "Fullscreen"}</span>`;
});
document.addEventListener("keydown", (event) => {
  if (
    event.altKey ||
    event.ctrlKey ||
    event.metaKey ||
    /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)
  )
    return;
  if (event.key === "ArrowRight" || event.key === "PageDown") {
    event.preventDefault();
    move(1);
  }
  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    move(-1);
  }
  if (event.key.toLowerCase() === "r") reveal();
  if (event.key.toLowerCase() === "p" && teachingMode)
    byId("open-notes").click();
  if (event.key.toLowerCase() === "f" && teachingMode)
    byId("fullscreen").click();
});
window.addEventListener("hashchange", () => {
  const selected = STEPS.findIndex(
    (s) =>
      s.id ===
      (PRESENTATION.aliases?.[location.hash.slice(1)] ||
        location.hash.slice(1)),
  );
  if (selected >= 0) change({ index: selected });
});
if (channel) {
  channel.addEventListener("message", ({ data }) => {
    if (!data || data.role === role) return;
    if (notesMode)
      byId("connection").textContent =
        "Connected to the visual window. Navigation and reveals stay in sync.";
    if (data.type === "hello") publish();
    if (data.type === "state" && validState(data.state))
      change(data.state, false);
  });
  channel.postMessage({ type: "hello", role });
}
byId("connection").textContent = channel
  ? "Open the visual window to connect. These notes also work on their own."
  : "Live synchronization is unavailable in this browser. Advance each window separately.";
render();
;
