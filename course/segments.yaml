# Canonical course order and production intent.
#
# This manifest owns pedagogy only. Facts and sources stay in registered
# evidence ledgers; topology stays in diagram/master.yaml; reusable camera
# geometry stays in diagram/cameras.yaml. Planned shots are production requests,
# not evidence that the corresponding overlay already exists.

schema_version: 2

meta:
  course_id: gigawatt
  inventory_scope: complete_course
  status: inventory_ready_research_gated
  runtime_minutes: null
  relative_weight_total: 27.05
  master: diagram/master.yaml
